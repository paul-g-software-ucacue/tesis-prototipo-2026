# Perfil consolidado del MDD (ADR-006, ADR-013): PostgreSQL, los 4 procesos y el API Gateway.
# Uso: docker compose up -d --wait   (contrato: specs/002-compose-cuatro-procesos/contracts/compose.md)
#
# Las variables llegan por env_file: .env.ejemplo, versionado y con valores ficticios, y encima un
# .env opcional que Git ignora. No hay interpolación ${…} en este archivo.
# Límites de memoria iniciales: 2 944 MiB en total, en un equipo de 8 GiB (R-19, D-36).

x-variables: &variables
  env_file:
    - path: .env.ejemplo
      required: true
    - path: .env
      required: false

# Procesos y gateway: listos cuando /actuator/health/readiness responde UP. Las imágenes de
# Temurin no traen curl ni wget, así que la petición se hace con bash y /dev/tcp (research §6).
x-java: &java
  <<: *variables
  healthcheck:
    test:
      - CMD
      - bash
      - -c
      - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

x-proceso: &proceso
  <<: *java
  depends_on:
    postgres:
      condition: service_healthy
  deploy:
    resources:
      limits:
        memory: 512m

services:
  postgres:
    image: postgres:18.6-alpine
    <<: *variables
    volumes:
      - datos-postgres:/var/lib/postgresql
      # z: etiqueta de SELinux para que el contenedor lea el script; sin SELinux no tiene efecto.
      - ./deploy/postgres/01-esquemas.sh:/docker-entrypoint-initdb.d/01-esquemas.sh:ro,z
    healthcheck:
      # Por TCP: el servidor temporal que ejecuta 01-esquemas.sh solo escucha por el socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d mdd"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  identidad:
    <<: *proceso
    build:
      context: backend
      dockerfile: ../deploy/docker/java.Dockerfile
      args: { MODULO: "apps:identidad", NOMBRE: identidad }

  datos:
    <<: *proceso
    build:
      context: backend
      dockerfile: ../deploy/docker/java.Dockerfile
      args: { MODULO: "apps:datos", NOMBRE: datos }

  distributivo:
    <<: *proceso
    build:
      context: backend
      dockerfile: ../deploy/docker/java.Dockerfile
      args: { MODULO: "apps:distributivo", NOMBRE: distributivo }

  salida:
    <<: *proceso
    build:
      context: backend
      dockerfile: ../deploy/docker/java.Dockerfile
      args: { MODULO: "apps:salida", NOMBRE: salida }

  # Único puerto publicado en el anfitrión. En B00-H02 no enruta, así que no depende de los procesos.
  gateway:
    <<: *java
    build:
      context: backend
      dockerfile: ../deploy/docker/java.Dockerfile
      args: { MODULO: gateway, NOMBRE: gateway }
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 384m

volumes:
  datos-postgres:
