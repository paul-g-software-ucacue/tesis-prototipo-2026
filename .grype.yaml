# Excepciones temporales de Grype (D-54; specs/008-secretos-sca-sbom/contracts/sca.md).
# Solo para una vulnerabilidad alta o crítica con versión corregida que todavía no se puede aplicar.
# Cada una con su motivo y un vencimiento de 30 días como máximo después de desde; al vencer,
# deploy/sca/excepciones.sh la quita y el check 4 · sca vuelve a fallar. Se agrega en un pull
# request que explica el motivo.
#
#  - vulnerability: GHSA-xxxx-xxxx-xxxx
#    package: { name: <dependencia> }
#    reason: "Por qué no se puede actualizar todavía"
#    desde: 2026-10-15
#    vence: 2026-11-14
# Desde 2026-11-01 sin excepciones (D-80, D-81); desde 2026-11-08, las de zlib1g de cloudflared (D-96).
ignore:
  # cloudflared: zlib1g de Debian
  - vulnerability: CVE-2026-76844
    package: { name: zlib1g, version: "1:1.3.dfsg+really1.3.1-1+b1", type: deb }
    reason: "La imagen oficial de cloudflared 2026.10.7, la última publicada, trae zlib1g 1:1.3.dfsg+really1.3.1-1+b1 de Debian; el arreglo (deb13u1) exige que Cloudflare la reconstruya. cloudflared es un binario de Go enlazado estáticamente que no carga la zlib del sistema, y el túnel sigue apagado (D-81)."
    desde: 2026-11-08
    vence: 2026-12-08
  - vulnerability: CVE-2026-85091
    package: { name: zlib1g, version: "1:1.3.dfsg+really1.3.1-1+b1", type: deb }
    reason: "La imagen oficial de cloudflared 2026.10.7, la última publicada, trae zlib1g 1:1.3.dfsg+really1.3.1-1+b1 de Debian; el arreglo (deb13u1) exige que Cloudflare la reconstruya. cloudflared es un binario de Go enlazado estáticamente que no carga la zlib del sistema, y el túnel sigue apagado (D-81)."
    desde: 2026-11-08
    vence: 2026-12-08
