# Actualizaciones semanales agrupadas. Las de GitHub Actions mantienen al día los SHA fijados.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: { interval: weekly }
    groups: { gradle-menores: { update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups: { npm-menores: { update-types: [minor, patch] } }
    # Mayores que se hacen a mano (2026-10-17, PRs #95 a #98 cerrados): @types/node sigue a Node 24
    # (D-53); TypeScript 7 espera a openapi-typescript, y ESLint 10 (con @eslint/js) a
    # eslint-plugin-jsx-a11y. Las menores y los parches siguen llegando en npm-menores.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    # Node se queda en la LTS, la misma en la CI y en la imagen (D-53): el paso a la próxima versión
    # mayor se hace a mano en los dos lugares. Las menores y los parches siguen llegando.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  # Dependencias del binario de Caddy (D-80).
  - package-ecosystem: gomod
    directory: /deploy/docker/caddy
    schedule: { interval: weekly }
  # Imagen de PostgreSQL en compose.yaml (B00-H02).
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
