# CI del MDD: etapas 1 a 4 en cada pull request hacia main.
# Borrador de D-27 / ADR-011 (sdd/pipeline_cicd.md). Antes de usarlo, fija cada acción
# por su SHA completo con `pinact run` (sección 7 del documento).
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- Etapa 1 · Lint
  lint-backend:
    name: "1 · lint-backend"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Formato de Java (Spotless)
        run: ./gradlew spotlessCheck
      - name: Análisis estático (SpotBugs con FindSecBugs)
        run: ./gradlew spotbugsMain
      - name: Informe de SpotBugs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: spotbugs
          path: backend/**/build/reports/spotbugs/
          retention-days: 14

  lint-frontend:
    name: "1 · lint-frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos y cliente desde los contratos (openapi-typescript)
        run: npm run generar:api
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run formato:verificar
      - name: TypeScript
        run: npm run tipos

  # ---------------------------------------------------------------- Etapa 2 · Pruebas
  test-backend:
    name: "2 · test-backend"
    needs: lint-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Unitarias, arquitectura y contrato, con cobertura
        # test: JUnit 5, AssertJ, Mockito, ArchUnit, Spring Modulith y swagger-request-validator.
        # jacocoTestCoverageVerification: 60 % por módulo y 80 % en dominio de los servicios centrales.
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Informes de pruebas y de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-backend
          path: |
            backend/**/build/reports/tests/test/
            backend/**/build/reports/jacoco/test/
          retention-days: 14

  test-integracion:
    name: "2 · test-integracion"
    needs: lint-backend
    # En borradores no corre, para ahorrar minutos. Un job omitido cuenta como aprobado.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v6
      - name: Adaptadores con PostgreSQL (Testcontainers)
        run: ./gradlew integrationTest
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: informes-integracion
          path: backend/**/build/reports/tests/integrationTest/
          retention-days: 14

  test-frontend:
    name: "2 · test-frontend"
    needs: lint-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generar:api
      - name: Vitest con Testing Library y axe-core
        run: npm run test -- --run --coverage

  # ---------------------------------------------------------------- Etapa 3 · Secretos
  secretos:
    name: "3 · secretos"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }   # todo el historial, no solo el último commit
      - name: Gitleaks (reglas por defecto y de certificados, .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  # ---------------------------------------------------------------- Etapa 4 · SCA
  sbom-backend:
    name: "4 · sbom-backend"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@v6
      - name: SBOM CycloneDX por módulo y agregado
        run: ./gradlew cyclonedxDirectBom cyclonedxBom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-backend
          path: |
            backend/**/build/reports/cyclonedx-direct/bom.json
            backend/build/reports/cyclonedx/bom.json
          retention-days: 14

  sbom-frontend:
    name: "4 · sbom-frontend"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: SBOM CycloneDX del frontend (@cyclonedx/cyclonedx-npm)
        run: npm run sbom   # cyclonedx-npm --omit dev --output-file sbom-frontend.json
      - uses: actions/upload-artifact@v7
        with: { name: sbom-frontend, path: frontend/sbom-frontend.json, retention-days: 14 }

  sca:
    name: "4 · sca"
    needs: [sbom-backend, sbom-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with: { pattern: sbom-*, path: sboms }
      - id: grype
        uses: anchore/scan-action/download-grype@v7
      - name: Grype sobre cada SBOM (alta o crítica con versión corregida)
        run: |
          estado=0
          while IFS= read -r -d '' sbom; do
            echo "::group::$sbom"
            "${{ steps.grype.outputs.cmd }}" "sbom:$sbom" --only-fixed --fail-on high -o table || estado=1
            echo "::endgroup::"
          done < <(find sboms -name '*.json' -print0)
          exit $estado
