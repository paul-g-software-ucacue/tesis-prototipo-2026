# CI del MDD: etapas 1 a 4 en cada pull request hacia main.
# Borrador de D-27 / ADR-011 (sdd/pipeline_cicd.md). Antes de usarlo, fija cada acción
# por su SHA completo con `pinact run` (sección 7 del documento).
name: ci

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"
  NODE_VERSION: "24"

jobs:
  # ---------------------------------------------------------------- Detección
  # Decide si corren los jobs de frontend (D-29): solo si existe frontend/package.json.
  # Es un job y no hashFiles() porque el `if` de un job no admite esa función: todavía no hay
  # espacio de trabajo. Es un check obligatorio: si fallara, los jobs de frontend quedarían
  # omitidos y GitHub los contaría como aprobados.
  deteccion:
    name: "0 · deteccion"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.frontend.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: frontend/package.json
          sparse-checkout-cone-mode: false
      - id: frontend
        name: ¿Existe frontend/package.json?
        run: |
          if test -f frontend/package.json; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- Etapa 1 · Lint
  lint-backend:
    name: "1 · lint-backend"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Formato de Java (Spotless)
        run: ./gradlew spotlessCheck
      - name: Análisis estático (SpotBugs con FindSecBugs)
        run: ./gradlew spotbugsMain
      - name: Informe de SpotBugs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spotbugs
          path: backend/**/build/reports/spotbugs/
          retention-days: 14

  # ESLint, Prettier y TypeScript son criterios de B00-H06 (#23, D-29).
  lint-frontend:
    name: "1 · lint-frontend"
    needs: deteccion
    if: needs.deteccion.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tipos y cliente desde los contratos (openapi-typescript)
        run: npm run generar:api
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run formato:verificar
      - name: TypeScript
        run: npm run tipos

  # ---------------------------------------------------------------- Etapa 2 · Pruebas
  test-backend:
    name: "2 · test-backend"
    needs: lint-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Unitarias, arquitectura y contrato, con cobertura
        # test: JUnit 5, AssertJ, Mockito, ArchUnit, Spring Modulith y swagger-request-validator.
        # jacocoTestCoverageVerification: 60 % de líneas por módulo, también en el dominio central (D-32).
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Informes de pruebas y de cobertura
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-backend
          path: |
            backend/**/build/reports/tests/test/
            backend/**/build/reports/jacoco/test/
          retention-days: 14

  test-integracion:
    name: "2 · test-integracion"
    needs: lint-backend
    # En borradores no corre, para ahorrar minutos. Un job omitido cuenta como aprobado.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Adaptadores con PostgreSQL (Testcontainers)
        run: ./gradlew integrationTest
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-integracion
          path: backend/**/build/reports/tests/integrationTest/
          retention-days: 14

  test-frontend:
    name: "2 · test-frontend"
    needs: lint-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20   # con la instalación de Chromium y Firefox (B00-H06)
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run generar:api
      - name: Vitest con Testing Library (60 % de líneas)
        run: npm run test -- --run --coverage
      # B00-H06: axe-core necesita un navegador real para el contraste (WCAG 2.1 AA); los flujos y los
      # errores también corren en Firefox (research §7 y §8).
      - name: Navegadores de Playwright
        run: npx playwright install --with-deps chromium firefox
      - name: Accesibilidad y flujos (Playwright)
        run: npm run test:e2e
      - name: Un cambio de contrato rompe la compilación
        run: npm run verificar:ruptura
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: frontend/playwright-report/, retention-days: 14 }

  # ---------------------------------------------------------------- Etapa 3 · Secretos
  secretos:
    name: "3 · secretos"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }   # todo el historial, no solo el último commit
      # --log-opts: «--text» hace que Git muestre los binarios en el diff, para que Gitleaks vea un
      # .p12 o una llave (sin esto los salta, research §3 de B00-H07); «HEAD» limita la revisión
      # al commit de fusión de prueba: todo main y los commits del PR, no las demás ramas (FR-002).
      - name: Gitleaks (reglas por defecto, de certificados y de claves, .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose \
            --log-opts="--text HEAD"

  # ---------------------------------------------------------------- Etapa 4 · SCA
  sbom-backend:
    name: "4 · sbom-backend"
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "${{ env.JAVA_VERSION }}" }
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: SBOM CycloneDX por módulo y agregado
        run: ./gradlew cyclonedxDirectBom cyclonedxBom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-backend
          path: |
            backend/**/build/reports/cyclonedx-direct/bom.json
            backend/build/reports/cyclonedx/bom.json
          retention-days: 14

  sbom-frontend:
    name: "4 · sbom-frontend"
    needs: deteccion
    if: github.event.pull_request.draft == false && needs.deteccion.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: SBOM CycloneDX del frontend (@cyclonedx/cyclonedx-npm)
        run: npm run sbom   # cyclonedx-npm --omit dev --output-file sbom-frontend.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom-frontend, path: frontend/sbom-frontend.json, retention-days: 14 }

  sca:
    name: "4 · sca"
    needs: [sbom-backend, sbom-frontend]
    # Sin frontend, sbom-frontend queda omitido; sca igual revisa el SBOM del backend
    # (caso límite «repositorio sin frontend»). En borradores, sbom-backend se omite y sca también.
    if: ${{ !cancelled() && needs.sbom-backend.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.sbom-frontend.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: sbom-*, path: sboms }
      - id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
      - name: Grype sobre cada SBOM (alta o crítica con versión corregida)
        run: |
          estado=0
          while IFS= read -r -d '' sbom; do
            echo "::group::$sbom"
            "${{ steps.grype.outputs.cmd }}" "sbom:$sbom" --only-fixed --fail-on high -o table || estado=1
            echo "::endgroup::"
          done < <(find sboms -name '*.json' -print0)
          exit $estado
