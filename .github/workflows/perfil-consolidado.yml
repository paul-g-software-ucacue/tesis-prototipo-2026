# Perfil consolidado y medición de R-19 (B00-H02; contrato en
# specs/002-compose-cuatro-procesos/contracts/medicion-r19.md).
# Desde un checkout limpio levanta los 6 contenedores con un solo comando (escenario 1) y mide la
# memoria después del calentamiento (escenario 2, D-34, D-36). Desde B00-H03 también prueba la
# autenticación de punta a punta y mide después de iniciar sesión; desde B00-H04, los errores, y
# desde B00-H05, los eventos entre procesos, y desde B00-H06, la SPA. No es un check obligatorio.
# Corre en los pull requests que cambian el despliegue y a mano: GitHub solo ejecuta a mano los
# workflows que ya están en la rama principal.
name: perfil-consolidado

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - compose.yaml
      - .env.ejemplo
      - "contratos/**"
      - "deploy/**"
      - "frontend/**"
      - .github/workflows/perfil-consolidado.yml

permissions:
  contents: read

concurrency:
  group: perfil-consolidado-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medicion:
    name: perfil-consolidado
    # En borradores no corre, como la CI.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construcción de las imágenes
        shell: bash
        run: time docker compose build

      # Ya sin construir: es la referencia de SC-001 (180 s como máximo).
      - name: Todo se levanta con un comando (escenario 1)
        shell: bash
        run: time docker compose up -d --wait

      # Escenarios 1 a 3 de B00-H03: sin token, token válido en los 4 procesos y token alterado.
      - name: Autenticación de punta a punta
        shell: bash
        run: deploy/probar_autenticacion.sh

      # B00-H04: errores con el modelo común (400 con detalles, 404, 405 y 503 con un proceso detenido).
      - name: Errores de punta a punta
        shell: bash
        run: deploy/probar_errores.sh

      # B00-H05: eventos entre procesos (entrega normal, identidad detenido y su vuelta, entrega
      # repetida y receptor fuera del API Gateway). Detiene y vuelve a levantar identidad.
      - name: Eventos de punta a punta
        shell: bash
        run: deploy/probar_eventos.sh

      # B00-H06: la SPA detrás de Nginx, con /api hacia el API Gateway en el mismo origen (D-52).
      - name: SPA de punta a punta
        shell: bash
        run: deploy/probar_spa.sh

      # shell: bash agrega pipefail, así que tee no oculta el código de salida del script.
      # Después de iniciar sesión (D-34): la medición de referencia de R-19 desde B00-H03.
      - name: Medición de R-19 después de iniciar sesión
        shell: bash
        run: |
          deploy/medir_memoria.sh --con-sesion | tee medicion.md
          cat medicion.md >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        name: Estado de los contenedores
        shell: bash
        run: docker compose ps

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medicion-r19
          path: medicion.md
          if-no-files-found: warn
          retention-days: 90

      - if: always()
        name: Bajar el perfil
        shell: bash
        run: docker compose down -v
