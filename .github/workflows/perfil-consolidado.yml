# Perfil consolidado y medición de R-19 (B00-H02; contrato en
# specs/002-compose-cuatro-procesos/contracts/medicion-r19.md).
# Desde un checkout limpio levanta los 6 contenedores con un solo comando (escenario 1) y mide la
# memoria después del calentamiento (escenario 2, D-34, D-36). Desde B00-H03 también prueba la
# autenticación de punta a punta y mide después de iniciar sesión; desde B00-H04, los errores, y
# desde B00-H05, los eventos entre procesos, y desde B00-H06, la SPA. No es un check obligatorio.
# Corre en los pull requests que cambian el despliegue y a mano: GitHub solo ejecuta a mano los
# workflows que ya están en la rama principal.
name: perfil-consolidado

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - compose.yaml
      - .env.ejemplo
      - "contratos/**"
      - "deploy/**"
      - .dockerignore
      - "frontend/**"
      - .github/workflows/perfil-consolidado.yml

permissions:
  contents: read

concurrency:
  group: perfil-consolidado-${{ github.ref }}
  cancel-in-progress: true

jobs:
  medicion:
    name: perfil-consolidado
    # En borradores no corre, como la CI.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construcción de las imágenes
        shell: bash
        run: time docker compose build

      # Ya sin construir: es la referencia de SC-001 (180 s como máximo).
      - name: Todo se levanta con un comando (escenario 1)
        shell: bash
        run: time docker compose up -d --wait

      # Escenarios 1 a 3 de B00-H03: sin token, token válido en los 4 procesos y token alterado.
      - name: Autenticación de punta a punta
        shell: bash
        run: deploy/probar_autenticacion.sh

      # B00-H04: errores con el modelo común (400 con detalles, 404, 405 y 503 con un proceso detenido).
      - name: Errores de punta a punta
        shell: bash
        run: deploy/probar_errores.sh

      # B00-H05: eventos entre procesos (entrega normal, identidad detenido y su vuelta, entrega
      # repetida y receptor fuera del API Gateway). Detiene y vuelve a levantar identidad.
      - name: Eventos de punta a punta
        shell: bash
        run: deploy/probar_eventos.sh

      # B00-H06: la SPA detrás de Nginx, con /api hacia el API Gateway en el mismo origen (D-52).
      - name: SPA de punta a punta
        shell: bash
        run: deploy/probar_spa.sh

      # F04-H01: la política 2024 como versión 1, quién la lee (D-66) y que reiniciar datos no la
      # duplica. Reinicia datos tres veces.
      - name: Normativa de punta a punta
        shell: bash
        run: deploy/probar_normativa.sh

      # F02-H01: registrar el periodo, abrirlo con su versión de normativa, avanzar su estado hasta
      # Cerrado, quién lo ve (D-69) y su registro.
      - name: Periodos de punta a punta
        shell: bash
        run: deploy/probar_periodos.sh

      # F03-H01: las 24 unidades de la carga 01 de prueba, los rechazos (gestión fuera de las 21,
      # comisión sin «permanente», ciclo, segunda sede matriz, dependientes), quién la lee (D-70) y
      # su registro.
      - name: Estructura orgánica de punta a punta
        shell: bash
        run: deploy/probar_estructura.sh

      # F01-H01: las 10 plantillas y el diccionario de datos, con sus permisos alternativos (D-70).
      # No crea nada.
      - name: Plantillas de carga de punta a punta
        shell: bash
        run: deploy/probar_plantillas.sh

      # F01-H02: subir el CSV o XLSX de una carga, por el gateway y por el frontend (nginx), cada
      # rechazo con su código y quién sube (D-71). No crea nada.
      - name: Subida de archivos de punta a punta
        shell: bash
        run: deploy/probar_subida.sh

      # F03-H02: las 7 carreras, 12 mallas y 300 asignaturas de prueba, sus reglas, los datos para la
      # afinidad y quién las lee y escribe (D-70). Borra lo que creó.
      - name: Carreras, mallas y asignaturas de punta a punta
        shell: bash
        run: deploy/probar_carreras.sh

      # F03-H03: las 165 asignaturas-paralelo de prueba y sus 660 horas a cubrir, 4 horas en 3
      # paralelos son 12, las reglas, la oferta cerrada fuera de Planificación y quién la lee y la
      # escribe (D-70). Borra lo que creó.
      - name: Oferta del periodo de punta a punta
        shell: bash
        run: deploy/probar_oferta.sh

      # F03-H04: los 47 docentes de prueba con su ficha, la búsqueda sin mayúsculas ni tildes, la
      # dedicación que no existe con sus valores permitidos, los 409, el estado laboral y quién los
      # lee y los escribe (D-70). Borra lo que creó.
      - name: Docentes de punta a punta
        shell: bash
        run: deploy/probar_docentes.sh

      # F03-H05: los 21 cargos y los 11 proyectos de prueba, la advertencia de RN-20, los cuatro 409,
      # la suma de horas, los asignables en 2026-I y 2026-II, un coordinador finalizado y quién los
      # lee (D-64, D-70). Borra lo que creó, también la copia de los periodos en Roles.
      - name: Cargos y proyectos de punta a punta
        shell: bash
        run: deploy/probar_cargos_proyectos.sh

      # F01-H03: las reglas de cada fila con sus referencias, la cédula sin el cero, el informe en
      # CSV neutralizado, el reintento, quién valida (D-71) y un archivo de casi 5 MB. Borra lo que creó.
      - name: Reglas de las filas de punta a punta
        shell: bash
        run: deploy/probar_reglas_carga.sh

      # F01-H04: las 10 cargas de prueba confirmadas en su orden, subidas otra vez sin cambios, la
      # repetida, una baja que no se aplica, una vista previa desactualizada, una regla del dueño,
      # el historial y quién confirma (D-71). Borra lo que creó.
      - name: Confirmación de las cargas de punta a punta
        shell: bash
        run: deploy/probar_confirmar_carga.sh

      # F01-H05: la 04 antes que la 02 se rechaza, el estado de cada carga, las 10 en orden y
      # «sin proyectos» de un periodo, con quién lo ve y quién lo confirma. Borra lo que creó.
      - name: El orden de las cargas de punta a punta
        shell: bash
        run: deploy/probar_orden_cargas.sh

      # shell: bash agrega pipefail, así que tee no oculta el código de salida del script.
      # Después de iniciar sesión (D-34): la medición de referencia de R-19 desde B00-H03.
      - name: Medición de R-19 después de iniciar sesión
        shell: bash
        run: |
          deploy/medir_memoria.sh --con-sesion | tee medicion.md
          cat medicion.md >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        name: Estado de los contenedores
        shell: bash
        run: docker compose ps

      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: medicion-r19
          path: medicion.md
          if-no-files-found: warn
          retention-days: 90

      - if: always()
        name: Bajar el perfil
        shell: bash
        run: docker compose down -v

      # B00-H08: el ciclo del equipo de demostración en el runner, sin Docker Hub ni GitHub (registro
      # local y API simulada): sin versión, despliegue sano, llave persistente, sitio del túnel, vuelta
      # atrás y primer despliegue roto (escenarios 3 a 5, D-56). Corre después de bajar el perfil.
      - name: Despliegue en un equipo simulado
        shell: bash
        run: deploy/equipo/probar_equipo.sh
