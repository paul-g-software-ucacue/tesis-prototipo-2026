# Contrato de generacion. En B00-H03 solo tiene la sesión actual, para probar la autenticación de
# punta a punta (D-39); las operaciones de negocio llegan con sus historias. Desde B00-H05, el
# evento de prueba, apagado por defecto (D-48). Desde F06-H01: el puntaje de afinidad de un docente en
# la oferta de un periodo (RF-17, RN-24, ADR-010). Lo leen quienes pueden leer un docente (D-70).
# Desde F06-H02: la sugerencia de docentes para una asignatura-paralelo (RF-25, RN-19), con el mismo
# permiso. Las horas asignadas son 0 hasta que F06-H03 traiga las asignaciones.
# Desde F06-H05: las dos se filtran por la carrera de quien solo tiene «lo propio» (D-64).
# Desde F06-H03: el distributivo del periodo, con su versión 1 y sus parciales, y las propuestas de
# docentes, con su justificación (RF-24, RF-56, D-19, RNF-EQU-01). Crea quien escribe el distributivo;
# propone quien escribe la oferta y la propuesta, sobre lo propio (D-64).
# Desde F06-H04: las actividades no lectivas, con el mismo permiso de proponer (RF-26, RN-22, RN-25).
# Desde F07-H01: la carga horaria de un docente, con sus totales y su proporción (RF-27, RN-05, D-01).
# La leen quienes leen la oferta, sin filtro de carrera, porque solo trae sumas (D-82).
# Desde F07-H02: proponer y asignar se rechazan si violan una regla dura (RF-28, RN-02, RN-13, D-83).
# Desde F07-H03: RN-19 sin justificar responde con una advertencia, sin guardar (RF-28, MD-07).
# Desde F10-H01: el panel de inconsistencias del periodo y la justificación de las blandas (RF-29,
# MD-07, D-85 a D-87). Lo leen Consolidación y el Vicerrectorado; justifica Consolidación.
# Desde F10-H02: consolidar y el informe sustentado (RF-32, D-88). Marca sin bloquear; lo leen
# Consolidación y el Vicerrectorado, y escribe Consolidación.
openapi: 3.0.3
info:
  title: MDD · generacion
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Sesion
    description: Sesión actual.
  - name: Afinidad
    description: El puntaje de afinidad de un docente, con su desglose (RF-17, RN-24, ADR-010).
  - name: Sugerencia
    description: Los docentes sugeridos para una asignatura-paralelo (RF-25, RN-19).
  - name: Distributivo
    description: El distributivo del periodo, sus parciales y las propuestas (RF-24, RF-56, D-19).
  - name: Actividades
    description: Las actividades no lectivas de cada parcial (RF-26, RN-22, RN-25).
  - name: CargaHoraria
    description: Los totales de un docente y su proporción (RF-27, RN-05, D-01, D-82).
  - name: Panel
    description: El panel de inconsistencias del periodo (RF-29, MD-07).
  - name: Consolidado
    description: Consolidar el periodo y su informe sustentado (RF-32).
paths:
  /api/generacion/sesion:
    get:
      tags: [Sesion]
      operationId: consultarSesion
      summary: Devuelve el usuario y los roles del token.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                $ref: '../comun/seguridad.yaml#/components/schemas/SesionActual'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/generacion/docentes/{identificacion}/afinidad:
    parameters:
      - name: identificacion
        in: path
        required: true
        description: Número de identificación del docente, el que usa Docentes.
        schema:
          type: string
          pattern: '^[0-9A-Z]{1,13}$'
        example: '0109990010'
      - name: periodo
        in: query
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Afinidad]
      operationId: consultarAfinidadDelDocente
      summary: Devuelve el puntaje del docente en cada asignatura de la oferta del periodo.
      description: >-
        Se calcula en cada consulta con la ficha del docente y los pesos de la versión de normativa
        que rige el periodo; no se guarda. Ordenado del mayor puntaje al menor y, a igual puntaje,
        por nombre. Sin oferta, la lista viene vacía. Quien solo tiene «lo propio» sobre la oferta recibe
        las asignaturas de su carrera; sin carrera, 403 COMUN_CARRERA_SIN_INDICAR (F06-H05, D-64).
      x-mdd-permiso: [DOCENTES:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: El puntaje por asignatura.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AfinidadDelDocente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: >-
            El periodo (GENERACION_PERIODO_NO_ENCONTRADO) o el docente
            (GENERACION_DOCENTE_NO_ENCONTRADO) no existen.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: El periodo no tiene su versión de normativa (GENERACION_PERIODO_SIN_ABRIR).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/oferta/{asignatura}/{paralelo}/sugerencia:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
      - name: asignatura
        in: path
        required: true
        description: Código de la asignatura ofertada, el que usa Académico.
        schema:
          type: string
          pattern: '^[0-9A-Z-]{1,30}$'
        example: DS-P-II-POO-204
      - name: paralelo
        in: path
        required: true
        description: El paralelo de la asignatura en el periodo, el que usa Académico.
        schema:
          type: string
          pattern: '^[0-9A-Z_-]{1,20}$'
        example: A_NOCTURNA
    get:
      tags: [Sugerencia]
      operationId: consultarSugerencia
      summary: Devuelve los docentes sugeridos para una asignatura-paralelo ofertada.
      description: >-
        Se calcula en cada consulta con la ficha de los docentes activos y los pesos y el mínimo de la
        versión de normativa que rige el periodo; no se guarda. Primero van los candidatos con horas
        suficientes y, dentro de cada grupo, del mayor puntaje al menor; a igual puntaje, más horas
        disponibles primero, y después por nombre. Sin tronco común, quien no alcanza el mínimo no
        aparece y solo se cuenta. Quien solo tiene «lo propio» sobre la oferta recibe 403 con otra carrera, y 403
        COMUN_CARRERA_SIN_INDICAR sin carrera (F06-H05, D-64).
      x-mdd-permiso: [DOCENTES:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La sugerencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sugerencia'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: La asignatura-paralelo no está en la oferta del periodo (GENERACION_PARALELO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            La asignatura-paralelo está retirada (GENERACION_PARALELO_RETIRADO) o el periodo no tiene
            su versión de normativa (GENERACION_PERIODO_SIN_ABRIR).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/distributivo:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Distributivo]
      operationId: consultarDistributivo
      summary: Devuelve el distributivo del periodo, si ya se creó.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CARGAS:LECTURA]
      responses:
        '200':
          description: El distributivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distributivo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no tiene distributivo (GENERACION_DISTRIBUTIVO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
    post:
      tags: [Distributivo]
      operationId: crearDistributivo
      summary: Crea el distributivo de un periodo listo, con su versión 1 y un parcial por carrera con oferta.
      description: >-
        Solo si el tablero de preparación dice que el periodo está listo (RF-56). Cada periodo tiene
        un solo distributivo.
      x-mdd-permiso: DISTRIBUTIVO:ESCRITURA
      responses:
        '201':
          description: El distributivo creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Distributivo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: El periodo no está listo (GENERACION_PERIODO_NO_LISTO) o ya tiene distributivo (GENERACION_DISTRIBUTIVO_REPETIDO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/parciales:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Distributivo]
      operationId: consultarParciales
      summary: Devuelve los parciales del periodo, con su avance y sus propuestas.
      description: >-
        Quien solo tiene «lo propio» recibe el de su carrera; sin carrera, 403
        COMUN_CARRERA_SIN_INDICAR (D-64). Sin distributivo, creado es falso.
      x-mdd-permiso: [OFERTA:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: Los parciales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Parciales'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/oferta/{asignatura}/{paralelo}/propuesta:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
      - name: asignatura
        in: path
        required: true
        description: Código de la asignatura ofertada, el que usa Académico.
        schema:
          type: string
          pattern: '^[0-9A-Z-]{1,30}$'
        example: DS-P-II-POO-204
      - name: paralelo
        in: path
        required: true
        description: El paralelo de la asignatura en el periodo, el que usa Académico.
        schema:
          type: string
          pattern: '^[0-9A-Z_-]{1,20}$'
        example: A_NOCTURNA
    put:
      tags: [Distributivo]
      operationId: proponerDocente
      summary: Propone un docente para la asignatura-paralelo; reemplaza la propuesta que tenga.
      description: >-
        La justificación la decide el servidor con el puntaje que calcula al guardar: afinidad si
        alcanza el mínimo; disponibilidad si no lo alcanza en tronco común; excepción si no lo
        alcanza fuera de tronco común. Sin justificación responde 200 con guardada en falso y una
        advertencia; el 400 queda solo para un texto de largo inválido. Una justificación no levanta
        una regla dura: sin horas, sobre el tope de clase o con RN-19 dura no se guarda.
      x-mdd-permiso: OFERTA:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropuestaNueva'
      responses:
        '200':
          description: La propuesta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDePropuesta'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: La asignatura-paralelo no está en la oferta (GENERACION_PARALELO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Retirada (GENERACION_PARALELO_RETIRADO), periodo cerrado (GENERACION_PERIODO_CERRADO), sin
            distributivo (GENERACION_SIN_DISTRIBUTIVO), docente no activo
            (GENERACION_DOCENTE_NO_ACTIVO), parcial que ya no admite cambios
            (GENERACION_PARCIAL_NO_EDITABLE), horas excedidas (GENERACION_HORAS_EXCEDIDAS), tope de
            clase (GENERACION_TOPE_DE_CLASE), con las horas que quedan en detalles, RN-19 dura
            (GENERACION_AFINIDAD_INSUFICIENTE) o la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
    delete:
      tags: [Distributivo]
      operationId: quitarPropuesta
      summary: Quita la propuesta de la asignatura-paralelo.
      x-mdd-permiso: OFERTA:ESCRITURA
      responses:
        '204':
          description: Propuesta quitada.
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: No hay propuesta (GENERACION_PROPUESTA_NO_ENCONTRADA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Periodo cerrado (GENERACION_PERIODO_CERRADO), parcial que ya no admite cambios
            (GENERACION_PARCIAL_NO_EDITABLE) o la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/actividades:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Actividades]
      operationId: consultarActividades
      summary: Devuelve las actividades no lectivas del periodo, por carrera y docente.
      description: >-
        Con los totales de cada docente en todas las carreras. Quien solo tiene «lo propio» recibe su carrera,
        aunque aún no tenga parcial; sin carrera, 403 COMUN_CARRERA_SIN_INDICAR (D-64). Sin
        distributivo, creado es falso.
      x-mdd-permiso: [OFERTA:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: Las actividades.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadesDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/docentes/{docente}/actividades-posibles:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
      - name: docente
        in: path
        required: true
        description: Número de identificación del docente, el que usa Docentes.
        schema:
          type: string
          pattern: '^[0-9A-Z]{1,13}$'
        example: '0109990010'
    get:
      tags: [Actividades]
      operationId: consultarActividadesPosibles
      summary: Devuelve las actividades del catálogo y si se le pueden asignar al docente.
      description: >-
        Cada una dice si está disponible y por qué no, con los proyectos que se pueden elegir. La
        regla está en el servidor: la pantalla solo muestra esto (RN-22, RN-25).
      x-mdd-permiso: OFERTA:ESCRITURA
      responses:
        '200':
          description: Las actividades posibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadesPosibles'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          description: >-
            Docente no activo (GENERACION_DOCENTE_NO_ACTIVO) o periodo sin abrir (GENERACION_PERIODO_SIN_ABRIR).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/consolidado:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Consolidado]
      operationId: consultarConsolidado
      summary: Devuelve las carreras, los totales, las inconsistencias abiertas y el informe.
      description: >-
        Se calcula al abrirlo: solo se guarda quién y cuándo consolidó. Un periodo sin distributivo
        responde 200 con creado en false, porque no es un error. Es solo lectura.
      x-mdd-permiso: [CONSOLIDACION:LECTURA, DISTRIBUTIVO:ESCRITURA]
      responses:
        '200':
          description: El consolidado del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidadoDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
    post:
      tags: [Consolidado]
      operationId: consolidar
      summary: Consolida la versión vigente, sin bloquearla.
      description: >-
        Guarda quién y cuándo, y se puede repetir. Admite inconsistencias abiertas, y no cambia el
        estado de los parciales (MD-04).
      x-mdd-permiso: CONSOLIDACION:ESCRITURA
      responses:
        '200':
          description: El consolidado del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidadoDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Sin distributivo (GENERACION_SIN_DISTRIBUTIVO), periodo cerrado
            (GENERACION_PERIODO_CERRADO), la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA) o el distributivo ya está en revisión o después
            (GENERACION_CONSOLIDADO_EN_REVISION).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/consolidado/informe:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Consolidado]
      operationId: descargarInformeSustentado
      summary: Descarga el informe vigente, idéntico al adjuntado.
      description: >-
        Comprueba su huella antes de entregarlo: nunca entrega un archivo dañado.
      x-mdd-permiso: [CONSOLIDACION:LECTURA, DISTRIBUTIVO:ESCRITURA]
      responses:
        '200':
          description: El PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: Sin informe (GENERACION_INFORME_NO_ENCONTRADO), o el periodo no existe
            (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          description: >-
            No se pudo leer el archivo, o no coincide con su huella (GENERACION_INFORME_ILEGIBLE).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
    put:
      tags: [Consolidado]
      operationId: adjuntarInformeSustentado
      summary: Adjunta el informe en PDF a la versión consolidada, o lo reemplaza.
      description: >-
        Un PDF de hasta 10 MB, comprobado por su contenido. Reemplazarlo conserva el anterior. El
        nombre recibido solo se muestra.
      x-mdd-permiso: CONSOLIDACION:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: El informe vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformeSustentado'
        '400':
          description: >-
            El archivo no es un PDF, o está vacío (GENERACION_INFORME_NO_ES_PDF).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Sin consolidar (GENERACION_SIN_CONSOLIDAR), sin distributivo
            (GENERACION_SIN_DISTRIBUTIVO), periodo cerrado (GENERACION_PERIODO_CERRADO), la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA)
            o el distributivo ya está en revisión o después (GENERACION_CONSOLIDADO_EN_REVISION).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '413':
          description: >-
            Pasa de 10 MB (GENERACION_INFORME_DEMASIADO_GRANDE).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/inconsistencias:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [Panel]
      operationId: consultarPanelDeInconsistencias
      summary: Devuelve las inconsistencias globales de la versión vigente del periodo.
      description: >-
        Se calcula al abrirlo, sin guardar una foto. Es solo lectura. Un periodo sin distributivo
        responde 200 con creado en false, porque no es un error. Las severidades y las cifras salen
        de la versión de normativa del periodo (principio VI).
      x-mdd-permiso: [CONSOLIDACION:LECTURA, DISTRIBUTIVO:ESCRITURA]
      responses:
        '200':
          description: El panel del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelDeInconsistencias'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Sin versión de normativa (GENERACION_PERIODO_SIN_ABRIR). No debería ocurrir, porque un
            distributivo nace de un periodo abierto: queda como protección.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/inconsistencias/justificacion:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    put:
      tags: [Panel]
      operationId: justificarInconsistencia
      summary: Guarda o cambia la justificación de una inconsistencia blanda abierta.
      description: >-
        Vuelve a evaluar el panel antes de guardar. Cambiar una justificación no borra la anterior.
        Queda en el registro, sin el texto. RN-19 se justifica en su propuesta, no aquí.
      x-mdd-permiso: CONSOLIDACION:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JustificacionNueva'
      responses:
        '200':
          description: La inconsistencia justificada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InconsistenciaDelPanel'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: El periodo no existe (GENERACION_PERIODO_NO_ENCONTRADO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Ya no existe (GENERACION_INCONSISTENCIA_NO_ENCONTRADA), es dura
            (GENERACION_INCONSISTENCIA_DURA), periodo cerrado (GENERACION_PERIODO_CERRADO), sin
            distributivo (GENERACION_SIN_DISTRIBUTIVO), sin versión (GENERACION_PERIODO_SIN_ABRIR), la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA)
            o el distributivo ya está en revisión o después (GENERACION_CONSOLIDADO_EN_REVISION).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/docentes/{docente}/carga-horaria:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
      - name: docente
        in: path
        required: true
        description: Número de identificación del docente, el que usa Docentes.
        schema:
          type: string
          pattern: '^[0-9A-Z]{1,13}$'
        example: '0109990010'
    get:
      tags: [CargaHoraria]
      operationId: consultarCargaHoraria
      summary: Devuelve los totales de un docente activo y su proporción.
      description: >-
        Suma todas las carreras y unidades de la versión vigente, sin decir en qué asignaturas o
        actividades están las horas. No se filtra por carrera (D-82). Es solo lectura.
      x-mdd-permiso: [OFERTA:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La carga horaria del docente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CargaHoraria'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          description: >-
            Docente no activo (GENERACION_DOCENTE_NO_ACTIVO), periodo sin distributivo, también si
            no existe (GENERACION_SIN_DISTRIBUTIVO), o sin versión de normativa
            (GENERACION_PERIODO_SIN_ABRIR).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/generacion/periodos/{periodo}/parciales/{carrera}/docentes/{docente}/actividades/{actividad}:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
      - name: carrera
        in: path
        required: true
        description: Código de la carrera dueña del parcial.
        schema:
          type: string
          pattern: '^[0-9A-Z_-]{1,20}$'
        example: 550613A01-P-0301
      - name: docente
        in: path
        required: true
        description: Número de identificación del docente, el que usa Docentes.
        schema:
          type: string
          pattern: '^[0-9A-Z]{1,13}$'
        example: '0109990010'
      - name: actividad
        in: path
        required: true
        description: Código de la actividad del catálogo, artículo y literal.
        schema:
          type: string
          pattern: '^14[0-3]-[a-p]$'
        example: 140-b
    put:
      tags: [Actividades]
      operationId: asignarActividad
      summary: Asigna una actividad al docente en el parcial; reemplaza las horas si ya la tiene.
      description: >-
        El tope de 40 h es de validación. Si el total del docente no cabe, no se guarda.
      x-mdd-permiso: OFERTA:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActividadNueva'
      responses:
        '200':
          description: La actividad guardada, con el aviso de las horas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadGuardada'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: >-
            La actividad no está en el catálogo (GENERACION_ACTIVIDAD_FUERA_DEL_CATALOGO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Periodo cerrado (GENERACION_PERIODO_CERRADO), sin abrir (GENERACION_PERIODO_SIN_ABRIR), sin distributivo (GENERACION_SIN_DISTRIBUTIVO), docente no activo (GENERACION_DOCENTE_NO_ACTIVO), parcial que no admite cambios (GENERACION_PARCIAL_NO_EDITABLE), la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA), proyecto no válido (GENERACION_PROYECTO_NO_VALIDO) o cargo no vigente (GENERACION_CARGO_NO_VIGENTE) o reglas duras (GENERACION_HORAS_EXCEDIDAS, GENERACION_TOPE_DE_CLASE), con las horas que quedan en detalles.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
    delete:
      tags: [Actividades]
      operationId: quitarActividad
      summary: Quita la actividad del docente en el parcial.
      x-mdd-permiso: OFERTA:ESCRITURA
      parameters:
        - name: proyecto
          in: query
          required: false
          description: El proyecto de la actividad, si tiene.
          schema:
            type: string
            pattern: '^[0-9A-Z-]{1,30}$'
          example: INV-2025-01
      responses:
        '204':
          description: Actividad quitada.
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          description: >-
            No tiene esa actividad (GENERACION_ACTIVIDAD_NO_ENCONTRADA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            Periodo cerrado (GENERACION_PERIODO_CERRADO), parcial que no admite cambios (GENERACION_PARCIAL_NO_EDITABLE) o la versión ya está congelada para la firma (GENERACION_VERSION_CONGELADA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
components:
  schemas:
    Sugerencia:
      description: >-
        Los candidatos de una asignatura-paralelo, en orden, y cuántos docentes activos quedaron fuera
        por el mínimo (RF-25, RN-19).
      type: object
      required:
        - periodo
        - asignatura
        - nombre
        - paralelo
        - horasDelParalelo
        - troncoComun
        - version
        - minimoAfinidad
        - fueraPorElMinimo
        - candidatos
        - bajoElMinimo
        - distributivoCreado
      properties:
        periodo:
          type: string
        asignatura:
          type: string
        nombre:
          type: string
        paralelo:
          type: string
        horasDelParalelo:
          description: Las horas semanales efectivas del paralelo; admiten decimales.
          type: number
        troncoComun:
          description: Si es de tronco común, el mínimo no aplica.
          type: boolean
        version:
          description: El número de la versión de normativa que rige el periodo.
          type: integer
        minimoAfinidad:
          type: number
        fueraPorElMinimo:
          description: Docentes activos que no alcanzan el mínimo; 0 en tronco común.
          type: integer
          minimum: 0
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/Candidato'
        bajoElMinimo:
          description: Los docentes activos que no alcanzan el mínimo, en el mismo orden (F06-H03).
          type: array
          items:
            $ref: '#/components/schemas/Candidato'
        distributivoCreado:
          description: Si el periodo ya tiene distributivo; sin él, no se puede proponer.
          type: boolean
        propuesta:
          $ref: '#/components/schemas/Propuesta'
    Distributivo:
      type: object
      required: [periodo, version, carreras]
      properties:
        periodo:
          type: string
        version:
          description: El número de la versión vigente.
          type: integer
        carreras:
          description: Las carreras con parcial, por código.
          type: array
          items:
            type: string
    Parciales:
      type: object
      required: [creado, parciales]
      properties:
        creado:
          description: Si el periodo ya tiene distributivo.
          type: boolean
        parciales:
          type: array
          items:
            $ref: '#/components/schemas/ParcialDeCarrera'
    ParcialDeCarrera:
      type: object
      required: [carrera, estado, ofertadas, conPropuesta, completo, propuestas]
      properties:
        carrera:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoDelParcial'
        ofertadas:
          type: integer
          minimum: 0
        conPropuesta:
          description: Las ofertadas con propuesta; una retirada no cuenta.
          type: integer
          minimum: 0
        completo:
          type: boolean
        propuestas:
          type: array
          items:
            $ref: '#/components/schemas/Propuesta'
    EstadoDelParcial:
      type: string
      enum: [EN_ELABORACION, ENVIADO, DEVUELTO]
    PropuestaNueva:
      type: object
      required: [docente]
      properties:
        docente:
          description: El número de identificación del docente.
          type: string
          pattern: '^[0-9A-Z]{1,13}$'
        texto:
          description: La justificación escrita; solo se conserva en una excepción.
          type: string
          maxLength: 500
    Propuesta:
      type: object
      required: [asignatura, paralelo, docente, nombreDocente, justificacion, retirada, horasSuficientes]
      properties:
        asignatura:
          type: string
        paralelo:
          type: string
        docente:
          type: string
        nombreDocente:
          type: string
        justificacion:
          $ref: '#/components/schemas/TipoDeJustificacion'
        texto:
          description: La justificación escrita de una excepción.
          type: string
        retirada:
          description: Si la asignatura-paralelo se retiró de la oferta; no cuenta.
          type: boolean
        horasSuficientes:
          description: Si al docente le alcanzan las horas para este paralelo.
          type: boolean
        inconsistencia:
          $ref: '#/components/schemas/InconsistenciaJustificada'
    InconsistenciaJustificada:
      description: Una regla blanda que la propuesta incumple, ya justificada (MD-07).
      type: object
      required: [regla, estado]
      properties:
        regla:
          type: string
        estado:
          type: string
          enum: [JUSTIFICADA]
    ResultadoDePropuesta:
      description: >-
        Lo que pasó al proponer. Si no se guardó, trae la advertencia: una regla blanda sin
        justificar no es un error (RF-28).
      type: object
      required: [guardada]
      properties:
        guardada:
          type: boolean
        propuesta:
          $ref: '#/components/schemas/Propuesta'
        advertencia:
          $ref: '#/components/schemas/Advertencia'
    Advertencia:
      description: Una inconsistencia blanda sin justificar. No guarda nada.
      type: object
      required: [regla, titulo, descripcion]
      properties:
        regla:
          type: string
        titulo:
          type: string
        descripcion:
          type: string
    TipoDeJustificacion:
      type: string
      enum: [AFINIDAD, DISPONIBILIDAD, EXCEPCION]
    ConsolidadoDelPeriodo:
      description: El distributivo institucional del periodo, calculado al abrirlo (RF-32).
      type: object
      required: [periodo, creado, modificable, enRevision, versionCongelada, desactualizado, carreras, totales, abiertas]
      properties:
        periodo:
          type: string
        creado:
          description: Si el periodo tiene distributivo.
          type: boolean
        modificable:
          description: Si admite consolidar y adjuntar; un periodo cerrado solo se lee.
          type: boolean
        enRevision:
          description: >-
            Si el distributivo ya está en revisión del Vicerrectorado o después: el consolidado ya no
            cambia, aunque se puede consultar y descargar el informe (D-99).
          type: boolean
        versionCongelada:
          description: >-
            Si la versión vigente está congelada para la firma: ya no cambia, aunque se puede consultar
            y descargar el informe (F13-H01, D-100). Falso sin distributivo.
          type: boolean
        version:
          description: El número de la versión; solo si está creado.
          type: integer
          minimum: 1
        consolidacion:
          $ref: '#/components/schemas/Consolidacion'
        desactualizado:
          description: Si una propuesta o una actividad cambió después de consolidar.
          type: boolean
        carreras:
          type: array
          items:
            $ref: '#/components/schemas/CarreraConsolidada'
        totales:
          $ref: '#/components/schemas/HorasPorComponente'
        abiertas:
          $ref: '#/components/schemas/TotalesDelPanel'
        informe:
          $ref: '#/components/schemas/InformeSustentado'
    Consolidacion:
      type: object
      required: [por, en]
      properties:
        por:
          description: Quién consolidó.
          type: string
        en:
          type: string
          format: date-time
    CarreraConsolidada:
      type: object
      required: [carrera, estado, paralelos, propuestos, completo, horas]
      properties:
        carrera:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoDelParcial'
        paralelos:
          description: Los paralelos no retirados de la carrera.
          type: integer
          minimum: 0
        propuestos:
          description: Cuántos tienen propuesta.
          type: integer
          minimum: 0
        completo:
          type: boolean
        horas:
          $ref: '#/components/schemas/HorasPorComponente'
    InformeSustentado:
      type: object
      required: [nombre, tamano, huella, por, en]
      properties:
        nombre:
          description: El nombre recibido, solo para mostrarlo.
          type: string
        tamano:
          description: En bytes.
          type: integer
          minimum: 1
        huella:
          description: SHA-256, en hexadecimal.
          type: string
        por:
          description: Quién lo adjuntó.
          type: string
        en:
          type: string
          format: date-time
    PanelDeInconsistencias:
      description: Las inconsistencias globales de la versión vigente, abiertas y justificadas.
      type: object
      required: [periodo, creado, modificable, enRevision, versionCongelada, abiertas, inconsistencias, sinEvaluar]
      properties:
        periodo:
          type: string
        creado:
          description: Si el periodo tiene distributivo.
          type: boolean
        modificable:
          description: Si admite justificaciones; un periodo cerrado se lee, pero no se justifica.
          type: boolean
        enRevision:
          description: >-
            Si el distributivo ya está en revisión del Vicerrectorado o después: ya no se justifica
            (D-99).
          type: boolean
        versionCongelada:
          description: >-
            Si la versión vigente está congelada para la firma: ya no se justifica (F13-H01, D-100).
            Falso sin distributivo.
          type: boolean
        version:
          description: El número de la versión del distributivo; solo si está creado.
          type: integer
          minimum: 1
        abiertas:
          $ref: '#/components/schemas/TotalesDelPanel'
        inconsistencias:
          description: Primero las abiertas, y entre ellas las duras.
          type: array
          items:
            $ref: '#/components/schemas/InconsistenciaDelPanel'
        sinEvaluar:
          description: Las reglas globales que el panel todavía no evalúa.
          type: array
          items:
            type: string
    TotalesDelPanel:
      type: object
      required: [duras, blandas]
      properties:
        duras:
          type: integer
          minimum: 0
        blandas:
          type: integer
          minimum: 0
    InconsistenciaDelPanel:
      type: object
      required: [tipo, regla, severidad, estado, objeto, detalle, indicacion, pantalla]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDeInconsistencia'
        regla:
          type: string
        severidad:
          type: string
          enum: [DURA, BLANDA]
        estado:
          type: string
          enum: [ABIERTA, JUSTIFICADA]
        objeto:
          $ref: '#/components/schemas/ObjetoAfectado'
        detalle:
          description: Qué se incumple, para quien lo lee.
          type: string
        indicacion:
          description: Qué hacer y quién debe hacerlo.
          type: string
        pantalla:
          description: La pantalla donde se corrige.
          type: string
          enum: [OFERTA, ACTIVIDADES, CARGOS]
        justificacion:
          $ref: '#/components/schemas/JustificacionDelPanel'
    TipoDeInconsistencia:
      type: string
      enum: [DOCENTE_SIN_CLASE, PARALELO_SIN_PROPUESTA, COORDINADORES_DE_LA_CARRERA, GESTORES_FUERA_DE_RANGO, HORAS_SOBRE_LA_MALLA, SOBRECARGA, PROPORCION, ACTIVIDADES_OBLIGATORIAS, EXCEPCION_DE_AFINIDAD]
    ObjetoAfectado:
      type: object
      required: [clase, clave, nombre]
      properties:
        clase:
          type: string
          enum: [DOCENTE, PARALELO, CARRERA, PERIODO]
        clave:
          type: string
        nombre:
          description: Lo que se muestra.
          type: string
    JustificacionDelPanel:
      type: object
      required: [texto, por, en]
      properties:
        texto:
          type: string
        por:
          description: Quién la escribió.
          type: string
        en:
          type: string
          format: date-time
    JustificacionNueva:
      type: object
      required: [tipo, objeto, texto]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDeInconsistencia'
        objeto:
          description: La clave del objeto afectado.
          type: string
          pattern: '^[0-9A-Za-z._/-]{1,60}$'
        texto:
          description: Entre 10 y 500 caracteres, sin contar los espacios de los extremos.
          type: string
          maxLength: 500
    ActividadesDelPeriodo:
      type: object
      required: [creado, carreras]
      properties:
        creado:
          description: Si el periodo ya tiene distributivo.
          type: boolean
        carreras:
          type: array
          items:
            $ref: '#/components/schemas/ActividadesDeCarrera'
    ActividadesDeCarrera:
      type: object
      required: [carrera, docentes]
      properties:
        carrera:
          type: string
        docentes:
          type: array
          items:
            $ref: '#/components/schemas/ActividadesDelDocente'
    ActividadesDelDocente:
      type: object
      required: [docente, nombreDocente, actividades, totales]
      properties:
        docente:
          type: string
        nombreDocente:
          type: string
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadAsignada'
        totales:
          $ref: '#/components/schemas/HorasPorComponente'
    HorasPorComponente:
      description: Las horas del docente por componente, en todas las carreras y unidades (D-01).
      type: object
      required: [clase, otrasDocencia, investigacion, vinculacion, gestion]
      properties:
        clase:
          type: number
        otrasDocencia:
          type: number
        investigacion:
          type: number
        vinculacion:
          type: number
        gestion:
          type: number
    CargaHoraria:
      description: Los totales de un docente, sin el detalle de otras carreras (D-82).
      type: object
      required:
        - docente
        - nombreDocente
        - horasContratadas
        - totales
        - asignadas
        - disponibles
        - exceso
        - meta
      properties:
        docente:
          type: string
        nombreDocente:
          type: string
        horasContratadas:
          type: integer
          minimum: 0
        totales:
          $ref: '#/components/schemas/HorasPorComponente'
        asignadas:
          description: La suma de los cinco componentes.
          type: number
        disponibles:
          description: Horas contratadas menos asignadas, nunca menos de 0 (D-75).
          type: number
        exceso:
          description: Lo que pasa de las contratadas; 0 si no se pasa (D-78).
          type: number
        proporcion:
          $ref: '#/components/schemas/Proporcion'
        meta:
          $ref: '#/components/schemas/MetaDeProporcion'
    Proporcion:
      description: >-
        Los porcentajes de clase y de otras actividades de docencia, enteros, que suman 100. No
        viene si el docente no tiene horas en ninguna.
      type: object
      required: [clase, otrasDocencia]
      properties:
        clase:
          type: integer
          minimum: 0
          maximum: 100
        otrasDocencia:
          type: integer
          minimum: 0
          maximum: 100
    MetaDeProporcion:
      description: Los porcentajes de RN-05 en la versión de normativa que rige el periodo.
      type: object
      required: [clase, otrasDocencia]
      properties:
        clase:
          type: number
        otrasDocencia:
          type: number
    ActividadAsignada:
      type: object
      required: [actividad, nombre, componente, horas]
      properties:
        actividad:
          description: Código de la actividad, artículo y literal.
          type: string
        nombre:
          type: string
        componente:
          $ref: '#/components/schemas/Componente'
        horas:
          type: number
        proyecto:
          type: string
        nombreProyecto:
          type: string
    ActividadGuardada:
      type: object
      required: [actividad]
      properties:
        actividad:
          $ref: '#/components/schemas/ActividadAsignada'
    ActividadNueva:
      type: object
      required: [horas]
      properties:
        horas:
          description: Horas semanales, con hasta dos decimales (D-77).
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 40
        proyecto:
          description: Obligatorio en las actividades que exigen un proyecto (RN-25).
          type: string
          pattern: '^[0-9A-Z-]{1,30}$'
    ActividadesPosibles:
      type: object
      required: [docente, actividades]
      properties:
        docente:
          type: string
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadPosible'
    ActividadPosible:
      type: object
      required: [actividad, nombre, componente, disponible, exigeProyecto, proyectos]
      properties:
        actividad:
          type: string
        nombre:
          type: string
        componente:
          $ref: '#/components/schemas/Componente'
        disponible:
          type: boolean
        exigeProyecto:
          type: boolean
        proyectos:
          description: Los proyectos del docente que se pueden elegir.
          type: array
          items:
            $ref: '#/components/schemas/ProyectoPosible'
        motivo:
          description: Por qué no está disponible.
          type: string
    ProyectoPosible:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          type: string
        nombre:
          type: string
    Componente:
      type: string
      enum: [OTRAS_DOCENCIA, INVESTIGACION, VINCULACION, GESTION]
    Candidato:
      description: Un docente activo de la sugerencia, con su puntaje y sus horas.
      type: object
      required:
        - identificacion
        - nombre
        - dedicacion
        - horasContratadas
        - horasDisponibles
        - horasEnOtrasCarreras
        - horasSuficientes
        - puntaje
      properties:
        identificacion:
          type: string
        nombre:
          type: string
        dedicacion:
          $ref: '#/components/schemas/Dedicacion'
        horasContratadas:
          type: integer
          minimum: 1
        horasDisponibles:
          description: Horas contratadas menos horas asignadas, nunca menos de 0 (D-75).
          type: number
          minimum: 0
        horasEnOtrasCarreras:
          description: Las horas asignadas en otras carreras y unidades (D-01).
          type: number
          minimum: 0
        horasSuficientes:
          description: Si sus horas disponibles alcanzan para las del paralelo.
          type: boolean
        motivoParaNoProponer:
          description: Por qué no se le puede proponer; si no viene, se puede (RF-28).
          type: string
          enum: [HORAS, TOPE_DE_CLASE, AFINIDAD]
        puntaje:
          $ref: '#/components/schemas/PuntajeAfinidad'
    Dedicacion:
      description: Tiempo completo, medio tiempo o tiempo parcial (RN-01).
      type: string
      enum: [TC, MT, TP]
    AfinidadDelDocente:
      type: object
      required: [periodo, version, puntajes]
      properties:
        periodo:
          type: string
          description: Código del periodo.
        version:
          type: integer
          minimum: 1
          description: Número de la versión de normativa que da los pesos.
        puntajes:
          type: array
          items:
            $ref: '#/components/schemas/PuntajeAfinidad'
    PuntajeAfinidad:
      type: object
      required: [asignatura, nombre, total, topeAplicado, desglose]
      properties:
        asignatura:
          type: string
          description: Código de la asignatura.
        nombre:
          type: string
        total:
          type: number
          minimum: 0
        topeAplicado:
          type: boolean
          description: Si los cursos relacionados pasaban del tope de la versión.
        desglose:
          type: array
          items:
            $ref: '#/components/schemas/AporteDeAfinidad'
    AporteDeAfinidad:
      type: object
      required: [tipo, nombre, coincidencia, aporte]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDeAporte'
        nombre:
          type: string
          description: El título, el cargo o el nombre del curso.
        coincidencia:
          $ref: '#/components/schemas/CoincidenciaDeCampo'
        aporte:
          type: number
          minimum: 0
          exclusiveMinimum: true
    TipoDeAporte:
      type: string
      enum: [TERCER_NIVEL, CUARTO_NIVEL, EXPERIENCIA, CURSO]
    CoincidenciaDeCampo:
      type: string
      enum: [CAMPO_ESPECIFICO, CAMPO_AMPLIO]
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
