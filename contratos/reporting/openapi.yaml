# Contrato de Reporting (Publicación y consulta). F20-H01 (#268, D-115): el reporte individual del
# docente sobre la versión publicada vigente, en pantalla, en PDF/A-2b y en CSV. F20-H02 (#269,
# D-117): el reporte general consolidado de la institución, en los mismos tres formatos. F19-H01
# (#266, D-119): el CSV para SIGA con el layout de exportación configurable.
openapi: 3.0.3
info:
  title: MDD · reporting
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Reportes
    description: Reportes de la versión publicada vigente, para la pantalla (RF-45, RF-46).
  - name: Descargas
    description: >-
      Las descargas del reporte en PDF/A y en CSV, cada una registrada en la bitácora (RF-48,
      D-115).
  - name: Siga
    description: >-
      El CSV para SIGA de la versión publicada y el layout de exportación que lo define (RF-52,
      ADR-002, D-119). Solo la Secretaría general académica (PUBLICACION:APROBACION).
paths:
  /api/reporting/publicaciones:
    get:
      tags: [Reportes]
      operationId: listarPublicaciones
      summary: Devuelve los periodos con versión publicada vigente.
      description: >-
        De la publicación más reciente a la más antigua. Durante una reforma, la versión publicada
        anterior sigue siendo la vigente (D-113), con enReforma en true. Vacío si no hay ninguna.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: Las publicaciones vigentes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Publicacion'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/docentes:
    parameters:
      - $ref: '#/components/parameters/Periodo'
    get:
      tags: [Reportes]
      operationId: listarDocentesDelPeriodo
      summary: Devuelve la publicación vigente del periodo y los docentes de esa versión.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: La publicación y sus docentes, por nombre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocentesDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/docentes/{identificacion}/reporte:
    parameters:
      - $ref: '#/components/parameters/Periodo'
      - $ref: '#/components/parameters/Identificacion'
    get:
      tags: [Reportes]
      operationId: consultarReporteIndividual
      summary: Devuelve el reporte individual del docente, para la pantalla.
      description: >-
        Sale de la versión publicada vigente del periodo y de su contenido congelado (D-115). Ver
        el reporte no deja entrada en la bitácora; las descargas sí.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El reporte individual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteIndividual'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/DocenteSinDistributivo'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/docentes/{identificacion}/reporte.pdf:
    parameters:
      - $ref: '#/components/parameters/Periodo'
      - $ref: '#/components/parameters/Identificacion'
    get:
      tags: [Descargas]
      operationId: descargarReporteIndividualPdf
      summary: Descarga el reporte individual en PDF/A-2b, sin campos ni contenido activo.
      description: >-
        Cada descarga deja la entrada REPORTE_INDIVIDUAL_DESCARGADO en la bitácora, registrada
        antes de responder (D-115). Si el registro falla, no se entrega nada.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El PDF/A del reporte.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/DocenteSinDistributivo'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/docentes/{identificacion}/reporte.csv:
    parameters:
      - $ref: '#/components/parameters/Periodo'
      - $ref: '#/components/parameters/Identificacion'
    get:
      tags: [Descargas]
      operationId: descargarReporteIndividualCsv
      summary: Descarga el reporte individual en CSV, con los mismos datos del PDF.
      description: >-
        UTF-8 con BOM, separador punto y coma, fin de línea CRLF y horas con dos decimales y coma.
        Las celdas de texto que empiezan con =, +, -, @, tabulación o retorno de carro llevan un
        apóstrofo delante (RNF-SEG-04). No lleva quién lo generó ni cuándo. Cada descarga deja su
        entrada en la bitácora antes de responder (D-115).
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El CSV del reporte.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDisposition'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/DocenteSinDistributivo'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/reporte-general:
    parameters:
      - $ref: '#/components/parameters/Periodo'
    get:
      tags: [Reportes]
      operationId: consultarReporteGeneral
      summary: Devuelve el reporte general consolidado del periodo, para la pantalla.
      description: >-
        Cada docente de la versión publicada vigente con sus horas por componente y su total, y
        los totales institucionales (RF-46, D-117). Ver el reporte no deja entrada en la bitácora;
        las descargas sí.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El reporte general.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReporteGeneral'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/reporte-general.pdf:
    parameters:
      - $ref: '#/components/parameters/Periodo'
    get:
      tags: [Descargas]
      operationId: descargarReporteGeneralPdf
      summary: Descarga el reporte general en PDF/A-2b, sin campos ni contenido activo.
      description: >-
        A4 horizontal, con el encabezado de la tabla en cada página y «Total institucional» una
        sola vez, al final. Cada descarga deja la entrada REPORTE_GENERAL_DESCARGADO en la
        bitácora, registrada antes de responder (D-117). Si el registro falla, no se entrega nada.
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El PDF/A del reporte general.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionGeneral'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/reporte-general.csv:
    parameters:
      - $ref: '#/components/parameters/Periodo'
    get:
      tags: [Descargas]
      operationId: descargarReporteGeneralCsv
      summary: Descarga el reporte general en CSV, con los mismos datos del PDF.
      description: >-
        El formato del reporte individual (UTF-8 con BOM, punto y coma, CRLF, horas con dos
        decimales y coma, fórmulas neutralizadas). Una fila DOCENTE por docente, con una columna
        por componente y el total, y una fila TOTAL al final. No lleva quién lo generó ni cuándo.
        Cada descarga deja la entrada REPORTE_GENERAL_DESCARGADO en la bitácora antes de
        responder (D-117).
      x-mdd-permiso: [REPORTES:LECTURA]
      responses:
        '200':
          description: El CSV del reporte general.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionGeneral'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/periodos/{periodo}/csv-siga:
    parameters:
      - $ref: '#/components/parameters/Periodo'
    get:
      tags: [Siga]
      operationId: generarCsvSiga
      summary: Genera el CSV para SIGA de la versión publicada vigente del periodo.
      description: >-
        Una fila por docente y actividad (cada asignatura y paralelo, y cada actividad), con las
        columnas del layout de exportación vigente, en su orden. RFC 4180 con coma, CRLF y UTF-8
        sin BOM; texto en mayúsculas; NA para lo que no aplica; horas con punto y dos decimales;
        la fecha como aaaa-mm-dd; fórmulas neutralizadas. Sus sumas por docente y componente son
        las del reporte general de la misma versión: si no, no se entrega nada. No lleva quién lo
        generó ni cuándo, así que la misma versión con el mismo layout da el mismo archivo. Cada
        CSV deja la entrada CSV_SIGA_GENERADO en la bitácora antes de responder (D-119).
      x-mdd-permiso: [PUBLICACION:APROBACION]
      responses:
        '200':
          description: El CSV para SIGA.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionSiga'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/SinPublicacion'
        '500':
          $ref: '#/components/responses/ErrorDelReporte'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/reporting/layout-siga:
    get:
      tags: [Siga]
      operationId: consultarLayoutsSiga
      summary: Devuelve el layout de exportación vigente y las versiones anteriores.
      description: >-
        El vigente es la última versión cargada o, si no hay, el layout por defecto (versión 0).
        Las anteriores van de la más reciente a la más antigua, sin el por defecto.
      x-mdd-permiso: [PUBLICACION:APROBACION]
      responses:
        '200':
          description: El vigente y los anteriores.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutsSiga'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
    put:
      tags: [Siga]
      operationId: cargarLayoutSiga
      summary: Carga un archivo de mapeo nuevo, que queda vigente para el próximo CSV.
      description: >-
        Valida el archivo y responde todos sus problemas, con la columna y la regla. Un archivo
        rechazado no cambia el vigente ni deja entrada en la bitácora. Uno válido es la versión
        siguiente del layout de exportación, y deja LAYOUT_SIGA_CARGADO en la bitácora en la
        misma transacción. Las versiones anteriores se conservan (ADR-007, D-119).
      x-mdd-permiso: [PUBLICACION:APROBACION]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: La versión nueva, ya vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutSiga'
        '400':
          description: >-
            Tiene problemas, uno por detalle (REPORTING_LAYOUT_INVALIDO), no se puede leer
            (REPORTING_ARCHIVO_ILEGIBLE), o falta el archivo (COMUN_SOLICITUD_INVALIDA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '413':
          description: Pasa de 256 KB (REPORTING_ARCHIVO_DEMASIADO_GRANDE).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
  /api/reporting/layout-siga/plantilla.yaml:
    get:
      tags: [Siga]
      operationId: descargarPlantillaLayoutSiga
      summary: Descarga la plantilla del archivo de mapeo, que es el layout por defecto comentado.
      x-mdd-permiso: [PUBLICACION:APROBACION]
      responses:
        '200':
          description: El archivo YAML, comentado en español.
          headers:
            Content-Disposition:
              $ref: '#/components/headers/ContentDispositionPlantilla'
          content:
            text/yaml:
              schema:
                type: string
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  parameters:
    Periodo:
      name: periodo
      in: path
      required: true
      description: Código del periodo académico, el que usa Académico.
      schema:
        $ref: '#/components/schemas/CodigoDePeriodo'
      example: 2026-I
    Identificacion:
      name: identificacion
      in: path
      required: true
      description: Cédula o pasaporte del docente.
      schema:
        $ref: '#/components/schemas/NumeroDeIdentificacion'
  headers:
    ContentDisposition:
      description: >-
        attachment; filename="reporte-individual-<periodo>-<identificacion>.pdf" (o .csv).
      schema:
        type: string
    ContentDispositionGeneral:
      description: attachment; filename="reporte-general-<periodo>.pdf" (o .csv).
      schema:
        type: string
    ContentDispositionSiga:
      description: attachment; filename="siga-<periodo>-v<version>.csv".
      schema:
        type: string
    ContentDispositionPlantilla:
      description: attachment; filename="layout-siga-plantilla.yaml".
      schema:
        type: string
    CacheControl:
      description: no-store, porque lleva datos personales.
      schema:
        type: string
  responses:
    SinPublicacion:
      description: El periodo no tiene versión publicada (REPORTING_SIN_PUBLICACION).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    DocenteSinDistributivo:
      description: >-
        El docente no tiene asignaciones en la versión publicada del periodo
        (REPORTING_DOCENTE_SIN_DISTRIBUTIVO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ErrorDelReporte:
      description: >-
        El hash de la publicación no es el del contenido congelado, Generación no tiene esa
        versión, un docente viene repetido o, en el CSV para SIGA, sus sumas no son las del
        reporte general (REPORTING_CONTENIDO_INCONSISTENTE), o un error interno
        (COMUN_ERROR_INTERNO). No se entrega nada.
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    CodigoDePeriodo:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,20}$'
      example: 2026-I
    NumeroDeIdentificacion:
      description: Cédula de 10 dígitos o pasaporte de hasta 13 letras mayúsculas o dígitos.
      type: string
      pattern: '^[0-9A-Z]{1,13}$'
    Hash:
      description: SHA-256 en hexadecimal, en minúsculas.
      type: string
      pattern: '^[0-9a-f]{64}$'
    Horas:
      description: Horas semanales, con hasta dos decimales (D-77).
      type: number
      minimum: 0
      multipleOf: 0.01
    Componente:
      description: El componente de una actividad no lectiva; las asignaturas son de clase.
      type: string
      enum: [OTRAS_DOCENCIA, INVESTIGACION, VINCULACION, GESTION]
    Dedicacion:
      type: string
      enum: [TC, MT, TP]
    Publicacion:
      type: object
      additionalProperties: false
      required: [periodo, version, hash, publicadaEn, publicadaPor, enReforma]
      properties:
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        version:
          type: integer
          minimum: 1
        hash:
          $ref: '#/components/schemas/Hash'
        publicadaEn:
          type: string
          format: date-time
        publicadaPor:
          type: string
        enReforma:
          description: Hay una reforma en curso; esta versión sigue siendo la vigente.
          type: boolean
    DocenteDeLaVersion:
      type: object
      additionalProperties: false
      required: [identificacion, nombre]
      properties:
        identificacion:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombre:
          description: Los apellidos y los nombres.
          type: string
    DocentesDelPeriodo:
      type: object
      additionalProperties: false
      required: [publicacion, docentes]
      properties:
        publicacion:
          $ref: '#/components/schemas/Publicacion'
        docentes:
          type: array
          items:
            $ref: '#/components/schemas/DocenteDeLaVersion'
    DatosDelDocente:
      type: object
      additionalProperties: false
      required: [identificacion, nombre]
      properties:
        identificacion:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombre:
          type: string
        dedicacion:
          $ref: '#/components/schemas/Dedicacion'
        horasContratadas:
          type: integer
          minimum: 1
          maximum: 40
    FilaDeAsignatura:
      type: object
      additionalProperties: false
      required: [carrera, codigo, nombre, paralelo, horas]
      properties:
        carrera:
          description: El nombre de la carrera.
          type: string
        codigo:
          type: string
        nombre:
          type: string
        paralelo:
          type: string
        horas:
          $ref: '#/components/schemas/Horas'
    FilaDeActividad:
      type: object
      additionalProperties: false
      required: [componente, codigo, nombre, horas]
      properties:
        componente:
          $ref: '#/components/schemas/Componente'
        codigo:
          type: string
        nombre:
          type: string
        unidad:
          description: La carrera del parcial o el proyecto, si lo tiene.
          type: string
        horas:
          $ref: '#/components/schemas/Horas'
    HorasPorComponente:
      type: object
      additionalProperties: false
      required: [clase, otrasDocencia, investigacion, vinculacion, gestion, total]
      properties:
        clase:
          $ref: '#/components/schemas/Horas'
        otrasDocencia:
          $ref: '#/components/schemas/Horas'
        investigacion:
          $ref: '#/components/schemas/Horas'
        vinculacion:
          $ref: '#/components/schemas/Horas'
        gestion:
          $ref: '#/components/schemas/Horas'
        total:
          $ref: '#/components/schemas/Horas'
    ReporteIndividual:
      type: object
      additionalProperties: false
      required:
        [publicacion, docente, asignaturas, actividades, horas, generadoPor, generadoEn]
      properties:
        publicacion:
          $ref: '#/components/schemas/Publicacion'
        docente:
          $ref: '#/components/schemas/DatosDelDocente'
        asignaturas:
          description: Por carrera, código y paralelo.
          type: array
          items:
            $ref: '#/components/schemas/FilaDeAsignatura'
        actividades:
          description: Por componente y nombre.
          type: array
          items:
            $ref: '#/components/schemas/FilaDeActividad'
        horas:
          $ref: '#/components/schemas/HorasPorComponente'
        generadoPor:
          type: string
        generadoEn:
          type: string
          format: date-time
    FilaDelDocente:
      description: >-
        Un docente del reporte general, con sus horas por componente (F20-H02, D-117). Sin
        dedicacion si el docente no estaba activo al congelar.
      type: object
      additionalProperties: false
      required: [identificacion, nombre, horas]
      properties:
        identificacion:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombre:
          description: Los apellidos y los nombres.
          type: string
        dedicacion:
          $ref: '#/components/schemas/Dedicacion'
        horas:
          $ref: '#/components/schemas/HorasPorComponente'
    ReporteGeneral:
      description: >-
        El distributivo consolidado de la institución en la versión publicada vigente (RF-46,
        D-117). El número de docentes es el largo de docentes; totales son los totales
        institucionales (la suma exacta de las filas) y su total, el total general.
      type: object
      additionalProperties: false
      required: [publicacion, docentes, totales, generadoPor, generadoEn]
      properties:
        publicacion:
          $ref: '#/components/schemas/Publicacion'
        docentes:
          description: >-
            Por nombre, en orden alfabético del español (ÁLVAREZ antes que PERALTA), y a igual
            nombre por identificación.
          type: array
          items:
            $ref: '#/components/schemas/FilaDelDocente'
        totales:
          $ref: '#/components/schemas/HorasPorComponente'
        generadoPor:
          type: string
        generadoEn:
          type: string
          format: date-time
    LayoutsSiga:
      description: El layout de exportación vigente y las versiones anteriores (D-119).
      type: object
      additionalProperties: false
      required: [vigente, anteriores]
      properties:
        vigente:
          $ref: '#/components/schemas/LayoutSiga'
        anteriores:
          description: De la más reciente a la más antigua; sin el layout por defecto.
          type: array
          items:
            $ref: '#/components/schemas/LayoutSiga'
    LayoutSiga:
      description: Una versión del layout de exportación; la 0 es el layout por defecto.
      type: object
      additionalProperties: false
      required: [numero, porDefecto, sha256, columnas]
      properties:
        numero:
          type: integer
          minimum: 0
        porDefecto:
          type: boolean
        cargadoPor:
          description: Ausente en el layout por defecto.
          type: string
        cargadoEn:
          description: Ausente en el layout por defecto.
          type: string
          format: date-time
        sha256:
          $ref: '#/components/schemas/Hash'
        columnas:
          description: En el orden del archivo, que es su posición en el CSV.
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/ColumnaDelLayoutSiga'
    ColumnaDelLayoutSiga:
      type: object
      additionalProperties: false
      required: [nombre, campo]
      properties:
        nombre:
          description: El encabezado de la columna en el CSV.
          type: string
          pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'
        campo:
          $ref: '#/components/schemas/CampoDelLayoutSiga'
        traduccion:
          description: >-
            Los códigos de su catálogo y su valor en SIGA, en el orden del catálogo. Solo en
            tipo_identificacion, dedicacion y componente.
          type: array
          items:
            $ref: '#/components/schemas/TraduccionDeCodigo'
    TraduccionDeCodigo:
      type: object
      additionalProperties: false
      required: [codigo, valor]
      properties:
        codigo:
          type: string
        valor:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9 ._-]{0,29}$'
    CampoDelLayoutSiga:
      description: De dónde sale el valor de una columna (D-119).
      type: string
      enum:
        - periodo
        - version
        - fecha_publicacion
        - hash_version
        - tipo_identificacion
        - identificacion
        - docente
        - dedicacion
        - componente
        - actividad
        - carrera
        - asignatura
        - paralelo
        - proyecto
        - horas
