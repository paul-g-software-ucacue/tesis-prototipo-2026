# Contrato de Usuarios (servicio 01, proceso identidad). Inicio de sesión mínimo (D-37),
# sesión actual (D-39) y llave pública para validar los tokens (ADR-014). Desde B00-H05, las
# operaciones entre procesos en /interno/: el token de proceso (D-49) y el receptor de eventos,
# que el API Gateway no expone (ADR-018). Desde F05-H01, el bloqueo por intentos
# (429, D-60) y la renovación del token mientras hay actividad (ADR-020). Desde F05-H02, la lista de
# usuarios para asignarles roles, protegida con x-mdd-permiso (ADR-021). Desde F17-H01, el receptor
# registra cada EntradaBitacora, el lenguaje publicado de la bitácora (RF-44, D-90, D-91). Desde
# F17-H02, la consulta de la bitácora, solo de lectura, con BITACORA:LECTURA (D-16).
openapi: 3.0.3
info:
  title: MDD · Usuarios
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Sesion
    description: Inicio de sesión, sesión actual y renovación del token.
  - name: Jwks
    description: Llave pública con la que el API Gateway y los procesos validan los tokens.
  - name: TokenProceso
    description: Token de proceso para las entregas de eventos entre procesos (D-49).
  - name: Eventos
    description: Receptor de eventos de otros procesos, idempotente por idEvento (ADR-018).
  - name: Usuarios
    description: Usuarios del MDD, para asignarles roles (F05-H02).
  - name: Bitacora
    description: Consulta de la bitácora de auditoría, solo de lectura (F17-H02, RF-44).
paths:
  /api/usuarios/sesion:
    post:
      tags: [Sesion]
      operationId: iniciarSesion
      summary: Inicia sesión y devuelve un token firmado.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesSesion'
      responses:
        '200':
          description: Credenciales correctas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSesion'
        '401':
          description: >-
            Credenciales inválidas (USUARIOS_CREDENCIALES_INVALIDAS). La misma respuesta para un
            usuario inexistente, inactivo o una contraseña incorrecta.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '429':
          description: >-
            Demasiados intentos (USUARIOS_INICIO_BLOQUEADO). El nombre de usuario tuvo 5 intentos
            fallidos seguidos, exista o no, y queda bloqueado 15 minutos (D-60). No dice si el
            usuario existe.
          headers:
            Retry-After:
              description: Segundos que faltan para que termine el bloqueo.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    get:
      tags: [Sesion]
      operationId: consultarSesion
      summary: Devuelve el usuario y los roles del token.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                $ref: '../comun/seguridad.yaml#/components/schemas/SesionActual'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/usuarios/sesion/renovacion:
    post:
      tags: [Sesion]
      operationId: renovarSesion
      summary: Emite un token nuevo para la misma sesión, con otros 30 minutos.
      description: >-
        Con un token de sesión vigente. El token nuevo conserva el instante del inicio de sesión
        (claim inicio); pasadas 8 horas desde ese inicio responde 401 y la sesión termina. La SPA
        solo la llama si hubo actividad del usuario (ADR-020).
      responses:
        '200':
          description: Token renovado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSesion'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/usuarios/usuarios:
    get:
      tags: [Usuarios]
      operationId: listarUsuarios
      summary: Lista los usuarios ordenados por nombre de usuario, sin contraseñas ni hashes.
      x-mdd-permiso: USUARIOS_ROLES:LECTURA
      responses:
        '200':
          description: Los usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioResumen'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/usuarios/jwks:
    get:
      tags: [Jwks]
      operationId: consultarJwks
      summary: Llave pública de Usuarios en formato JWKS (RFC 7517).
      security: []
      responses:
        '200':
          description: Llaves públicas vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /interno/usuarios/token-proceso:
    post:
      tags: [TokenProceso]
      operationId: emitirTokenDeProceso
      summary: Emite un token de proceso de vida corta para entregar eventos.
      description: >-
        Solo entre procesos: el API Gateway no enruta /interno/. El token lleva sub proceso:<proceso>
        y el rol PROCESO, que solo sirve en /interno/ (ADR-018).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredencialesProceso'
      responses:
        '200':
          description: Clave correcta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenSesion'
        '401':
          description: >-
            Credenciales inválidas (USUARIOS_CREDENCIALES_INVALIDAS). La misma respuesta para una
            clave incorrecta y para un proceso sin clave configurada.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /interno/usuarios/eventos:
    post:
      tags: [Eventos]
      operationId: recibirEvento
      summary: Registra un evento de otro proceso una sola vez por idEvento.
      description: >-
        Receptor de la bitácora (F17-H01): admite los tipos <servicio>.EntradaBitacora de
        generacion, academico, docentes, normativa, roles y validacionocs, con un contenido
        EntradaBitacora, y registra cada uno como una entrada que no se puede borrar. Solo con un
        token de proceso (rol PROCESO). Un evento ya registrado también responde 204, sin
        registrarlo de nuevo. Dentro del proceso identidad, Roles entrega sin HTTP (ADR-024).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../comun/eventos.yaml#/components/schemas/EventoEntreProcesos'
      responses:
        '204':
          description: Entrada registrada, o ya registrada antes por el mismo idEvento.
        '400':
          description: >-
            El cuerpo no cumple el contrato (COMUN_SOLICITUD_INVALIDA, con detalles), el tipo no es
            uno de los seis o su prefijo no coincide con el origen (COMUN_EVENTO_NO_RECONOCIDO), o
            el contenido no es una EntradaBitacora válida (USUARIOS_ENTRADA_BITACORA_INVALIDA). En
            los tres casos no se registra nada y la publicación queda pendiente en el emisor.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/usuarios/bitacora:
    get:
      tags: [Bitacora]
      operationId: consultarBitacora
      summary: Consulta las entradas de la bitácora, de las más recientes a las más antiguas, por páginas.
      description: >-
        Solo lectura (F17-H02). Todos los filtros son opcionales y se combinan: una entrada aparece
        si cumple todos. Las fechas son días completos en la hora de Ecuador continental
        (America/Guayaquil). La primera respuesta trae un corte; las páginas siguientes lo envían
        para que una entrada que llega tarde no repita ni salte entradas (research §2). Nunca
        devuelve los valores de los datos personales de un docente (D-91).
      x-mdd-permiso: BITACORA:LECTURA
      parameters:
        - name: desde
          in: query
          required: false
          description: Fecha inicial, inclusiva, en hora de Ecuador continental.
          schema:
            type: string
            format: date
          example: '2026-11-07'
        - name: hasta
          in: query
          required: false
          description: Fecha final, inclusiva. No puede ser anterior a desde.
          schema:
            type: string
            format: date
          example: '2026-11-07'
        - name: usuario
          in: query
          required: false
          description: El nombre de usuario que hizo el cambio, exacto, o «sistema».
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: coordinacion.demo
        - name: servicio
          in: query
          required: false
          description: El servicio de origen del cambio.
          schema:
            $ref: '#/components/schemas/ServicioDeBitacora'
        - name: accion
          in: query
          required: false
          description: La acción, con su nombre en el servicio. Solo junto con servicio.
          schema:
            type: string
            pattern: '^[A-Z][A-Z_]{2,39}$'
          example: ACTIVIDAD_GUARDADA
        - name: identificador
          in: query
          required: false
          description: >-
            El identificador de un elemento (la cédula de un docente, el código de una asignatura,
            de una actividad o de un rol). Una entrada lo cumple si algún valor de su objeto, a
            cualquier profundidad, es igual.
          schema:
            type: string
            pattern: '^[0-9A-Za-z._/-]{1,64}$'
          example: 140-b
        - name: periodo
          in: query
          required: false
          description: El código del periodo del cambio.
          schema:
            type: string
            pattern: '^[A-Za-z0-9._-]{1,20}$'
          example: 2026-I
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: tamano
          in: query
          required: false
          description: Entradas por página.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: corte
          in: query
          required: false
          description: >-
            El corte de la primera respuesta. Solo cuentan las entradas recibidas hasta ese
            instante. No puede ser posterior al instante de la consulta.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: La página de entradas; sin entradas, una lista vacía con total 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDeBitacora'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/usuarios/bitacora/acciones:
    get:
      tags: [Bitacora]
      operationId: listarAccionesDeBitacora
      summary: Las acciones distintas que hay en la bitácora, por servicio, para elegir el filtro.
      x-mdd-permiso: BITACORA:LECTURA
      responses:
        '200':
          description: Los pares servicio y acción, ordenados por servicio y acción.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccionDeBitacora'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  schemas:
    CredencialesSesion:
      type: object
      required: [usuario, clave]
      properties:
        usuario:
          type: string
          minLength: 1
          description: >-
            Nombre de usuario; no distingue mayúsculas y minúsculas. Vacío responde 400 (D-42).
          example: autor.prueba
        clave:
          type: string
          format: password
          minLength: 1
          description: Contraseña del usuario. Vacía responde 400 (D-42).
    CredencialesProceso:
      type: object
      required: [proceso, clave]
      properties:
        proceso:
          type: string
          minLength: 1
          pattern: '^[a-z]+$'
          description: Nombre del proceso que pide el token.
          example: distributivo
        clave:
          type: string
          format: password
          minLength: 1
          description: Clave del proceso (MDD_CLAVE_PROCESO_<PROCESO>).
    TokenSesion:
      type: object
      required: [token, tipo, venceEn]
      properties:
        token:
          type: string
          description: JWT firmado con RS256.
        tipo:
          type: string
          enum: [Bearer]
          description: Tipo de token, para el encabezado Authorization.
        venceEn:
          type: string
          format: date-time
          description: Fecha y hora de vencimiento del token (ISO 8601).
    UsuarioResumen:
      type: object
      required: [usuario, nombre, activo]
      properties:
        usuario:
          type: string
          description: Nombre de usuario, normalizado.
          example: docente.demo
        nombre:
          type: string
          description: Nombre para mostrar.
          example: Docente (demo)
        activo:
          type: boolean
    EntradaBitacora:
      description: >-
        Lenguaje publicado de la bitácora (modelo de dominio §4): quién, qué, cuándo, objeto, valor
        anterior y valor nuevo de un cambio ya guardado en su servicio (RF-44). Es el contenido de
        los eventos <servicio>.EntradaBitacora. Nunca lleva contraseñas, tokens, el texto de una
        justificación ni los valores de los datos personales de un docente (D-91). Además del
        esquema, anterior y nuevo no faltan los dos, y el contenido no pasa de 64 KB.
      type: object
      additionalProperties: false
      required: [usuario, accion, momento, objeto]
      properties:
        usuario:
          type: string
          minLength: 1
          maxLength: 64
          description: Quién inició el cambio, o «sistema». Sin otro formato, como el nombre de usuario.
          example: coordinacion.demo
        accion:
          type: string
          pattern: '^[A-Z][A-Z_]{2,39}$'
          description: Qué se hizo, con el nombre de la acción en su servicio.
          example: ACTIVIDAD_GUARDADA
        momento:
          type: string
          format: date-time
          description: Cuándo se guardó el cambio en su servicio (ISO 8601, UTC).
        periodo:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
          description: El periodo al que pertenece el cambio; falta si no pertenece a uno.
          example: 2026-I
        objeto:
          type: object
          additionalProperties: true
          description: Sobre qué se hizo, con la forma del registro de cambios de su servicio.
        anterior:
          type: object
          additionalProperties: true
          description: Los valores antes del cambio; falta al crear.
        nuevo:
          type: object
          additionalProperties: true
          description: Los valores después del cambio; falta al quitar.
    ServicioDeBitacora:
      type: string
      description: Un servicio que registra cambios en la bitácora (D-90).
      enum: [generacion, academico, docentes, normativa, roles, validacionocs]
      example: generacion
    PaginaDeBitacora:
      type: object
      additionalProperties: false
      required: [entradas, total, pagina, tamano, corte]
      properties:
        entradas:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EntradaConsultada'
        total:
          type: integer
          format: int64
          minimum: 0
          description: Las entradas que cumplen el filtro, recibidas hasta el corte.
        pagina:
          type: integer
          format: int32
          minimum: 1
        tamano:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
        corte:
          type: string
          format: date-time
          description: Se envía en las páginas siguientes para que no cambien.
    EntradaConsultada:
      description: >-
        Una entrada de la bitácora tal como se registró (F17-H01): los campos de EntradaBitacora,
        con las mismas reglas, más su identificador y su servicio. Sin datos personales de un
        docente (D-91).
      type: object
      additionalProperties: false
      required: [id, servicio, usuario, accion, momento, objeto]
      properties:
        id:
          type: string
          format: uuid
          description: El idEvento que trajo la entrada.
        servicio:
          $ref: '#/components/schemas/ServicioDeBitacora'
        usuario:
          type: string
          minLength: 1
          maxLength: 64
          example: coordinacion.demo
        accion:
          type: string
          pattern: '^[A-Z][A-Z_]{2,39}$'
          example: ACTIVIDAD_GUARDADA
        momento:
          type: string
          format: date-time
        periodo:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
          example: 2026-I
        objeto:
          type: object
          additionalProperties: true
        anterior:
          type: object
          additionalProperties: true
          description: Falta al crear.
        nuevo:
          type: object
          additionalProperties: true
          description: Falta al quitar.
    AccionDeBitacora:
      type: object
      additionalProperties: false
      required: [servicio, accion]
      properties:
        servicio:
          $ref: '#/components/schemas/ServicioDeBitacora'
        accion:
          type: string
          pattern: '^[A-Z][A-Z_]{2,39}$'
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'
    Jwk:
      description: Llave pública RSA. Nunca contiene partes privadas.
      type: object
      required: [kty, kid, use, alg, n, e]
      properties:
        kty:
          type: string
          example: RSA
        kid:
          type: string
          description: Huella SHA-256 de la llave pública, en Base64URL.
        use:
          type: string
          example: sig
        alg:
          type: string
          example: RS256
        n:
          type: string
          description: Módulo RSA, en Base64URL.
        e:
          type: string
          description: Exponente público RSA, en Base64URL.
