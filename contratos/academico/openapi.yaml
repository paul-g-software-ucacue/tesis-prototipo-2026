# Contrato de Académico (servicio 11, proceso datos). Desde F02-H01: los periodos académicos con sus
# estados (RF-13): registrarlos, corregirlos, abrirlos con su versión de normativa (RF-19) y hacerlos
# avanzar de Planificación a En aprobación, a Vigente y a Cerrado, en ese orden (pregunta 4 del
# modelo de dominio). La versión del periodo la guarda Normativa (asignación normativa); Académico se
# la pide por su interfaz publicada dentro del proceso.
# Leer exige «Distributivo del periodo: lectura» y escribir, «Distributivo del periodo: escritura»,
# con x-mdd-permiso (ADR-021, D-69). Escribe solo el Vicerrector académico (D-65).
# Desde F03-H01: la estructura orgánica (RF-12), con su jerarquía y las 21 gestiones autorizadas de
# POL 6 como catálogo fijo (RN-10, V-02; nadie lo amplía, D-70). Las comisiones son un dato
# informativo, sin horas (C-12). Mantenerla exige «Catálogos y datos maestros: escritura»; la leen
# quienes tienen «Distributivo del periodo: lectura» o «Catálogos y datos maestros: lectura»: una
# lista en x-mdd-permiso son permisos alternativos (D-70).
# Desde F03-H02: las carreras (carga 2), sus mallas con su código de versión y su estado, y sus
# asignaturas (carga 4) con los datos para la afinidad (RF-12, RF-14, RN-19, RN-24). Las mantienen
# quienes tienen «Catálogos y datos maestros: escritura» o «Distributivo del periodo: escritura»: el
# Administrador y el Vicerrector; las leen quienes leen la estructura (D-70). Nada se borra.
openapi: 3.0.3
info:
  title: MDD · Académico
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Periodos
    description: >-
      Periodos académicos con su estado y su versión de normativa (RF-13, RF-19). Un periodo cerrado
      ya no cambia.
  - name: Estructura
    description: >-
      La estructura orgánica de la institución (RF-12): sedes, órganos, coordinaciones, gestiones y
      comisiones, cada una debajo de la unidad de la que depende. Ninguna unidad se borra.
  - name: Carreras
    description: >-
      Las carreras, sus mallas y sus asignaturas (RF-12, RF-14, cargas 2 y 4), con los datos para la
      afinidad (RN-19, RN-24). Nada se borra.
paths:
  /api/academico/periodos:
    get:
      tags: [Periodos]
      operationId: listarPeriodos
      summary: Lista los periodos académicos, del más reciente al más antiguo.
      x-mdd-permiso: DISTRIBUTIVO:LECTURA
      responses:
        '200':
          description: Los periodos, por fecha de inicio descendente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PeriodoAcademico'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Periodos]
      operationId: registrarPeriodo
      summary: Registra un periodo académico en Planificación, sin versión de normativa.
      description: >-
        El código no cambia después: Normativa y las demás partes lo usan como referencia. Cuando
        llegue la carga 3 (F01), usará este mismo registro.
      x-mdd-permiso: DISTRIBUTIVO:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeriodoNuevo'
      responses:
        '201':
          description: El periodo registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoAcademico'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/periodos/{codigo}:
    parameters:
      - $ref: '#/components/parameters/Codigo'
    get:
      tags: [Periodos]
      operationId: consultarPeriodo
      summary: Devuelve un periodo académico con su estado y su versión de normativa.
      x-mdd-permiso: DISTRIBUTIVO:LECTURA
      responses:
        '200':
          description: El periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoAcademico'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Periodos]
      operationId: corregirPeriodo
      summary: Corrige el nombre y las fechas de un periodo que no está cerrado.
      x-mdd-permiso: DISTRIBUTIVO:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDelPeriodo'
      responses:
        '200':
          description: El periodo corregido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoAcademico'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/periodos/{codigo}/normativa:
    parameters:
      - $ref: '#/components/parameters/Codigo'
    put:
      tags: [Periodos]
      operationId: abrirPeriodo
      summary: Abre el periodo asociándole su versión de normativa.
      description: >-
        Solo en Planificación. Desde entonces la versión no cambia, y el periodo no pasa a otra.
        Abrirlo otra vez con la misma versión no cambia nada. Una versión que no existe responde
        400 con el detalle en version.
      x-mdd-permiso: DISTRIBUTIVO:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionDelPeriodo'
      responses:
        '200':
          description: El periodo con su versión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoAcademico'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/periodos/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/Codigo'
    put:
      tags: [Periodos]
      operationId: cambiarEstadoPeriodo
      summary: Pasa el periodo al estado siguiente.
      description: >-
        Recibe el estado de destino, que tiene que ser el siguiente: Planificación, En aprobación,
        Vigente y Cerrado, sin saltos ni retrocesos. Salir de Planificación exige la versión de
        normativa. Pedir el estado en que ya está no cambia nada.
      x-mdd-permiso: DISTRIBUTIVO:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDeDestino'
      responses:
        '200':
          description: El periodo en su estado nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoAcademico'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/gestiones-autorizadas:
    get:
      tags: [Estructura]
      operationId: listarGestionesAutorizadas
      summary: Lista las 21 gestiones autorizadas de POL 6, por código.
      description: >-
        El catálogo es fijo: ninguna operación lo cambia, y se amplía solo con una migración si la
        norma cambia (RN-10, D-70).
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: Las gestiones autorizadas, de G01 a G21.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GestionAutorizada'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/unidades:
    get:
      tags: [Estructura]
      operationId: listarUnidades
      summary: Lista todas las unidades de la estructura, activas e inactivas, por código.
      description: Cada unidad trae el código de su padre; la jerarquía se arma con él.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: Las unidades, por código.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UnidadOrganica'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Estructura]
      operationId: registrarUnidad
      summary: Registra una unidad activa debajo de una unidad activa.
      description: >-
        Solo la sede matriz no tiene padre, y hay una sola. El padre existe, está activo y no forma
        un ciclo. Una gestión lleva una gestión autorizada del catálogo, una comisión no lleva
        ninguna y los demás tipos pueden llevarla. Una comisión lleva si es permanente; los demás
        tipos, no. El código y el tipo no cambian después.
      x-mdd-permiso: CATALOGOS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnidadNueva'
      responses:
        '201':
          description: La unidad registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadOrganica'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeUnidad'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/unidades/{codigo}:
    parameters:
      - $ref: '#/components/parameters/CodigoDeUnidad'
    get:
      tags: [Estructura]
      operationId: consultarUnidad
      summary: Devuelve una unidad de la estructura.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La unidad.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadOrganica'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/UnidadNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Estructura]
      operationId: corregirUnidad
      summary: Corrige el nombre, el padre y los datos de su tipo; el código y el tipo no cambian.
      x-mdd-permiso: CATALOGOS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeUnidad'
      responses:
        '200':
          description: La unidad corregida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadOrganica'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/UnidadNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/unidades/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/CodigoDeUnidad'
    put:
      tags: [Estructura]
      operationId: cambiarEstadoUnidad
      summary: Inactiva o reactiva una unidad.
      description: >-
        Inactivar exige que ninguna unidad activa dependa de ella; reactivar, que su padre esté
        activo. Pedir el estado que ya tiene no cambia nada.
      x-mdd-permiso: CATALOGOS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDeUnidad'
      responses:
        '200':
          description: La unidad en su estado nuevo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnidadOrganica'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/UnidadNoEncontrada'
        '409':
          $ref: '#/components/responses/ConflictoDeUnidad'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/campos-amplios:
    get:
      tags: [Carreras]
      operationId: listarCamposAmplios
      summary: Lista los 11 campos amplios de la CINE, con su nombre.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampoAmplio'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/carreras:
    get:
      tags: [Carreras]
      operationId: listarCarreras
      summary: Lista las carreras, por código, cada una con el resumen de sus mallas.
      description: >-
        Cada malla trae sus asignaturas activas y el total de sus horas semanales de clase,
        para que la oferta aplique RN-18 (F03-H03).
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Carrera'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Carreras]
      operationId: registrarCarrera
      summary: Registra una carrera vigente en una sede, extensión o campus activo.
      description: >-
        El código SENESCYT y las siglas son únicos. El campo específico empieza por el amplio y
        el detallado, si viene, por el específico. El código no cambia después.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarreraNueva'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeCarrera'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/carreras/{codigo}:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarrera'
    get:
      tags: [Carreras]
      operationId: consultarCarrera
      summary: Devuelve una carrera con el resumen de sus mallas.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Carreras]
      operationId: corregirCarrera
      summary: Corrige los datos de una carrera; el código no cambia.
      description: >-
        El número de ciclos no baja del ciclo de una asignatura activa de la carrera.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeCarrera'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeCarrera'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/carreras/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarrera'
    put:
      tags: [Carreras]
      operationId: cambiarEstadoCarrera
      summary: 'Cambia el estado de una carrera: vigente, no vigente o en cierre.'
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDeCarreraNuevo'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Carrera'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/carreras/{codigo}/mallas:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarrera'
    post:
      tags: [Carreras]
      operationId: registrarMalla
      summary: Registra una malla vigente de una carrera vigente.
      description: >-
        El código de versión (por ejemplo, DS-2019) es único y no cambia después.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MallaNueva'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenDeMalla'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeCarrera'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/carreras/{codigo}/asignaturas:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarrera'
    get:
      tags: [Carreras]
      operationId: listarAsignaturasDeCarrera
      summary: Lista las asignaturas de una carrera, de todas sus mallas, por código.
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asignatura'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/mallas/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/CodigoDeMalla'
    put:
      tags: [Carreras]
      operationId: cambiarEstadoMalla
      summary: Deroga una malla o la vuelve a poner vigente; una derogada no admite asignaturas nuevas.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDeMallaNuevo'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenDeMalla'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/asignaturas:
    post:
      tags: [Carreras]
      operationId: registrarAsignatura
      summary: Registra una asignatura activa en una malla vigente de su carrera vigente.
      description: >-
        Sin carrera o sin horas semanales de clase no se guarda, y la respuesta dice qué falta
        (RF-14). El ciclo no pasa el número de ciclos de la carrera. El código, la carrera y la
        malla no cambian después.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignaturaNueva'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignatura'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeCarrera'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/asignaturas/{codigo}:
    parameters:
      - $ref: '#/components/parameters/CodigoDeAsignatura'
    get:
      tags: [Carreras]
      operationId: consultarAsignatura
      summary: 'Devuelve una asignatura con los datos para la afinidad: campos, palabras clave y tronco común.'
      x-mdd-permiso: [DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignatura'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Carreras]
      operationId: corregirAsignatura
      summary: Corrige los datos de una asignatura; el código, la carrera y la malla no cambian.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeAsignatura'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignatura'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/academico/asignaturas/{codigo}/estado:
    parameters:
      - $ref: '#/components/parameters/CodigoDeAsignatura'
    put:
      tags: [Carreras]
      operationId: cambiarEstadoAsignatura
      summary: Inactiva o reactiva una asignatura; reactivarla exige su malla vigente.
      x-mdd-permiso: [CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoDeAsignatura'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asignatura'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  parameters:
    Codigo:
      name: codigo
      in: path
      required: true
      description: Código del periodo académico, el mismo que usa Normativa.
      schema:
        $ref: '#/components/schemas/CodigoDePeriodo'
      example: 2026-2
    CodigoDeUnidad:
      name: codigo
      in: path
      required: true
      description: Código de la unidad orgánica.
      schema:
        $ref: '#/components/schemas/CodigoDeUnidad'
      example: MATRIZ
    CodigoDeCarrera:
      name: codigo
      in: path
      required: true
      description: Código SENESCYT de la carrera.
      schema:
        $ref: '#/components/schemas/CodigoDeCarrera'
      example: 550613A01-P-0301
    CodigoDeMalla:
      name: codigo
      in: path
      required: true
      description: Código de versión de la malla.
      schema:
        $ref: '#/components/schemas/CodigoDeMalla'
      example: DS-2019
    CodigoDeAsignatura:
      name: codigo
      in: path
      required: true
      description: Código de la asignatura.
      schema:
        $ref: '#/components/schemas/CodigoDeAsignatura'
      example: DS-B-I-MD-101
  responses:
    NoEncontrado:
      description: El periodo no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    Conflicto:
      description: >-
        El cambio no cumple una regla del periodo: ACADEMICO_CODIGO_REPETIDO,
        ACADEMICO_PERIODO_CERRADO, ACADEMICO_TRANSICION_NO_PERMITIDA, ACADEMICO_PERIODO_SIN_VERSION
        o ACADEMICO_PERIODO_CON_VERSION (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    UnidadNoEncontrada:
      description: La unidad no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConflictoDeUnidad:
      description: >-
        El cambio no cumple una regla de la estructura: ACADEMICO_UNIDAD_REPETIDA,
        ACADEMICO_SEDE_MATRIZ_EXISTENTE o ACADEMICO_UNIDAD_CON_DEPENDIENTES (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConflictoDeCarrera:
      description: >-
        Un código o unas siglas repetidos: ACADEMICO_CARRERA_REPETIDA, ACADEMICO_SIGLAS_REPETIDAS,
        ACADEMICO_MALLA_REPETIDA o ACADEMICO_ASIGNATURA_REPETIDA (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    CodigoDePeriodo:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,20}$'
      example: 2026-2
    EstadoPeriodo:
      type: string
      enum: [PLANIFICACION, EN_APROBACION, VIGENTE, CERRADO]
      description: Planificación, En aprobación, Vigente o Cerrado (RF-13).
    PeriodoAcademico:
      type: object
      required: [codigo, nombre, inicio, fin, estado]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          example: Periodo 2026-2
        inicio:
          type: string
          format: date
          example: '2026-09-01'
        fin:
          type: string
          format: date
          example: '2027-02-28'
        estado:
          $ref: '#/components/schemas/EstadoPeriodo'
        version:
          type: integer
          minimum: 1
          description: La versión de normativa que rige el periodo. Sin versión, no viene.
          example: 2
    PeriodoNuevo:
      type: object
      required: [codigo, nombre, inicio, fin]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          example: Periodo 2026-2
        inicio:
          type: string
          format: date
          example: '2026-09-01'
        fin:
          type: string
          format: date
          description: Posterior al inicio.
          example: '2027-02-28'
    DatosDelPeriodo:
      type: object
      required: [nombre, inicio, fin]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
          example: Periodo 2026-2
        inicio:
          type: string
          format: date
          example: '2026-09-01'
        fin:
          type: string
          format: date
          description: Posterior al inicio.
          example: '2027-02-28'
    VersionDelPeriodo:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          description: El número de la versión de normativa.
          example: 1
    EstadoDeDestino:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoPeriodo'
    CodigoDeUnidad:
      type: string
      pattern: '^[A-Z0-9_-]{1,20}$'
      description: Mayúsculas, dígitos, «-» o «_», como en la carga 01.
      example: G-INV
    CodigoDeGestion:
      type: string
      pattern: '^G(0[1-9]|1[0-9]|2[01])$'
      description: Una de las 21 gestiones autorizadas de POL 6.
      example: G07
    TipoDeUnidad:
      type: string
      enum: [SEDE_MATRIZ, SEDE, EXTENSION, CAMPUS, GOBIERNO, UNIDAD_ACADEMICA, GESTION, COMISION]
      description: >-
        Sede matriz, Sede, Extensión, Campus, Gobierno, Unidad académica, Gestión o Comisión. Una
        comisión es un dato informativo, sin horas (C-12).
    GestionAutorizada:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeGestion'
        nombre:
          type: string
          example: Gestor de Investigación, Desarrollo Tecnológico e Innovación
    UnidadOrganica:
      type: object
      required: [codigo, nombre, tipo, activa]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeUnidad'
        tipo:
          $ref: '#/components/schemas/TipoDeUnidad'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Gestión de Investigación
        padre:
          $ref: '#/components/schemas/CodigoDeUnidad'
        gestionAutorizada:
          $ref: '#/components/schemas/CodigoDeGestion'
        comisionPermanente:
          type: boolean
          description: Solo en una comisión, y obligatorio en ella.
        activa:
          type: boolean
    UnidadNueva:
      type: object
      required: [codigo, nombre, tipo]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeUnidad'
        tipo:
          $ref: '#/components/schemas/TipoDeUnidad'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Gestión de Investigación
        padre:
          $ref: '#/components/schemas/CodigoDeUnidad'
        gestionAutorizada:
          $ref: '#/components/schemas/CodigoDeGestion'
        comisionPermanente:
          type: boolean
          description: Solo en una comisión, y obligatorio en ella.
    DatosDeUnidad:
      type: object
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: Gestión de Investigación
        padre:
          $ref: '#/components/schemas/CodigoDeUnidad'
        gestionAutorizada:
          $ref: '#/components/schemas/CodigoDeGestion'
        comisionPermanente:
          type: boolean
          description: Solo en una comisión, y obligatorio en ella.
    EstadoDeUnidad:
      type: object
      required: [activa]
      properties:
        activa:
          type: boolean
          description: true para reactivar, false para inactivar.
    CodigoDeCarrera:
      type: string
      pattern: '^[0-9A-Z-]{1,20}$'
      example: 550613A01-P-0301
    CodigoDeMalla:
      type: string
      pattern: '^[0-9A-Z-]{1,20}$'
      example: DS-2019
    CodigoDeAsignatura:
      type: string
      pattern: '^[0-9A-Z-]{1,30}$'
      example: DS-B-I-MD-101
    CodigoDeCampoAmplio:
      type: string
      pattern: '^(0[0-9]|10)$'
      example: '06'
    CodigoDeCampoEspecifico:
      type: string
      pattern: '^[0-9]{3}$'
      example: '061'
    NivelDeFormacion:
      description: Nivel de formación de la carrera (carga 2).
      type: string
      enum: [TECNICO_SUPERIOR, TECNOLOGICO_SUPERIOR, TECNOLOGICO_SUPERIOR_UNIVERSITARIO]
    Modalidad:
      description: Modalidad de estudios (RRA art. 54).
      type: string
      enum: [PRESENCIAL, SEMIPRESENCIAL, EN_LINEA, A_DISTANCIA, DUAL, HIBRIDA]
    Jornada:
      description: Jornada en que se oferta la carrera.
      type: string
      enum: [MATUTINA, VESPERTINA, NOCTURNA, INTENSIVA]
    UnidadDeOrganizacionCurricular:
      description: Unidad de organización curricular de la asignatura.
      type: string
      enum: [BASICA, PROFESIONAL, INTEGRACION_CURRICULAR]
    EstadoDeCarrera:
      description: Solo una carrera vigente admite mallas y asignaturas nuevas, y oferta.
      type: string
      enum: [VIGENTE, NO_VIGENTE, EN_CIERRE]
    EstadoDeMalla:
      description: Una malla derogada conserva sus asignaturas, pero no admite nuevas.
      type: string
      enum: [VIGENTE, DEROGADA]
    CampoAmplio:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        nombre:
          type: string
          example: Tecnologías de la información y la comunicación
    ResumenDeMalla:
      type: object
      required: [codigo, estado, asignaturas, horasSemanalesClase]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeMalla'
        estado:
          $ref: '#/components/schemas/EstadoDeMalla'
        asignaturas:
          description: Las asignaturas activas de la malla.
          type: integer
          minimum: 0
        horasSemanalesClase:
          description: La suma de las horas semanales de clase de sus asignaturas activas (RN-18).
          type: number
          minimum: 0
    Carrera:
      type: object
      required: [codigo, nombre, siglas, sede, nivelFormacion, modalidad, jornadas, campoAmplio, campoEspecifico, numeroCiclos, estado, mallas]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeCarrera'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: DESARROLLO DE SOFTWARE
        siglas:
          type: string
          pattern: '^[0-9A-Z]{1,10}$'
          example: DS
        sede:
          $ref: '#/components/schemas/CodigoDeUnidad'
        nivelFormacion:
          $ref: '#/components/schemas/NivelDeFormacion'
        modalidad:
          $ref: '#/components/schemas/Modalidad'
        jornadas:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Jornada'
        campoAmplio:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        campoDetallado:
          type: string
          pattern: '^[0-9]{4}$'
          example: '0613'
        numeroCiclos:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
        estado:
          $ref: '#/components/schemas/EstadoDeCarrera'
        mallas:
          type: array
          items:
            $ref: '#/components/schemas/ResumenDeMalla'
    CarreraNueva:
      type: object
      required: [codigo, nombre, siglas, sede, nivelFormacion, modalidad, jornadas, campoAmplio, campoEspecifico, numeroCiclos]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeCarrera'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: DESARROLLO DE SOFTWARE
        siglas:
          type: string
          pattern: '^[0-9A-Z]{1,10}$'
          example: DS
        sede:
          $ref: '#/components/schemas/CodigoDeUnidad'
        nivelFormacion:
          $ref: '#/components/schemas/NivelDeFormacion'
        modalidad:
          $ref: '#/components/schemas/Modalidad'
        jornadas:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Jornada'
        campoAmplio:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        campoDetallado:
          type: string
          pattern: '^[0-9]{4}$'
          example: '0613'
        numeroCiclos:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
    DatosDeCarrera:
      type: object
      required: [nombre, siglas, sede, nivelFormacion, modalidad, jornadas, campoAmplio, campoEspecifico, numeroCiclos]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: DESARROLLO DE SOFTWARE
        siglas:
          type: string
          pattern: '^[0-9A-Z]{1,10}$'
          example: DS
        sede:
          $ref: '#/components/schemas/CodigoDeUnidad'
        nivelFormacion:
          $ref: '#/components/schemas/NivelDeFormacion'
        modalidad:
          $ref: '#/components/schemas/Modalidad'
        jornadas:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Jornada'
        campoAmplio:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        campoDetallado:
          type: string
          pattern: '^[0-9]{4}$'
          example: '0613'
        numeroCiclos:
          type: integer
          minimum: 1
          maximum: 10
          example: 5
    EstadoDeCarreraNuevo:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoDeCarrera'
    MallaNueva:
      type: object
      required: [codigo]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeMalla'
    EstadoDeMallaNuevo:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoDeMalla'
    Asignatura:
      type: object
      required: [codigo, carrera, malla, nombre, ciclo, unidadOrganizacionCurricular, horasSemanalesClase, troncoComun, campoAmplio, campoEspecifico, palabrasClave, activa]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeAsignatura'
        carrera:
          $ref: '#/components/schemas/CodigoDeCarrera'
        malla:
          $ref: '#/components/schemas/CodigoDeMalla'
        nombre:
          type: string
          minLength: 1
          maxLength: 150
          example: MATEMÁTICA DISCRETA
        ciclo:
          type: integer
          minimum: 1
          maximum: 10
          example: 1
        unidadOrganizacionCurricular:
          $ref: '#/components/schemas/UnidadDeOrganizacionCurricular'
        horasSemanalesClase:
          type: number
          minimum: 0.5
          maximum: 20
          example: 3
        horasPracticasSemanales:
          type: number
          minimum: 0
          maximum: 20
        creditos:
          type: number
          exclusiveMinimum: true
          minimum: 0
        troncoComun:
          type: boolean
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        palabrasClave:
          type: array
          minItems: 2
          items:
            type: string
            minLength: 1
            maxLength: 300
          example: [matemática, lógica, conjuntos]
        campoAmplio:
          $ref: '#/components/schemas/CampoAmplio'
        activa:
          type: boolean
    AsignaturaNueva:
      description: Sin carrera o sin horas semanales de clase no se guarda (RF-14).
