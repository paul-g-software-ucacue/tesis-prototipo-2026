# Contrato de Normativa (servicio 12, proceso datos). Desde F04-H01: la consulta de las versiones de
# normativa, con la Política SENESCYT 2024 como versión 1 (RF-19, RN-01 a RN-15). Desde F04-H02:
# crear una versión a partir de otra, editarla mientras no rija un periodo y asociarla a un periodo.
# Desde F04-H03: los pesos y el mínimo de afinidad (RN-24 y RN-19), las reglas del motor que faltaban
# y la severidad editable de cada una (MD-08).
# Leer exige «Parámetros y normativa: lectura» y escribir, «Parámetros y normativa: escritura», con
# x-mdd-permiso (ADR-021). Las dos las tienen el Administrador del sistema y el Vicerrector
# académico (D-65, D-66, D-67).
# Desde F06-H01: los pesos de afinidad del periodo para Generación, por una ruta interna (ADR-023).
# Desde F06-H02: esa ruta también trae el mínimo de afinidad (RN-19).
openapi: 3.0.3
info:
  title: MDD · Normativa
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Versiones
    description: Versiones de normativa con su tabla de carga horaria y sus reglas (RF-19).
  - name: Periodos
    description: >-
      La versión de normativa que rige cada periodo académico (asignación normativa). Un periodo
      tiene una sola versión, y una versión que rige un periodo ya no cambia.
  - name: Interno
    description: Consultas entre procesos (ADR-023). El API Gateway no enruta /interno/.
paths:
  /api/normativa/versiones:
    get:
      tags: [Versiones]
      operationId: listarVersiones
      summary: Lista las versiones de normativa por número.
      x-mdd-permiso: PARAMETROS:LECTURA
      responses:
        '200':
          description: Las versiones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VersionResumen'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Versiones]
      operationId: crearVersion
      summary: Crea una versión nueva copiando otra, con el siguiente número.
      description: >-
        Copia la tabla de carga horaria, las reglas y el tipo de IST de la versión copiarDe. La
        versión nueva no rige ningún periodo, así que se puede editar.
      x-mdd-permiso: PARAMETROS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionNueva'
      responses:
        '201':
          description: La versión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNormativa'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/normativa/versiones/{numero}:
    parameters:
      - name: numero
        in: path
        required: true
        description: Número de la versión de normativa.
        schema:
          type: integer
          minimum: 1
        example: 1
    get:
      tags: [Versiones]
      operationId: consultarVersion
      summary: Devuelve una versión de normativa con sus reglas y su tabla de carga horaria.
      x-mdd-permiso: PARAMETROS:LECTURA
      responses:
        '200':
          description: La versión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNormativa'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Versiones]
      operationId: editarVersion
      summary: Edita una versión que no rige ningún periodo.
      description: >-
        Recibe la versión completa: la cabecera, todas las filas de la tabla con sus horas y todas
        las reglas con sus parámetros. Las filas, las reglas y los parámetros tienen que ser
        exactamente los de la versión; solo cambian sus valores (FR-002) y la severidad de las
        reglas del motor (F04-H03). Es la única forma de cambiar una versión: la pantalla y la carga
        7 por archivo la usan igual (FR-010); la carga 7 omite las severidades.
      x-mdd-permiso: PARAMETROS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionEditada'
      responses:
        '200':
          description: La versión editada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionNormativa'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /interno/normativa/periodos/{periodo}/proporcion:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          $ref: '#/components/schemas/CodigoDePeriodo'
        example: 2025-1
    get:
      tags: [Interno]
      operationId: consultarProporcionDelPeriodo
      summary: Devuelve la meta de la proporción de la versión que rige el periodo.
      description: >-
        Solo entre procesos, con el token de proceso: lo usa Generación para mostrar los totales del
        docente junto a la meta de RN-05 (RF-27, ADR-023). Un periodo sin versión responde 404.
      responses:
        '200':
          description: La versión y los dos porcentajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProporcionDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
  /interno/normativa/periodos/{periodo}/pesos-de-afinidad:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          $ref: '#/components/schemas/CodigoDePeriodo'
        example: 2025-1
    get:
      tags: [Interno]
      operationId: consultarPesosDelPeriodo
      summary: Devuelve los pesos y el mínimo de afinidad de la versión que rige el periodo.
      description: >-
        Solo entre procesos, con el token de proceso: lo usa Generación para calcular la afinidad
        (ADR-010, ADR-023). Un periodo sin versión responde 404.
      responses:
        '200':
          description: La versión, sus pesos y su mínimo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PesosDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
  /interno/normativa/periodos/{periodo}/actividades:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          $ref: '#/components/schemas/CodigoDePeriodo'
        example: 2025-1
    get:
      tags: [Interno]
      operationId: consultarActividadesDelPeriodo
      summary: Devuelve el catálogo de actividades de la versión que rige el periodo.
      description: >-
        Solo entre procesos, con el token de proceso: lo usa Generación para asignar actividades no
        lectivas (RF-21, RN-22, ADR-023, D-79). Un periodo sin versión responde 404.
      responses:
        '200':
          description: La versión y sus actividades, en el orden de la norma.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadesDelPeriodo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
  /api/normativa/periodos/{periodo}:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2025-1
    get:
      tags: [Periodos]
      operationId: consultarPeriodo
      summary: Devuelve la versión de normativa que rige el periodo.
      x-mdd-permiso: PARAMETROS:LECTURA
      responses:
        '200':
          description: La asignación normativa del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoNormativo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Periodos]
      operationId: asociarPeriodo
      summary: Asocia una versión de normativa al periodo.
      description: >-
        Desde entonces la versión no cambia. Asociar otra vez la misma versión no cambia nada; un
        periodo que ya tiene otra versión responde 409 NORMATIVA_PERIODO_CON_VERSION. La SPA abre el
        periodo desde Académico (abrirPeriodo, D-69); esta operación no comprueba que el periodo
        exista.
      x-mdd-permiso: PARAMETROS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionDelPeriodo'
      responses:
        '200':
          description: La asignación normativa del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeriodoNormativo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrada'
        '409':
          $ref: '#/components/responses/Conflicto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  responses:
    NoEncontrada:
      description: La versión o el periodo no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    Conflicto:
      description: >-
        El cambio no cumple una regla de la normativa: NORMATIVA_VERSION_EN_USO,
        NORMATIVA_CODIGO_REPETIDO o NORMATIVA_PERIODO_CON_VERSION (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    TipoIst:
      type: string
      description: Tipo de instituto según sus matriculados (RN-06).
      enum: [T1, T2, T3, T4, T5]
    Severidad:
      type: string
      description: Dura (impide guardar o avanzar) o blanda (exige justificación).
      enum: [DURA, BLANDA]
    VersionResumen:
      type: object
      required: [numero, codigo, origen, vigenteDesde, tipoIst, periodos]
      properties:
        numero:
          type: integer
          minimum: 1
          example: 1
        codigo:
          type: string
          example: SENESCYT-2024-03
        origen:
          type: string
          example: Política SENESCYT 2024
        vigenteDesde:
          type: string
          format: date
          example: '2024-03-11'
        tipoIst:
          $ref: '#/components/schemas/TipoIst'
        copiadaDe:
          type: integer
          minimum: 1
          description: La versión de la que se copió; se omite en la versión 1.
        periodos:
          $ref: '#/components/schemas/Periodos'
    VersionNormativa:
      type: object
      required: [numero, codigo, origen, vigenteDesde, tipoIst, periodos, reglas, tablaCargaHoraria]
      properties:
        numero:
          type: integer
          minimum: 1
        codigo:
          type: string
        origen:
          type: string
        vigenteDesde:
          type: string
          format: date
        tipoIst:
          $ref: '#/components/schemas/TipoIst'
        copiadaDe:
          type: integer
          minimum: 1
          description: La versión de la que se copió; se omite en la versión 1.
        periodos:
          $ref: '#/components/schemas/Periodos'
        reglas:
          type: array
          description: Ordenadas por identificador.
          items:
            $ref: '#/components/schemas/Regla'
        tablaCargaHoraria:
          type: array
          description: Las filas en el orden de la política.
          items:
            $ref: '#/components/schemas/FilaCargaHoraria'
    Regla:
      type: object
      required: [identificador, parametros]
      properties:
        identificador:
          type: string
          pattern: '^R[NF]-[0-9]{2}$'
          example: RN-02
        severidad:
          $ref: '#/components/schemas/Severidad'
        parametros:
          type: array
          description: Vacío en una regla del motor que solo tiene severidad.
          items:
            $ref: '#/components/schemas/Parametro'
    Parametro:
      type: object
      required: [nombre, valor]
      properties:
        nombre:
          type: string
          example: horas_maximas_docente
        valor:
          type: number
          example: 40
    FilaCargaHoraria:
      type: object
      required:
        - aplicaA
        - perfil
        - dedicacionTotal
        - horasClase
        - horasClaseMinimo
        - horasClaseMaximo
        - severidad
        - referencia
      properties:
        aplicaA:
          type: string
          description: El tipo de IST al que aplica la fila, o TODOS.
          enum: [TODOS, T1, T2, T3, T4, T5]
        perfil:
          type: string
          example: DOCENTE_TC
        dedicacionTotal:
          type: integer
          minimum: 0
        horasClase:
          type: integer
          minimum: 0
        horasClaseMinimo:
          type: integer
          minimum: 0
        horasClaseMaximo:
          type: integer
          minimum: 0
        horasOtrasDocencia:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
        horasGestion:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
        horasInvestigacionVinculacionMaximo:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
        severidad:
          $ref: '#/components/schemas/Severidad'
        referencia:
          type: string
          example: POL 6; RCE arts. 146 y 149
        observacion:
          type: string
    Periodos:
      type: array
      description: Los periodos que rige la versión, por código; vacía si no rige ninguno.
      items:
        $ref: '#/components/schemas/CodigoDePeriodo'
    CodigoDePeriodo:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,20}$'
      example: 2025-1
    VersionNueva:
      type: object
      required: [copiarDe, codigo, origen, vigenteDesde]
      properties:
        copiarDe:
          type: integer
          minimum: 1
          description: El número de la versión que se copia.
          example: 1
        codigo:
          type: string
          minLength: 1
          maxLength: 40
          example: SENESCYT-2025-01
        origen:
          type: string
          minLength: 1
          maxLength: 120
          example: Reforma de la política 2025
        vigenteDesde:
          type: string
          format: date
          example: '2025-01-15'
    VersionEditada:
      type: object
      required: [codigo, origen, vigenteDesde, reglas, tablaCargaHoraria]
      properties:
        codigo:
          type: string
          minLength: 1
          maxLength: 40
          example: SENESCYT-2025-01
        origen:
          type: string
          minLength: 1
          maxLength: 120
          example: Reforma de la política 2025
        vigenteDesde:
          type: string
          format: date
          example: '2025-01-15'
        reglas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ReglaEditada'
        tablaCargaHoraria:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/FilaEditada'
    ReglaEditada:
      type: object
      description: >-
        Una regla con sus parámetros y, opcional, su severidad. Sin severidad, la de la regla no
        cambia. La severidad solo vale en las reglas del motor; en RN-01, RN-06 y RN-24, que solo
        dan parámetros, responde 400 (MD-08).
      required: [identificador, parametros]
      properties:
        identificador:
          type: string
          pattern: '^R[NF]-[0-9]{2}$'
        severidad:
          $ref: '#/components/schemas/Severidad'
        parametros:
          type: array
          items:
            $ref: '#/components/schemas/Parametro'
    FilaEditada:
      type: object
      description: >-
        Una fila de la tabla, identificada por aplicaA y perfil. La severidad, la referencia y la
        observación no se editan (FR-002).
      required:
        - aplicaA
        - perfil
        - dedicacionTotal
        - horasClase
        - horasClaseMinimo
        - horasClaseMaximo
      properties:
        aplicaA:
          type: string
          enum: [TODOS, T1, T2, T3, T4, T5]
        perfil:
          type: string
        dedicacionTotal:
          type: integer
          minimum: 0
        horasClase:
          type: integer
          minimum: 0
        horasClaseMinimo:
          type: integer
          minimum: 0
        horasClaseMaximo:
          type: integer
          minimum: 0
        horasOtrasDocencia:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
        horasGestion:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
        horasInvestigacionVinculacionMaximo:
          type: integer
          minimum: 0
          description: Se omite si la política no lo da.
    VersionDelPeriodo:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
          example: 1
    ProporcionDelPeriodo:
      type: object
      required: [periodo, version, clase, otrasDocencia]
      properties:
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        version:
          type: integer
          minimum: 1
        clase:
          description: El porcentaje de horas de clase (RN-05).
          type: number
        otrasDocencia:
          description: El porcentaje de otras actividades de docencia (RN-05).
          type: number
    PesosDelPeriodo:
      type: object
      required: [periodo, version, pesos, minimoAfinidad]
      properties:
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        version:
          type: integer
          minimum: 1
        pesos:
          $ref: '#/components/schemas/PesosDeAfinidad'
        minimoAfinidad:
          description: El puntaje desde el cual se sugiere un docente (RN-19).
          type: number
    ActividadesDelPeriodo:
      type: object
      required: [periodo, version, actividades]
      properties:
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        version:
          type: integer
          minimum: 1
        actividades:
          type: array
          items:
            $ref: '#/components/schemas/ActividadDelCatalogo'
    ActividadDelCatalogo:
      description: Una actividad de los arts. 140 a 143 del RCE y lo que exige (RN-22, RN-25, D-79).
      type: object
      required: [codigo, nombre, componente, tiposDeProyecto, cargos]
      properties:
        codigo:
          description: Artículo y literal.
          type: string
          pattern: '^14[0-3]-[a-p]$'
        nombre:
          description: El texto del literal.
          type: string
        componente:
          type: string
          enum: [OTRAS_DOCENCIA, INVESTIGACION, VINCULACION, GESTION]
        tiposDeProyecto:
          description: Los tipos de proyecto que sirven; vacía si no exige un proyecto.
          type: array
          items:
            type: string
        cargos:
          description: Los cargos que sirven; vacía si no exige un cargo.
          type: array
          items:
            type: string
    PesosDeAfinidad:
      description: Los puntos que suma cada título, experiencia o curso relacionado (RN-24).
      type: object
      required:
        - cuartoNivelCampoEspecifico
        - cuartoNivelCampoAmplio
        - tercerNivelCampoEspecifico
        - tercerNivelCampoAmplio
        - experienciaRelacionada
        - cursoRelacionado
        - topeCursos
      properties:
        cuartoNivelCampoEspecifico:
          type: number
          minimum: 0
        cuartoNivelCampoAmplio:
          type: number
          minimum: 0
        tercerNivelCampoEspecifico:
          type: number
          minimum: 0
        tercerNivelCampoAmplio:
          type: number
          minimum: 0
        experienciaRelacionada:
          type: number
          minimum: 0
