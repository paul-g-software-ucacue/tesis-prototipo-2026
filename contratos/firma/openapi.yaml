# Contrato de firma (servicio 10). Desde F13-H02: el documento firmable de la versión congelada, el
# PDF/A del consolidado con su hash (RF-38, RNF-POR-01, D-101). Se genera solo al entrar en firma;
# el rol de la etapa lo reintenta si falló. Desde F14-H01: las firmas pendientes del usuario y la
# descarga del archivo vigente, solo para el firmante en turno (RF-38, D-102). Desde F14-H02: la
# subida del PDF firmado con su validación básica (RF-39, D-23, D-103). Desde F14-H03: la vigencia,
# el orden y el firmante por el CN del certificado, y la cadena completa (D-104).
openapi: 3.0.3
info:
  title: MDD · firma
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: DocumentoFirmable
    description: El documento firmable de la versión congelada (F13-H02).
  - name: FirmasPendientes
    description: >-
      Los documentos que le toca firmar al usuario, su archivo vigente (F14-H01) y la subida del
      PDF firmado (F14-H02).
paths:
  /api/firma/pendientes:
    get:
      tags: [FirmasPendientes]
      operationId: listarFirmasPendientes
      summary: Los documentos firmables generados cuyo paso en turno es del usuario.
      description: >-
        En turno está el firmante esperado del primer paso sin firma, fijado al generar el
        documento: el Responsable designado, o la cuenta con la identificación del docente del
        cargo (D-102). Tener el rol del paso no basta. Sin documentos en turno, una lista vacía.
        Ordenada por periodo y versión.
      x-mdd-permiso: DISTRIBUTIVO:FIRMA
      responses:
        '200':
          description: Las firmas pendientes del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FirmaPendiente'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/firma/documentos/{documento}/archivo:
    parameters:
      - name: documento
        in: path
        required: true
        description: El identificador del documento firmable.
        schema:
          type: string
          format: uuid
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
    get:
      tags: [FirmasPendientes]
      operationId: descargarArchivoVigente
      summary: Descarga el archivo vigente del documento, solo para el firmante en turno.
      description: >-
        El archivo vigente es el resultante de la última firma o, sin firmas, el original. Firma
        recalcula su SHA-256 antes de entregarlo: nunca entrega un archivo distinto del registrado.
        A quien no es el firmante en turno, el 403 común, también si el documento no existe o no
        está generado: no dice si existe ni de quién es el turno.
      x-mdd-permiso: DISTRIBUTIVO:FIRMA
      responses:
        '200':
          description: El PDF vigente.
          headers:
            Content-Disposition:
              description: attachment; filename="distributivo-<periodo>-v<version>.pdf".
              schema:
                type: string
            ETag:
              description: El SHA-256 del archivo, entre comillas.
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          description: >-
            El archivo falta o su SHA-256 no es el registrado (FIRMA_ARCHIVO_NO_DISPONIBLE); no se
            entrega nada.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/firma/documentos/{documento}/firmas:
    parameters:
      - name: documento
        in: path
        required: true
        description: El identificador del documento firmable.
        schema:
          type: string
          format: uuid
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
    post:
      tags: [FirmasPendientes]
      operationId: subirFirma
      summary: Sube el PDF firmado del paso en turno y lo valida; solo el firmante en turno.
      description: >-
        Valida en este orden: el mismo documento (empieza con los bytes del archivo vigente), una
        sola firma nueva, su integridad sobre el ByteRange, que su certificado llega a una raíz de
        la lista de confianza (D-23, D-103), que está vigente al subir, que no es la firma de la
        persona de un paso posterior y que su CN es el nombre que el PDF imprime en el paso en
        turno (D-104). Una comprobación que depende de otra rechazada queda NO_EVALUADA. Con la
        última firma de la cadena, la cadena queda completa. Si las cuatro pasan, registra la firma del paso en turno: el PDF subido pasa a
        ser el archivo vigente, guardado por su SHA-256, y el turno pasa al siguiente paso. Si no,
        responde 422 con el código de la primera comprobación rechazada y las cuatro en los
        detalles, sin guardar el archivo. Cada subida del firmante en turno deja su resultado
        registrado y publica su cambio (RF-44). A quien no es el firmante en turno, el 403
        común, sin resultado, también si el documento no existe o no está generado.
      x-mdd-permiso: DISTRIBUTIVO:FIRMA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  description: El PDF firmado, de hasta 10 MB.
                  type: string
                  format: binary
      responses:
        '201':
          description: Las cuatro comprobaciones aprobadas; la firma quedó registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoValidacion'
        '400':
          description: >-
            El identificador mal formado, sin la parte archivo (COMUN_SOLICITUD_INVALIDA) o con un
            archivo vacío (FIRMA_ARCHIVO_VACIO).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '413':
          description: >-
            El archivo pasa de 10 MB (FIRMA_ARCHIVO_DEMASIADO_GRANDE); más de 11 MB lo corta el
            proceso (COMUN_CONTENIDO_DEMASIADO_GRANDE).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '409':
          description: >-
            El paso en turno no tiene registrado el nombre de quien lo firma: un documento generado
            antes de F14-H03 (FIRMA_PASO_SIN_NOMBRE). No se valida nada.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '422':
          description: >-
            Se rechazó, con el código de la primera comprobación rechazada:
            FIRMA_NO_ES_LA_VERSION_VIGENTE, FIRMA_SIN_UNA_FIRMA_NUEVA, FIRMA_NO_INTEGRA,
            FIRMA_SIN_CONFIANZA, FIRMA_CERTIFICADO_NO_VIGENTE, FIRMA_FUERA_DE_ORDEN o
            FIRMA_FIRMANTE_EQUIVOCADO. Los detalles llevan las siete comprobaciones en orden: campo
            es la comprobación y descripcion su resultado.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          description: >-
            El archivo vigente falta o su SHA-256 no es el registrado (FIRMA_ARCHIVO_NO_DISPONIBLE),
            o un error interno.
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
  /api/firma/periodos/{periodo}/documento:
    parameters:
      - name: periodo
        in: path
        required: true
        description: Código del periodo académico, el que usa Académico.
        schema:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        example: 2026-I
    get:
      tags: [DocumentoFirmable]
      operationId: consultarDocumentoFirmable
      summary: El estado del documento firmable de la versión congelada y lo que puede hacer el usuario.
      description: >-
        Generado (con su huella), en generación, fallido (con el motivo) o sin generar. Firma no
        conoce el flujo (MD-05): si Aprobación todavía no pidió el documento, responde SIN_GENERAR
        sin versión. Lo leen quienes leen el consolidado.
      x-mdd-permiso: [CONSOLIDACION:LECTURA, DISTRIBUTIVO:ESCRITURA]
      responses:
        '200':
          description: El estado del documento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDelDocumento'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
    post:
      tags: [DocumentoFirmable]
      operationId: generarDocumentoFirmable
      summary: Genera el documento firmable que no se pudo generar al entrar en firma.
      description: >-
        Solo el rol de la etapa CONGELADO_EN_FIRMA que Aprobación entregó con la solicitud (el
        Responsable de consolidación). Sin cuerpo. Genera en la misma petición; si el documento ya
        existe, responde el mismo sin crear otro (FR-005). Si falla, el motivo va en los detalles.
      x-mdd-permiso: CONSOLIDACION:APROBACION
      responses:
        '200':
          description: El documento generado, ahora o antes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDelDocumento'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          description: >-
            Aprobación no pidió el documento de este periodo: el distributivo no entró en firma
            (FIRMA_ETAPA_NO_ADMITE_GENERACION), o la generación falló, con el motivo en detalles
            (FIRMA_GENERACION_FALLIDA).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '502':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoConError'
        '504':
          $ref: '../comun/errores.yaml#/components/responses/ProcesoSinRespuesta'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  schemas:
    EstadoDelDocumento:
      type: object
      additionalProperties: false
      required: [periodo, estado, acciones]
      properties:
        periodo:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        version:
          description: La versión congelada; falta si Aprobación todavía no pidió el documento.
          type: integer
          format: int32
          minimum: 1
        estado:
          type: string
          enum: [SIN_GENERAR, EN_CURSO, FALLIDA, GENERADO]
        motivo:
          description: Por qué falló la última generación; solo con FALLIDA.
          type: string
          maxLength: 200
        documento:
          $ref: '#/components/schemas/DocumentoFirmable'
        acciones:
          type: array
          description: Lo que puede hacer ahora quien consulta; vacía si nada.
          items:
            type: string
            enum: [GENERAR]
    DocumentoFirmable:
      description: El PDF/A registrado; solo con GENERADO.
      type: object
      additionalProperties: false
      required: [sha256, hashContenido, generadoPor, generadoEn]
      properties:
        sha256:
          description: El SHA-256 del archivo, también su nombre; la «huella del PDF».
          type: string
          pattern: '^[0-9a-f]{64}$'
        hashContenido:
          description: El hash de contenido de la versión congelada, el del pie (D-100).
          type: string
          pattern: '^[0-9a-f]{64}$'
        generadoPor:
          description: sistema, o quien pidió el reintento.
          type: string
        generadoEn:
          type: string
          format: date-time
    FirmaPendiente:
      description: Un documento firmable cuyo paso en turno es del usuario.
      type: object
      additionalProperties: false
      required: [documento, periodo, version, orden, rotulo, generadoEn]
      properties:
        documento:
          type: string
          format: uuid
        periodo:
          type: string
          pattern: '^[A-Za-z0-9._-]{1,20}$'
        version:
          type: integer
          format: int32
          minimum: 1
        orden:
          description: El orden del paso en turno en el árbol de firmas.
          type: integer
          format: int32
          minimum: 1
        rotulo:
          description: El rótulo del paso, como en el PDF («Elaborado por»).
          type: string
          maxLength: 60
        generadoEn:
          type: string
          format: date-time
    ResultadoValidacion:
      description: >-
        El resultado de la validación básica de un PDF subido por el firmante en turno: el informe
        de validación (D-23, D-103).
      type: object
      additionalProperties: false
      required: [id, documento, orden, aceptada, sha256Subido, subidoEn, comprobaciones]
      properties:
        id:
          type: string
          format: uuid
        documento:
          type: string
          format: uuid
        orden:
          description: El orden del paso en turno al subir.
          type: integer
          format: int32
          minimum: 1
        aceptada:
          type: boolean
        sha256Subido:
          type: string
          pattern: '^[0-9a-f]{64}$'
        subidoEn:
          type: string
          format: date-time
        comprobaciones:
          description: Las siete comprobaciones, en orden.
          type: array
          minItems: 7
          maxItems: 7
          items:
            $ref: '#/components/schemas/ResultadoDeComprobacion'
        certificado:
          $ref: '#/components/schemas/CertificadoDeLaFirma'
    ResultadoDeComprobacion:
      type: object
      additionalProperties: false
      required: [comprobacion, resultado]
      properties:
        comprobacion:
          type: string
          enum: [MISMO_DOCUMENTO, UNA_FIRMA_NUEVA, INTEGRIDAD, CONFIANZA, VIGENCIA, ORDEN, FIRMANTE]
        resultado:
          type: string
          enum: [APROBADA, RECHAZADA, NO_EVALUADA]
        motivo:
          description: Por qué se rechazó o no se evaluó; un texto del sistema.
          type: string
          maxLength: 200
    CertificadoDeLaFirma:
      description: El certificado de la firma nueva; solo si hay una sola firma nueva legible.
      type: object
      additionalProperties: false
      required: [nombre, emisor, serie, validoDesde, validoHasta]
      properties:
        nombre:
          description: El CN del sujeto.
          type: string
          maxLength: 200
        emisor:
          type: string
          maxLength: 400
        serie:
          description: El número de serie, en hexadecimal.
          type: string
          pattern: '^[0-9a-f]{1,64}$'
        validoDesde:
          type: string
          format: date-time
        validoHasta:
          type: string
          format: date-time
