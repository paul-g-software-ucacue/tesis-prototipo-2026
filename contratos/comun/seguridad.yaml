# Piezas de seguridad comunes a los contratos de los servicios (ADR-014).
openapi: 3.0.3
info:
  title: MDD · Seguridad común
  version: 1.0.0
paths: {}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT RS256 que emite Usuarios en POST /api/usuarios/sesion.
  schemas:
    SesionActual:
      description: Lo que el proceso sabe del usuario que hace la petición, obtenido del token.
      type: object
      required: [usuario, roles]
      properties:
        usuario:
          type: string
          description: Nombre de usuario (claim sub del token).
          example: autor.prueba
        nombre:
          type: string
          description: >-
            Nombre para mostrar (claim nombre del token). Solo lo devuelve Usuarios; los demás
            procesos lo omiten (ADR-020).
          example: Docente y coordinador (demo)
        roles:
          type: array
          description: Roles del usuario, ordenados alfabéticamente; vacía si no tiene.
          items:
            type: string
          example: [COORDINADOR_CARRERA, DOCENTE]
        permisos:
          type: array
          description: >-
            Permisos efectivos (claim permisos del token), ordenados, en la forma
            FUNCIONALIDAD:TIPO o FUNCIONALIDAD:TIPO:PROPIO. Solo lo devuelve Usuarios; la SPA lo
            usa para decidir qué mostrar, y el servidor valida cada operación (ADR-021).
          items:
            type: string
          example: ['MI_DISTRIBUTIVO:ESCRITURA:PROPIO', 'MI_DISTRIBUTIVO:LECTURA:PROPIO']
  responses:
    NoAutenticado:
      description: >-
        Sin token o con un token inválido. El cuerpo es el mismo para todas las causas y no dice
        qué falló (código SEGURIDAD_NO_AUTENTICADO).
      headers:
        WWW-Authenticate:
          description: Siempre "Bearer", sin detalles.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: './errores.yaml#/components/schemas/Error'
    AccesoNoAutorizado:
      description: >-
        Token válido sin el permiso de la operación, un token de usuario en /interno/ o uno de
        proceso fuera de él. El cuerpo es el mismo para todas las causas y no dice qué permiso faltó
        (código SEGURIDAD_ACCESO_NO_AUTORIZADO, ADR-021).
      content:
        application/json:
          schema:
            $ref: './errores.yaml#/components/schemas/Error'
