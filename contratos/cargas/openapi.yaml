# Contrato de Cargas (servicio 3, proceso datos). En B00-H03 solo tenía la sesión actual, para probar
# la autenticación de punta a punta (D-39).
# Desde F01-H01: las plantillas de las 10 cargas de la ERS §8.3 y su diccionario de datos (RF-05),
# que salen de una sola definición versionada. Se descargan con «Cargas: lectura» o con «Distributivo
# del periodo: lectura»: una lista en x-mdd-permiso son permisos alternativos (D-70).
# Desde F01-H02: subir el CSV o XLSX de una carga y validar su estructura (RF-06, RF-07): formato,
# UTF-8, separador, una hoja, encabezados de la plantilla y número de registros. El archivo pasa
# por una fuente de datos (RF-57) y no se guarda. Exige «Cargas: escritura», que tienen Talento
# Humano, el Responsable de consolidación y el Vicerrector académico (D-71).
# Desde F01-H03: la misma subida revisa cada fila con las reglas del diccionario de datos y las
# referencias del sistema (RF-08), y responde el informe por fila; un archivo con errores en sus
# filas responde 200 con su informe, no un error (principio XIII). descargarInforme responde el
# mismo informe en CSV, con las celdas neutralizadas (RF-09, RNF-SEG-04). Nada se guarda.
openapi: 3.0.3
info:
  title: MDD · cargas
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Sesion
    description: Sesión actual.
  - name: Plantillas
    description: Las plantillas de las 10 cargas y su diccionario de datos (RF-05).
  - name: Subida
    description: >-
      Subir el archivo de una carga, validar su estructura y sus filas, y descargar el informe
      (RF-06 a RF-09).
paths:
  /api/cargas/sesion:
    get:
      tags: [Sesion]
      operationId: consultarSesion
      summary: Devuelve el usuario y los roles del token.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                $ref: '../comun/seguridad.yaml#/components/schemas/SesionActual'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas:
    get:
      tags: [Plantillas]
      operationId: listarCargas
      summary: Devuelve el diccionario de datos completo, con las 10 cargas en su orden.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          description: Las convenciones comunes y las 10 cargas, cada una con sus columnas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiccionarioDeDatos'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/plantilla:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    get:
      tags: [Plantillas]
      operationId: descargarPlantilla
      summary: Descarga la plantilla CSV de una carga, con solo su fila de encabezados.
      description: >-
        UTF-8 con BOM, separador coma y fin de línea CRLF (RFC 4180). Los encabezados son los
        campos de la carga, en el orden del diccionario.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          $ref: '#/components/responses/ArchivoCsv'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/diccionario:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    get:
      tags: [Plantillas]
      operationId: descargarDiccionario
      summary: Descarga el diccionario de datos de una carga en CSV.
      description: >-
        Una fila por columna de la plantilla, en su orden, con descripción, tipo, longitud máxima,
        obligatoriedad, formato o valores permitidos, clave, validación y un ejemplo; después, una
        fila vacía y las convenciones comunes. Mismo formato que la plantilla.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          $ref: '#/components/responses/ArchivoCsv'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/archivo:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    post:
      tags: [Subida]
      operationId: validarArchivo
      summary: Lee el CSV o XLSX de una carga, revisa sus filas y responde el informe, sin guardarlo.
      description: >-
        Valida la estructura del archivo, en este orden: hasta 5 MB; CSV o XLSX, por la extensión
        y el contenido; UTF-8 (con o sin BOM); una sola hoja; que se pueda leer; los encabezados de
        la plantilla, en su orden; al menos un registro. Los detalles de un error de estructura
        nunca traen valores del archivo. Después revisa cada fila con las reglas del diccionario de
        datos y las referencias del sistema (F01-H03) y responde 200 con el informe por fila, que
        sí trae el valor de cada problema, porque es el dato que hay que corregir. Un archivo con
        errores en sus filas no es un error HTTP (principio XIII).
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: El archivo se puede leer; el informe dice si sus filas son válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaDeArchivo'
        '400':
          $ref: '#/components/responses/ArchivoNoValido'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/archivo/informe:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    post:
      tags: [Subida]
      operationId: descargarInforme
      summary: Valida el archivo como validarArchivo y responde todo su informe en CSV, sin guardarlo.
      description: >-
        La misma validación de validarArchivo, con los mismos errores de estructura. Responde todos
        los problemas, no solo los primeros 100, en CSV UTF-8 con BOM: fila, campo, valor, motivo,
        tipo y sugerencia. Toda celda que empieza con =, +, -, @, tabulación o retorno de carro
        lleva un apóstrofo delante, para que la hoja de cálculo no la ejecute (RNF-SEG-04).
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/InformeCsv'
        '400':
          $ref: '#/components/responses/ArchivoNoValido'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  parameters:
    CodigoDeCarga:
      name: codigo
      in: path
      required: true
      description: Código de la carga, el nombre de su archivo sin el número.
      schema:
        type: string
        pattern: '^[a-z_]{1,40}$'
      example: estructura_organica
  responses:
    ArchivoCsv:
      description: El archivo CSV, para guardarlo con el nombre de Content-Disposition.
      headers:
        Content-Disposition:
          description: 'attachment; filename="01_estructura_organica.csv"'
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string
    InformeCsv:
      description: El informe por fila en CSV, para guardarlo con el nombre de Content-Disposition.
      headers:
        Content-Disposition:
          description: 'attachment; filename="informe-docentes.csv"'
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string
    ArchivoNoValido:
      description: >-
        El archivo no se puede leer: CARGAS_FORMATO_NO_ADMITIDO, CARGAS_CODIFICACION_NO_ADMITIDA,
        CARGAS_VARIAS_HOJAS, CARGAS_ARCHIVO_ILEGIBLE (con la fila en el detalle),
        CARGAS_ENCABEZADOS_DISTINTOS (un detalle por columna) o CARGAS_ARCHIVO_SIN_REGISTROS; o
        COMUN_SOLICITUD_INVALIDA sin la parte archivo (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ArchivoDemasiadoGrande:
      description: >-
        CARGAS_ARCHIVO_DEMASIADO_GRANDE, con más de 5 MB, o COMUN_CONTENIDO_DEMASIADO_GRANDE, con
        más de 10 MB, que corta el proceso (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    CargaNoEncontrada:
      description: No hay una carga con ese código (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    Obligatoriedad:
      description: >-
        Si la carga es obligatoria para crear el distributivo: las 8 primeras; la 9, salvo que se
        confirme «sin proyectos» (RF-18); la 10 es recomendada (ERS §8.3).
      type: string
      enum: [OBLIGATORIA, OBLIGATORIA_SALVO_SIN_PROYECTOS, RECOMENDADA]
    ValorDeCatalogo:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo:
          type: string
          example: G07
        descripcion:
          type: string
          example: Gestor de Investigación, Desarrollo Tecnológico e Innovación
    ColumnaDeCarga:
      description: Una columna de la plantilla, tal como la describe el diccionario de datos.
      type: object
      required: [campo, descripcion, tipo, obligatorio, ejemplo]
      properties:
        campo:
          type: string
          pattern: '^[a-z0-9_]+$'
          example: codigo_gestion_autorizada
        descripcion:
          type: string
        tipo:
          type: string
          example: Catálogo
        longitud:
          description: Longitud máxima, si la tiene.
          type: integer
          minimum: 1
        obligatorio:
          description: Sí, No o la condición, como «Sí si tipo_unidad = GESTION».
          type: string
        formato:
          type: string
        clave:
          type: string
        validacion:
          type: string
        ejemplo:
          type: string
        valores:
          description: Los valores permitidos, si la columna toma los de un catálogo.
          type: array
          items:
            $ref: '#/components/schemas/ValorDeCatalogo'
    Carga:
      description: Una de las 10 cargas de la ERS §8.3.
      type: object
      required: [numero, codigo, nombre, archivo, dependeDe, obligatoriedad, columnas]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
        codigo:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: estructura_organica
        nombre:
          type: string
          example: Estructura orgánica
        archivo:
          type: string
          example: 01_estructura_organica.csv
        dependeDe:
          description: Los números de las cargas de las que depende.
          type: array
          items:
            type: integer
        obligatoriedad:
          $ref: '#/components/schemas/Obligatoriedad'
        columnas:
          type: array
          items:
            $ref: '#/components/schemas/ColumnaDeCarga'
    Convencion:
      description: Una regla común a todas las cargas, como el separador o el formato de las fechas.
      type: object
      required: [tema, regla]
      properties:
        tema:
          type: string
        regla:
          type: string
    DiccionarioDeDatos:
      type: object
      required: [convenciones, cargas]
      properties:
        convenciones:
          type: array
          items:
            $ref: '#/components/schemas/Convencion'
        cargas:
          type: array
          items:
            $ref: '#/components/schemas/Carga'
    FormatoDeArchivo:
      type: string
      enum: [CSV, XLSX]
    LecturaDeArchivo:
      description: >-
        El resultado de leer un archivo con una estructura válida, con el informe de sus filas.
      type: object
      required: [carga, archivo, formato, registros, valido, errores, advertencias, problemas]
      properties:
        carga:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: docentes
        archivo:
          description: El nombre del archivo, sin ruta.
          type: string
          maxLength: 255
          example: 06_docentes.csv
        formato:
          $ref: '#/components/schemas/FormatoDeArchivo'
        registros:
          description: Las filas de datos, sin el encabezado ni las filas vacías.
          type: integer
          minimum: 1
          example: 47
        valido:
          description: Si sus filas no tienen ningún error; las advertencias no lo impiden.
          type: boolean
        errores:
          description: Cuántos errores tiene, en total.
          type: integer
          minimum: 0
        advertencias:
          description: Cuántas advertencias tiene, en total.
          type: integer
          minimum: 0
        problemas:
          description: >-
            Los primeros 100 problemas, en orden de fila y de columna. descargarInforme los trae
            todos.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProblemaDeFila'
    TipoDeProblema:
      description: Un error impide continuar; una advertencia no.
      type: string
      enum: [ERROR, ADVERTENCIA]
    ProblemaDeFila:
      description: >-
        Un problema de una fila del archivo (glosario «Informe de validación de la carga»). El motivo
        dice qué hacer y no repite el valor.
      type: object
      required: [fila, campo, valor, motivo, tipo]
      properties:
        fila:
          description: La fila del archivo, contando el encabezado como la 1.
          type: integer
          minimum: 2
          example: 14
        campo:
          description: El encabezado de la columna.
          type: string
          example: numero_identificacion
        valor:
          description: El valor recibido, sin los espacios de los extremos; vacío si no tiene.
          type: string
          example: '109990010'
        motivo:
          type: string
          example: 'Cédula inválida o sin cero inicial: le falta el 0 inicial.'
        tipo:
          $ref: '#/components/schemas/TipoDeProblema'
        sugerencia:
          description: El valor corregido, si la regla lo puede proponer.
          type: string
          example: '0109990010'
