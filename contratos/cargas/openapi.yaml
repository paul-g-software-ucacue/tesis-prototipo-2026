# Contrato de Cargas (servicio 3, proceso datos). En B00-H03 solo tenía la sesión actual, para probar
# la autenticación de punta a punta (D-39).
# Desde F01-H01: las plantillas de las 10 cargas de la ERS §8.3 y su diccionario de datos (RF-05),
# que salen de una sola definición versionada. Se descargan con «Cargas: lectura» o con «Distributivo
# del periodo: lectura»: una lista en x-mdd-permiso son permisos alternativos (D-70).
# Desde F01-H02: subir el CSV o XLSX de una carga y validar su estructura (RF-06, RF-07): formato,
# UTF-8, separador, una hoja, encabezados de la plantilla y número de registros. El archivo pasa
# por una fuente de datos (RF-57) y no se guarda. Exige «Cargas: escritura», que tienen Talento
# Humano, el Responsable de consolidación y el Vicerrector académico (D-71).
# Desde F01-H03: la misma subida revisa cada fila con las reglas del diccionario de datos y las
# referencias del sistema (RF-08), y responde el informe por fila; un archivo con errores en sus
# filas responde 200 con su informe, no un error (principio XIII). descargarInforme responde el
# mismo informe en CSV, con las celdas neutralizadas (RF-09, RNF-SEG-04). Nada se guarda.
# Desde F01-H04: la subida trae la vista previa (nuevos, cambian, bajas e iguales frente al servicio
# dueño, con su huella); confirmarCarga vuelve a enviar el archivo con la huella y el dueño lo aplica
# completo o nada (RF-10, RF-55, MD-13, ADR-022); listarHistorial lee cada intento de confirmar. Las
# bajas se informan, pero no se aplican.
# Desde F01-H05: las cargas respetan su orden (RF-56, ERS §8.3): validar y confirmar una carga con
# cargas anteriores sin datos responde 409 CARGAS_CARGAS_ANTERIORES_PENDIENTES antes de leer el
# archivo. consultarEstadoDeLasCargas dice si cada carga está pendiente o cargada, según lo que tiene
# su servicio dueño; confirmarSinProyectos declara que un periodo no tiene proyectos aprobados (RF-18)
# y queda en el historial de la carga de proyectos.
# Desde F02-H02: consultarPreparacionDelPeriodo es el tablero de preparación de un periodo (RF-56):
# el estado de cada carga en ese periodo, también «con errores», lo que falta para crear el
# distributivo y si está listo, con la lista de periodos para elegir.
openapi: 3.0.3
info:
  title: MDD · cargas
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Sesion
    description: Sesión actual.
  - name: Plantillas
    description: Las plantillas de las 10 cargas y su diccionario de datos (RF-05).
  - name: Subida
    description: >-
      Subir el archivo de una carga, validar su estructura y sus filas, ver la vista previa,
      descargar el informe y confirmar (RF-06 a RF-10, RF-55).
  - name: Historial
    description: El historial de las cargas confirmadas (RF-10).
  - name: Estado
    description: El estado de cada carga y la confirmación «sin proyectos» (RF-56, RF-18).
  - name: Preparacion
    description: El tablero de preparación del periodo (RF-56, glosario «Tablero de preparación»).
paths:
  /api/cargas/sesion:
    get:
      tags: [Sesion]
      operationId: consultarSesion
      summary: Devuelve el usuario y los roles del token.
      responses:
        '200':
          description: Token válido.
          content:
            application/json:
              schema:
                $ref: '../comun/seguridad.yaml#/components/schemas/SesionActual'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas:
    get:
      tags: [Plantillas]
      operationId: listarCargas
      summary: Devuelve el diccionario de datos completo, con las 10 cargas en su orden.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          description: Las convenciones comunes y las 10 cargas, cada una con sus columnas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiccionarioDeDatos'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/plantilla:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    get:
      tags: [Plantillas]
      operationId: descargarPlantilla
      summary: Descarga la plantilla CSV de una carga, con solo su fila de encabezados.
      description: >-
        UTF-8 con BOM, separador coma y fin de línea CRLF (RFC 4180). Los encabezados son los
        campos de la carga, en el orden del diccionario.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          $ref: '#/components/responses/ArchivoCsv'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/diccionario:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    get:
      tags: [Plantillas]
      operationId: descargarDiccionario
      summary: Descarga el diccionario de datos de una carga en CSV.
      description: >-
        Una fila por columna de la plantilla, en su orden, con descripción, tipo, longitud máxima,
        obligatoriedad, formato o valores permitidos, clave, validación y un ejemplo; después, una
        fila vacía y las convenciones comunes. Mismo formato que la plantilla.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          $ref: '#/components/responses/ArchivoCsv'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/archivo:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    post:
      tags: [Subida]
      operationId: validarArchivo
      summary: Lee el CSV o XLSX de una carga, revisa sus filas y responde el informe, sin guardarlo.
      description: >-
        Valida la estructura del archivo, en este orden: hasta 5 MB; CSV o XLSX, por la extensión
        y el contenido; UTF-8 (con o sin BOM); una sola hoja; que se pueda leer; los encabezados de
        la plantilla, en su orden; al menos un registro. Los detalles de un error de estructura
        nunca traen valores del archivo. Después revisa cada fila con las reglas del diccionario de
        datos y las referencias del sistema (F01-H03) y responde 200 con el informe por fila, que
        sí trae el valor de cada problema, porque es el dato que hay que corregir. Un archivo con
        errores en sus filas no es un error HTTP (principio XIII). Antes de leer el archivo, si
        alguna carga de la que depende no tiene datos, responde 409
        CARGAS_CARGAS_ANTERIORES_PENDIENTES (F01-H05).
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          description: El archivo se puede leer; el informe dice si sus filas son válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaDeArchivo'
        '400':
          $ref: '#/components/responses/ArchivoNoValido'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '409':
          $ref: '#/components/responses/CargasAnterioresPendientes'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/archivo/informe:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    post:
      tags: [Subida]
      operationId: descargarInforme
      summary: Valida el archivo como validarArchivo y responde todo su informe en CSV, sin guardarlo.
      description: >-
        La misma validación de validarArchivo, con los mismos errores de estructura. Responde todos
        los problemas, no solo los primeros 100, en CSV UTF-8 con BOM: fila, campo, valor, motivo,
        tipo y sugerencia. Toda celda que empieza con =, +, -, @, tabulación o retorno de carro
        lleva un apóstrofo delante, para que la hoja de cálculo no la ejecute (RNF-SEG-04).
        Como validarArchivo, responde 409 CARGAS_CARGAS_ANTERIORES_PENDIENTES si alguna carga de
        la que depende no tiene datos.
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo]
              properties:
                archivo:
                  type: string
                  format: binary
      responses:
        '200':
          $ref: '#/components/responses/InformeCsv'
        '400':
          $ref: '#/components/responses/ArchivoNoValido'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '409':
          $ref: '#/components/responses/CargasAnterioresPendientes'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/archivo/confirmacion:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    post:
      tags: [Subida]
      operationId: confirmarCarga
      summary: Valida otra vez el archivo y pide a su servicio dueño que aplique la vista previa revisada.
      description: >-
        La misma validación de validarArchivo. Con errores en las filas, 409
        CARGAS_CARGA_CON_ERRORES. Si el mismo archivo (el mismo hash SHA-256) ya se aplicó en esta
        carga, responde REPETIDA sin aplicarlo otra vez. Si no, el servicio dueño recalcula la vista
        previa con sus tablas bloqueadas y la aplica completa solo si su huella es la recibida; si no
        lo es, 409 CARGAS_VISTA_PREVIA_DESACTUALIZADA. Una regla del dueño que falla da 409
        CARGAS_CARGA_RECHAZADA con la fila y nada se aplica. Las bajas no se aplican. Cada intento
        queda en el historial, sin el contenido del archivo. Como validarArchivo, si alguna carga de
        la que depende no tiene datos, responde 409 CARGAS_CARGAS_ANTERIORES_PENDIENTES antes de
        leer el archivo, sin entrada en el historial.
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, huella]
              properties:
                archivo:
                  type: string
                  format: binary
                huella:
                  $ref: '#/components/schemas/Huella'
      responses:
        '200':
          description: La carga quedó aplicada, o ya lo estaba.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDeConfirmacion'
        '400':
          $ref: '#/components/responses/ArchivoNoValido'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '409':
          $ref: '#/components/responses/ConfirmacionRechazada'
        '413':
          $ref: '#/components/responses/ArchivoDemasiadoGrande'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/plantillas/{codigo}/historial:
    parameters:
      - $ref: '#/components/parameters/CodigoDeCarga'
    get:
      tags: [Historial]
      operationId: listarHistorial
      summary: Cada intento de confirmar la carga, del más reciente al más antiguo.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          description: El historial de la carga.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EntradaDeHistorial'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargaNoEncontrada'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/estado:
    get:
      tags: [Estado]
      operationId: consultarEstadoDeLasCargas
      summary: El estado de las 10 cargas, en su orden, y las cargas anteriores que le faltan a cada una.
      description: >-
        Una carga está CARGADA si su servicio dueño tiene al menos un registro vigente de ella,
        entrado por archivo o por pantalla. La de proyectos está SIN_PROYECTOS si no tiene datos y
        algún periodo está confirmado «sin proyectos» y sigue sin proyectos asignables. Si no,
        PENDIENTE. Se calcula en cada consulta; no muestra datos, solo si los hay.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      responses:
        '200':
          description: Las 10 cargas con su estado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoDeLasCargas'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/preparacion:
    get:
      tags: [Preparacion]
      operationId: consultarPreparacionDelPeriodo
      summary: El tablero de preparación de un periodo, con la lista de periodos para elegir.
      description: >-
        El estado de cada carga en el periodo: la oferta y los matriculados cuentan solo con datos de
        ese periodo; los proyectos, si alguno es asignable en él o está confirmado «sin proyectos»;
        las demás, como en consultarEstadoDeLasCargas. Una carga sin datos cuyo último intento de
        confirmar fue rechazado está CON_ERRORES. Lo que falta son las cargas obligatorias que no
        están cargadas y, si es el caso, el periodo sin abrir (sin su versión de normativa) o
        cerrado. Sin el parámetro, usa el periodo que empieza más tarde. Se calcula en cada
        consulta; no muestra datos, solo si los hay.
      x-mdd-permiso: [CARGAS:LECTURA, DISTRIBUTIVO:LECTURA]
      parameters:
        - name: periodo
          in: query
          required: false
          description: El periodo del tablero; si no va, el que empieza más tarde.
          schema:
            $ref: '#/components/schemas/CodigoDePeriodo'
      responses:
        '200':
          description: El tablero del periodo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreparacionDelPeriodo'
        '400':
          description: >-
            COMUN_SOLICITUD_INVALIDA si el periodo no cumple su formato, o
            CARGAS_PERIODO_NO_ENCONTRADO si no está en los ciclos académicos (errores.md).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/cargas/sin-proyectos:
    post:
      tags: [Estado]
      operationId: confirmarSinProyectos
      summary: Confirma que un periodo no tiene proyectos aprobados, para que la carga de proyectos cuente como cargada en él.
      description: >-
        El periodo tiene que estar en los ciclos académicos y no tener proyectos asignables (aprobados
        o en ejecución con una vigencia que se cruza con sus fechas, F03-H05). Queda en el historial
        de la carga de proyectos con el usuario y el momento. Si el periodo ya estaba confirmado,
        responde 200 con la confirmación que había, sin duplicarla.
      x-mdd-permiso: CARGAS:ESCRITURA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionSinProyectos'
      responses:
        '200':
          description: El periodo ya estaba confirmado «sin proyectos».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaDeHistorial'
        '201':
          description: La confirmación nueva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntradaDeHistorial'
        '400':
          description: >-
            COMUN_SOLICITUD_INVALIDA si el periodo falta o no cumple su formato, o
            CARGAS_PERIODO_NO_ENCONTRADO si no está en los ciclos académicos (errores.md).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          description: CARGAS_PERIODO_CON_PROYECTOS, si el periodo tiene proyectos asignables (errores.md).
          content:
            application/json:
              schema:
                $ref: '../comun/errores.yaml#/components/schemas/Error'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  parameters:
    CodigoDeCarga:
      name: codigo
      in: path
      required: true
      description: Código de la carga, el nombre de su archivo sin el número.
      schema:
        type: string
        pattern: '^[a-z_]{1,40}$'
      example: estructura_organica
  responses:
    ArchivoCsv:
      description: El archivo CSV, para guardarlo con el nombre de Content-Disposition.
      headers:
        Content-Disposition:
          description: 'attachment; filename="01_estructura_organica.csv"'
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string
    InformeCsv:
      description: El informe por fila en CSV, para guardarlo con el nombre de Content-Disposition.
      headers:
        Content-Disposition:
          description: 'attachment; filename="informe-docentes.csv"'
          schema:
            type: string
      content:
        text/csv:
          schema:
            type: string
    ArchivoNoValido:
      description: >-
        El archivo no se puede leer: CARGAS_FORMATO_NO_ADMITIDO, CARGAS_CODIFICACION_NO_ADMITIDA,
        CARGAS_VARIAS_HOJAS, CARGAS_ARCHIVO_ILEGIBLE (con la fila en el detalle),
        CARGAS_ENCABEZADOS_DISTINTOS (un detalle por columna) o CARGAS_ARCHIVO_SIN_REGISTROS; o
        COMUN_SOLICITUD_INVALIDA sin la parte archivo (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ArchivoDemasiadoGrande:
      description: >-
        CARGAS_ARCHIVO_DEMASIADO_GRANDE, con más de 5 MB, o COMUN_CONTENIDO_DEMASIADO_GRANDE, con
        más de 10 MB, que corta el proceso (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConfirmacionRechazada:
      description: >-
        No se aplicó nada: CARGAS_CARGAS_ANTERIORES_PENDIENTES (un detalle por carga que falta),
        CARGAS_CARGA_CON_ERRORES, CARGAS_VISTA_PREVIA_DESACTUALIZADA o CARGAS_CARGA_RECHAZADA (con un
        detalle «fila N · campo» por rechazo) (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    CargasAnterioresPendientes:
      description: >-
        CARGAS_CARGAS_ANTERIORES_PENDIENTES: alguna carga de la que depende no tiene datos; un
        detalle por carga que falta, con su código en campo y su número y nombre en motivo
        (errores.md). El archivo no se lee.
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    CargaNoEncontrada:
      description: No hay una carga con ese código (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    Obligatoriedad:
      description: >-
        Si la carga es obligatoria para crear el distributivo: las 8 primeras; la 9, salvo que se
        confirme «sin proyectos» (RF-18); la 10 es recomendada (ERS §8.3).
      type: string
      enum: [OBLIGATORIA, OBLIGATORIA_SALVO_SIN_PROYECTOS, RECOMENDADA]
    ValorDeCatalogo:
      type: object
      required: [codigo, descripcion]
      properties:
        codigo:
          type: string
          example: G07
        descripcion:
          type: string
          example: Gestor de Investigación, Desarrollo Tecnológico e Innovación
    ColumnaDeCarga:
      description: Una columna de la plantilla, tal como la describe el diccionario de datos.
      type: object
      required: [campo, descripcion, tipo, obligatorio, ejemplo]
      properties:
        campo:
          type: string
          pattern: '^[a-z0-9_]+$'
          example: codigo_gestion_autorizada
        descripcion:
          type: string
        tipo:
          type: string
          example: Catálogo
        longitud:
          description: Longitud máxima, si la tiene.
          type: integer
          minimum: 1
        obligatorio:
          description: Sí, No o la condición, como «Sí si tipo_unidad = GESTION».
          type: string
        formato:
          type: string
        clave:
          type: string
        validacion:
          type: string
        ejemplo:
          type: string
        valores:
          description: Los valores permitidos, si la columna toma los de un catálogo.
          type: array
          items:
            $ref: '#/components/schemas/ValorDeCatalogo'
    Carga:
      description: Una de las 10 cargas de la ERS §8.3.
      type: object
      required: [numero, codigo, nombre, archivo, dependeDe, obligatoriedad, columnas]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
        codigo:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: estructura_organica
        nombre:
          type: string
          example: Estructura orgánica
        archivo:
          type: string
          example: 01_estructura_organica.csv
        dependeDe:
          description: Los números de las cargas de las que depende.
          type: array
          items:
            type: integer
        obligatoriedad:
          $ref: '#/components/schemas/Obligatoriedad'
        columnas:
          type: array
          items:
            $ref: '#/components/schemas/ColumnaDeCarga'
    Convencion:
      description: Una regla común a todas las cargas, como el separador o el formato de las fechas.
      type: object
      required: [tema, regla]
      properties:
        tema:
          type: string
        regla:
          type: string
    DiccionarioDeDatos:
      type: object
      required: [convenciones, cargas]
      properties:
        convenciones:
          type: array
          items:
            $ref: '#/components/schemas/Convencion'
        cargas:
          type: array
          items:
            $ref: '#/components/schemas/Carga'
    FormatoDeArchivo:
      type: string
      enum: [CSV, XLSX]
    LecturaDeArchivo:
      description: >-
        El resultado de leer un archivo con una estructura válida, con el informe de sus filas.
      type: object
      required:
        [carga, archivo, formato, registros, valido, errores, advertencias, problemas, vistaPrevia]
      properties:
        carga:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: docentes
        archivo:
          description: El nombre del archivo, sin ruta.
          type: string
          maxLength: 255
          example: 06_docentes.csv
        formato:
          $ref: '#/components/schemas/FormatoDeArchivo'
        registros:
          description: Las filas de datos, sin el encabezado ni las filas vacías.
          type: integer
          minimum: 1
          example: 47
        valido:
          description: Si sus filas no tienen ningún error; las advertencias no lo impiden.
          type: boolean
        errores:
          description: Cuántos errores tiene, en total.
          type: integer
          minimum: 0
        advertencias:
          description: Cuántas advertencias tiene, en total.
          type: integer
          minimum: 0
        problemas:
          description: >-
            Los primeros 100 problemas, en orden de fila y de columna. descargarInforme los trae
            todos.
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ProblemaDeFila'
        vistaPrevia:
          $ref: '#/components/schemas/VistaPrevia'
    TipoDeProblema:
      description: Un error impide continuar; una advertencia no.
      type: string
      enum: [ERROR, ADVERTENCIA]
    ProblemaDeFila:
      description: >-
        Un problema de una fila del archivo (glosario «Informe de validación de la carga»). El motivo
        dice qué hacer y no repite el valor.
      type: object
      required: [fila, campo, valor, motivo, tipo]
      properties:
        fila:
          description: La fila del archivo, contando el encabezado como la 1.
          type: integer
          minimum: 2
          example: 14
        campo:
          description: El encabezado de la columna.
          type: string
          example: numero_identificacion
        valor:
          description: El valor recibido, sin los espacios de los extremos; vacío si no tiene.
          type: string
          example: '109990010'
        motivo:
          type: string
          example: 'Cédula inválida o sin cero inicial: le falta el 0 inicial.'
        tipo:
          $ref: '#/components/schemas/TipoDeProblema'
        sugerencia:
          description: El valor corregido, si la regla lo puede proponer.
          type: string
          example: '0109990010'
    Huella:
      description: >-
        La huella de la vista previa: SHA-256, en hexadecimal, de sus registros en forma canónica.
      type: string
      pattern: '^[0-9a-f]{64}$'
      example: 3f1c0e6a9b2d4c8e7f5a1b3c9d0e2f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e
    TipoDeRegistro:
      description: Qué pasa con un registro si se confirma; las bajas no se aplican.
      type: string
      enum: [NUEVO, CAMBIA, BAJA]
    CambioDeCampo:
      type: object
      required: [campo, ahora, archivo]
      properties:
        campo:
          type: string
          example: dedicacion
        ahora:
          description: El valor que tiene ahora el sistema; vacío si no tiene.
          type: string
          example: MT
        archivo:
          description: El valor del archivo.
          type: string
          example: TC
    RegistroDeLaVista:
      type: object
      required: [clave, tipo, cambios]
      properties:
        clave:
          description: Los valores de la clave de la carga, unidos con « · ».
          type: string
          example: '0109990010'
        tipo:
          $ref: '#/components/schemas/TipoDeRegistro'
        fila:
          description: La fila del archivo; no la tiene una baja.
          type: integer
          minimum: 2
        cambios:
          description: Los campos que cambian; vacía si no es CAMBIA.
          type: array
          items:
            $ref: '#/components/schemas/CambioDeCampo'
    VistaPrevia:
      description: >-
        Los registros del archivo frente a los del servicio dueño (glosario «Vista previa»). Con
        errores en las filas solo trae filasConErrores.
      type: object
      required: [filasConErrores, registros]
      properties:
        filasConErrores:
          type: integer
          minimum: 0
        nuevos:
          type: integer
          minimum: 0
        cambian:
          type: integer
          minimum: 0
        bajas:
          type: integer
          minimum: 0
        iguales:
          type: integer
          minimum: 0
        registros:
          description: Hasta 100 de cada tipo, en orden de clave; sin los iguales.
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/RegistroDeLaVista'
        huella:
          $ref: '#/components/schemas/Huella'
    ResultadoDeConfirmacion:
      type: object
      required: [resultado, nuevos, cambiados, bajasSinAplicar, confirmadaEl]
      properties:
        resultado:
          description: APLICADA, o REPETIDA si el mismo archivo ya se había aplicado en esta carga.
          type: string
          enum: [APLICADA, REPETIDA]
        nuevos:
          type: integer
          minimum: 0
        cambiados:
          type: integer
          minimum: 0
        bajasSinAplicar:
          type: integer
          minimum: 0
        confirmadaEl:
          description: Cuándo se aplicó; en una repetida, la primera vez.
          type: string
          format: date-time
    ResultadoDeHistorial:
      type: string
      enum: [APLICADA, RECHAZADA, REPETIDA, SIN_PROYECTOS]
    EntradaDeHistorial:
      description: >-
        Un intento de confirmar una carga (glosario «Historial de cargas»), sin su contenido, o una
        confirmación «sin proyectos» de un periodo, que no tiene archivo ni hash.
      type: object
      required: [usuario, momento, resultado, nuevos, cambiados, bajasSinAplicar]
      properties:
        usuario:
          type: string
          example: datos.demo
        momento:
          type: string
          format: date-time
        archivo:
          type: string
          maxLength: 255
          example: 06_docentes.csv
        hash:
          description: SHA-256 del archivo, en hexadecimal.
          type: string
          pattern: '^[0-9a-f]{64}$'
        resultado:
          $ref: '#/components/schemas/ResultadoDeHistorial'
        nuevos:
          type: integer
          minimum: 0
        cambiados:
          type: integer
          minimum: 0
        bajasSinAplicar:
          type: integer
          minimum: 0
        motivo:
          description: El código del catálogo si se rechazó.
          type: string
          example: CARGAS_CARGA_RECHAZADA
        periodo:
          description: Solo en SIN_PROYECTOS, el periodo confirmado.
          allOf:
            - $ref: '#/components/schemas/CodigoDePeriodo'
    CodigoDePeriodo:
      description: >-
        El código de un periodo académico, con la regla de Académico, su dueño. La carga 3 pide
        AAAA-I o AAAA-II en su archivo, pero un periodo registrado en su pantalla puede tener otro
        código, como 003.
      type: string
      maxLength: 20
      pattern: '^[A-Za-z0-9._-]{1,20}$'
      example: 2026-II
    ConfirmacionSinProyectos:
      type: object
      required: [periodo]
      properties:
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
    EstadoDeLaCarga:
      description: >-
        Si una carga tiene datos (glosario «Estado de la carga»). CON_ERRORES solo lo da el tablero
        de preparación (F02-H02): una carga sin datos cuyo último intento de confirmar fue rechazado.
      type: string
      enum: [PENDIENTE, CARGADA, SIN_PROYECTOS, CON_ERRORES]
    CargaQueFalta:
      description: Una carga anterior que todavía no tiene datos.
      type: object
      required: [numero, codigo, nombre]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
        codigo:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: carreras
        nombre:
          type: string
          example: Carreras
    EstadoDeCarga:
      type: object
      required: [numero, codigo, estado, faltan, periodosSinProyectos]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
        codigo:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: asignaturas_malla
        estado:
          $ref: '#/components/schemas/EstadoDeLaCarga'
        faltan:
          description: Las cargas de las que depende que no están CARGADA, en su orden; vacía si se puede subir.
          type: array
          items:
            $ref: '#/components/schemas/CargaQueFalta'
        periodosSinProyectos:
          description: Solo en la carga de proyectos, los periodos confirmados «sin proyectos» que siguen valiendo.
          type: array
          items:
            $ref: '#/components/schemas/CodigoDePeriodo'
    EstadoDeLasCargas:
      type: object
      required: [cargas]
      properties:
        cargas:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/EstadoDeCarga'
    PeriodoParaElegir:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        nombre:
          type: string
          example: Periodo académico 2026-I
    CargaDelPeriodo:
      description: Una de las 10 cargas, con su estado en el periodo del tablero.
      type: object
      required: [numero, codigo, nombre, obligatoriedad, estado]
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 10
        codigo:
          type: string
          pattern: '^[a-z_]{1,40}$'
          example: docentes
        nombre:
          type: string
          example: Docentes contratados (con ficha académica)
        obligatoriedad:
          $ref: '#/components/schemas/Obligatoriedad'
        estado:
          $ref: '#/components/schemas/EstadoDeLaCarga'
        motivo:
          description: Solo en CON_ERRORES, el código del catálogo del último rechazo.
          type: string
          example: CARGAS_CARGA_CON_ERRORES
    TipoDeLoQueFalta:
      type: string
      enum: [CARGA, PERIODO_SIN_ABRIR, PERIODO_CERRADO, SIN_PERIODOS]
    LoQueFalta:
      description: >-
        Algo que falta para crear el distributivo: una carga obligatoria que no está cargada, el
        periodo sin abrir o cerrado, o que no hay periodos.
      type: object
      required: [tipo]
      properties:
        tipo:
          $ref: '#/components/schemas/TipoDeLoQueFalta'
        carga:
          $ref: '#/components/schemas/CargaQueFalta'
        estado:
          $ref: '#/components/schemas/EstadoDeLaCarga'
    PreparacionDelPeriodo:
      description: El tablero de preparación de un periodo (glosario «Tablero de preparación», RF-56).
      type: object
      required: [periodos, cargas, faltan, listo]
      properties:
        periodos:
          description: Los periodos de los ciclos académicos, del que empieza más tarde al más antiguo.
          type: array
          items:
            $ref: '#/components/schemas/PeriodoParaElegir'
        periodo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        abierto:
          description: Si el periodo tiene su versión de normativa (F02-H01).
          type: boolean
        cerrado:
          type: boolean
        cargas:
          description: Las 10 cargas en su orden; ninguna si no hay periodos.
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/CargaDelPeriodo'
        faltan:
          type: array
          items:
            $ref: '#/components/schemas/LoQueFalta'
        listo:
          description: Si se puede crear el distributivo del periodo; verdadero solo si no falta nada.
          type: boolean
