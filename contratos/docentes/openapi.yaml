        nombreDeCarrera:
          type: string
          example: DESARROLLO DE SOFTWARE
        fechaFin:
          type: string
          format: date
          example: '2027-03-31'
        documento:
          $ref: '#/components/schemas/Texto60'
        estado:
          $ref: '#/components/schemas/EstadoDeCargo'
        advertencias:
          type: array
          items:
            $ref: '#/components/schemas/AdvertenciaDeCargo'
    TipoDeProyecto:
      description: POL 5.3 y la carga 9.
      type: string
      enum: [INVESTIGACION, VINCULACION, PRACTICAS_PREPROFESIONALES, SERVICIO_COMUNITARIO]
    EstadoDeProyecto:
      description: Solo un proyecto aprobado o en ejecución recibe horas.
      type: string
      enum: [APROBADO, EN_EJECUCION, FINALIZADO, SUSPENDIDO]
    RolDeParticipante:
      type: string
      enum: [DIRECTOR, INVESTIGADOR, DOCENTE_APOYO, TUTOR_PRACTICAS]
    MotivoNoAsignable:
      type: string
      enum: [ESTADO, VIGENCIA]
    HorasSemanales:
      description: >-
        Mayor que 0, con hasta dos decimales y hasta 5 caracteres (aclaración 7 de F03-H05); los 5
        caracteres los revisa el dominio.
      type: number
      minimum: 0
      exclusiveMinimum: true
      maximum: 999.9
      multipleOf: 0.01
      example: 14
    Participante:
      type: object
      required: [docente, rol, horas]
      properties:
        docente:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        rol:
