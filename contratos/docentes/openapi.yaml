# Contrato de Docentes (servicio 4, proceso datos). Desde F03-H04: los docentes con su ficha
# académica (RF-16, RF-17, carga 6): registrarlos, buscarlos por nombre o identificación,
# consultarlos, corregirlos y cambiar su estado laboral. La ficha (títulos de tercer y cuarto nivel,
# cursos, experiencia y asignaturas afines declaradas) vive dentro del registro del docente. La
# carrera base y las asignaturas afines son de Académico, que las publica por consultarReferencias.
# Las dedicaciones son las de RN-01; que las horas contratadas cuadren con la dedicación lo revisa la
# validación del distributivo con la normativa del periodo (principio VI).
# Los mantienen quienes tienen «Docentes: escritura» (Talento Humano), «Catálogos y datos maestros:
# escritura» (Administrador) o «Distributivo del periodo: escritura» (Vicerrector); los leen quienes
# tienen la lectura de cualquiera de las tres: una lista en x-mdd-permiso son permisos alternativos
# (D-70). Nada se borra: un docente pasa a licencia o inactivo.
# Desde F03-H05: los cargos (carga 8) y los proyectos aprobados (carga 9, RF-18). Un cargo pide un
# docente activo a tiempo completo (POL 5.4), un solo coordinador vigente por carrera (RN-12) y avisa
# del cuarto nivel que falta (RN-20); los 16 cargos de gestor son los de D-73. Un proyecto es
# asignable en un periodo si está aprobado o en ejecución y su vigencia se cruza con el periodo
# (RN-25). Los mismos permisos de escritura; para leer, los mismos tres: «Proyectos y horas de
# participantes: lectura» no basta, porque su «solo lo propio» todavía no se puede aplicar (D-64).
# Desde F06-H01: la formación del docente para Generación, por una ruta interna, sin datos de
# contacto ni de contrato (ADR-023, principio IX).
openapi: 3.0.3
info:
  title: MDD · Docentes
  version: 1.0.0
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: Interno
    description: Consultas entre procesos (ADR-023). El API Gateway no enruta /interno/.
  - name: Docentes
    description: >-
      Los docentes con su ficha académica (RF-16, RF-17, carga 6). Ninguno se borra: cambia su
      estado laboral.
  - name: Cargos
    description: >-
      Los cargos de gestión de los docentes (carga 8, RN-12, RN-20, D-73). Ninguno se borra: se
      finaliza.
  - name: Proyectos
    description: >-
      Los proyectos aprobados por el OCS y sus participantes (RF-18, RN-25, carga 9). Ninguno se
      borra: cambia su estado.
paths:
  /api/docentes/docentes:
    get:
      tags: [Docentes]
      operationId: buscarDocentes
      summary: Busca docentes por nombre o identificación, y por carrera base y estado laboral.
      description: >-
        El texto se compara sin mayúsculas ni tildes con los nombres y apellidos, o con el inicio de
        la identificación. Sin criterios, trae todos. Ordenados por apellidos y nombres.
      x-mdd-permiso: [DOCENTES:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      parameters:
        - name: texto
          in: query
          required: false
          description: Parte del nombre o de los apellidos, o el inicio de la identificación.
          schema:
            type: string
            maxLength: 100
          example: peralta
        - name: carrera
          in: query
          required: false
          description: Código de la carrera base.
          schema:
            $ref: '#/components/schemas/CodigoDeCarrera'
          example: 550411C02-P-0301
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoLaboral'
          example: ACTIVO
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResumenDeDocente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Docentes]
      operationId: registrarDocente
      summary: Registra un docente con su ficha académica; queda activo.
      description: >-
        La carrera base y las asignaturas afines tienen que existir en Académico, y el campo amplio
        del título de tercer nivel tiene que ser uno de los 11 de la CINE.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocenteNuevo'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeDocente'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /interno/docentes/{identificacion}/formacion:
    parameters:
      - $ref: '#/components/parameters/Identificacion'
    get:
      tags: [Interno]
      operationId: consultarFormacion
      summary: Devuelve la formación del docente, con sus campos de conocimiento.
      description: >-
        Solo entre procesos, con el token de proceso: lo usa Generación para calcular la afinidad
        (ADR-010, ADR-023). No lleva datos de contacto ni de contrato (principio IX).
      responses:
        '200':
          description: La formación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormacionDelDocente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
  /api/docentes/docentes/{identificacion}:
    parameters:
      - $ref: '#/components/parameters/Identificacion'
    get:
      tags: [Docentes]
      operationId: consultarDocente
      summary: Devuelve un docente con su ficha académica y los nombres de sus referencias.
      x-mdd-permiso: [DOCENTES:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Docentes]
      operationId: corregirDocente
      summary: Corrige los datos de un docente y su ficha académica; la identificación y el estado no cambian.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeDocente'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeDocente'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/docentes/{identificacion}/estado:
    parameters:
      - $ref: '#/components/parameters/Identificacion'
    put:
      tags: [Docentes]
      operationId: cambiarEstadoDocente
      summary: Pasa a un docente a activo, en licencia o inactivo; ninguno se borra.
      description: Solo un docente activo recibe asignaciones.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoLaboralNuevo'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Docente'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/referencias:
    get:
      tags: [Docentes]
      operationId: consultarReferenciasDeDocentes
      summary: 'Devuelve lo que se elige al registrar un docente, un cargo o un proyecto: las carreras, las asignaturas, los campos amplios, las unidades y los periodos de Académico.'
      x-mdd-permiso: [DOCENTES:LECTURA, DISTRIBUTIVO:LECTURA, CATALOGOS:LECTURA]
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenciasDeDocentes'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/cargos:
    get:
      tags: [Cargos]
      operationId: listarCargos
      summary: Lista los cargos, con sus advertencias, por estado y por docente.
      description: >-
        Las advertencias se calculan al consultar: un coordinador o un gestor sin título de cuarto
        nivel (RN-20), un cargo vigente con la fecha de fin vencida y uno cuyo docente ya no está
        activo a tiempo completo. Ordenados por docente, cargo y fecha de designación.
      x-mdd-permiso: [DOCENTES:LECTURA, CATALOGOS:LECTURA, DISTRIBUTIVO:LECTURA]
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoDeCargo'
          example: VIGENTE
        - name: docente
          in: query
          required: false
          description: Identificación del docente.
          schema:
            $ref: '#/components/schemas/NumeroDeIdentificacion'
          example: '0109990010'
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cargo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Cargos]
      operationId: registrarCargo
      summary: Registra el cargo de un docente activo a tiempo completo, con sus advertencias.
      description: >-
        La unidad tiene que corresponder al cargo y la carrera de un coordinador no puede tener otro
        coordinador vigente (RN-12). Sin título de cuarto nivel, un coordinador o un gestor se
        registra con una advertencia (RN-20).
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CargoNuevo'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeCargo'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/cargos/{docente}/{tipo}/{fechaDesignacion}:
    parameters:
      - name: docente
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        example: '0109990044'
      - name: tipo
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/TipoDeCargo'
        example: COORDINADOR_CARRERA
      - name: fechaDesignacion
        in: path
        required: true
        schema:
          type: string
          format: date
        example: '2025-04-01'
    put:
      tags: [Cargos]
      operationId: corregirCargo
      summary: Corrige o finaliza un cargo; su docente, su cargo y su fecha de designación no cambian.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeCargo'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cargo'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/CargoNoEncontrado'
        '409':
          $ref: '#/components/responses/ConflictoDeCargo'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/proyectos:
    get:
      tags: [Proyectos]
      operationId: listarProyectos
      summary: Lista los proyectos aprobados y, con un periodo, si cada uno es asignable en él.
      description: >-
        Un proyecto es asignable en un periodo si está aprobado o en ejecución y su vigencia se cruza
        con las fechas del periodo (RF-18, RN-25); si no, dice por qué. Ordenados por código.
      x-mdd-permiso: [DOCENTES:LECTURA, CATALOGOS:LECTURA, DISTRIBUTIVO:LECTURA]
      parameters:
        - $ref: '#/components/parameters/PeriodoOpcional'
        - name: tipo
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/TipoDeProyecto'
          example: INVESTIGACION
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoDeProyecto'
          example: EN_EJECUCION
      responses:
        '200':
          description: La lista.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    post:
      tags: [Proyectos]
      operationId: registrarProyecto
      summary: Registra un proyecto aprobado por el OCS, con sus participantes y sus horas.
      description: >-
        Las carreras tienen que existir en Académico, y el director y los participantes en Docentes.
        La suma de las horas de los participantes no puede pasar las horas aprobadas.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProyectoNuevo'
      responses:
        '201':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '409':
          $ref: '#/components/responses/ConflictoDeProyecto'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
  /api/docentes/proyectos/{codigo}:
    parameters:
      - name: codigo
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CodigoDeProyecto'
        example: INV-2025-01
    get:
      tags: [Proyectos]
      operationId: consultarProyecto
      summary: Devuelve un proyecto con los nombres de su director, sus participantes y sus carreras.
      x-mdd-permiso: [DOCENTES:LECTURA, CATALOGOS:LECTURA, DISTRIBUTIVO:LECTURA]
      parameters:
        - $ref: '#/components/parameters/PeriodoOpcional'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
    put:
      tags: [Proyectos]
      operationId: corregirProyecto
      summary: Corrige un proyecto o cambia su estado; su código no cambia.
      x-mdd-permiso: [DOCENTES:ESCRITURA, CATALOGOS:ESCRITURA, DISTRIBUTIVO:ESCRITURA]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatosDeProyecto'
      responses:
        '200':
          description: El resultado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proyecto'
        '400':
          $ref: '../comun/errores.yaml#/components/responses/SolicitudInvalida'
        '401':
          $ref: '../comun/seguridad.yaml#/components/responses/NoAutenticado'
        '403':
          $ref: '../comun/seguridad.yaml#/components/responses/AccesoNoAutorizado'
        '404':
          $ref: '#/components/responses/ProyectoNoEncontrado'
        '500':
          $ref: '../comun/errores.yaml#/components/responses/ErrorInterno'
        '503':
          $ref: '../comun/errores.yaml#/components/responses/ServicioNoDisponible'
components:
  securitySchemes:
    bearer:
      $ref: '../comun/seguridad.yaml#/components/securitySchemes/bearer'
  parameters:
    Identificacion:
      name: identificacion
      in: path
      required: true
      description: Cédula o pasaporte del docente.
      schema:
        $ref: '#/components/schemas/NumeroDeIdentificacion'
      example: '0109990010'
    PeriodoOpcional:
      name: periodo
      in: query
      required: false
      description: Código de un periodo de Académico; con él, cada proyecto dice si es asignable.
      schema:
        $ref: '#/components/schemas/CodigoDePeriodo'
      example: 2026-I
  responses:
    CargoNoEncontrado:
      description: El cargo no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ProyectoNoEncontrado:
      description: El proyecto no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConflictoDeCargo:
      description: >-
        Un cargo repetido, un segundo coordinador vigente o un docente que no está activo a tiempo
        completo: DOCENTES_CARGO_REPETIDO, DOCENTES_COORDINADOR_VIGENTE o
        DOCENTES_DOCENTE_NO_HABILITADO (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConflictoDeProyecto:
      description: Un código repetido, DOCENTES_PROYECTO_REPETIDO (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    NoEncontrado:
      description: El docente no existe (COMUN_RECURSO_NO_ENCONTRADO).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
    ConflictoDeDocente:
      description: >-
        Una identificación o un correo repetidos: DOCENTES_DOCENTE_REPETIDO o
        DOCENTES_CORREO_REPETIDO (errores.md).
      content:
        application/json:
          schema:
            $ref: '../comun/errores.yaml#/components/schemas/Error'
  schemas:
    NumeroDeIdentificacion:
      description: Cédula de 10 dígitos o pasaporte de hasta 13 letras mayúsculas o dígitos.
      type: string
      pattern: '^[0-9A-Z]{1,13}$'
      example: '0109990010'
    CodigoDeCarrera:
      type: string
      pattern: '^[0-9A-Z-]{1,20}$'
      example: 550613A01-P-0301
    CodigoDeAsignatura:
      type: string
      pattern: '^[0-9A-Z-]{1,30}$'
      example: DS-P-II-POO-204
    CodigoDeCampoAmplio:
      type: string
      pattern: '^[0-9]{2}$'
      example: '06'
    CodigoDeCampoEspecifico:
      type: string
      pattern: '^[0-9]{3}$'
      example: '061'
    Anio:
      description: De 1950 al año actual.
      type: integer
      minimum: 1950
      maximum: 2100
      example: 2022
    Texto150:
      type: string
      minLength: 1
      maxLength: 150
    TipoDeIdentificacion:
      description: Tipo de documento (carga 6).
      type: string
      enum: [CEDULA, PASAPORTE]
    TipoPersonal:
      description: Tipo de personal académico (RCE art. 137).
      type: string
      enum: [TITULAR, OCASIONAL, INVITADO, HONORARIO]
    CategoriaDeEscalafon:
      description: Categoría y nivel del titular; los demás tipos llevan NO_APLICA.
      type: string
      enum: [AUXILIAR_1, AUXILIAR_2, AGREGADO_1, AGREGADO_2, AGREGADO_3, PRINCIPAL_1, PRINCIPAL_2, PRINCIPAL_3, NO_APLICA]
    Dedicacion:
      description: Tiempo completo, medio tiempo o tiempo parcial (RN-01).
      type: string
      enum: [TC, MT, TP]
    CondicionEspecial:
      description: Condición que cambia las horas que le corresponden (RN-14 a RN-16).
      type: string
      enum: [CUIDADOR_SUSTITUTO, MATERNIDAD_LACTANCIA, APOYO_SIES, NINGUNA]
    EstadoLaboral:
      description: Solo un docente activo recibe asignaciones.
      type: string
      enum: [ACTIVO, LICENCIA, INACTIVO]
    TipoDeTituloDeCuartoNivel:
      type: string
      enum: [MAESTRIA, ESPECIALIZACION, DOCTORADO]
    CampoAmplio:
      type: object
      required: [codigo, nombre]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        nombre:
          type: string
          example: Tecnologías de la información y la comunicación
    TituloDeTercerNivel:
      type: object
      required: [titulo, campoAmplio, campoEspecifico]
      properties:
        titulo:
          $ref: '#/components/schemas/Texto150'
        registroSenescyt:
          type: string
          minLength: 1
          maxLength: 30
        campoAmplio:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
    TituloDeCuartoNivel:
      type: object
      required: [titulo, tipo, campoEspecifico, anio]
      properties:
        titulo:
          $ref: '#/components/schemas/Texto150'
        tipo:
          $ref: '#/components/schemas/TipoDeTituloDeCuartoNivel'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        anio:
          $ref: '#/components/schemas/Anio'
    Curso:
      type: object
      required: [nombre, campoEspecifico, horas, anio]
      properties:
        nombre:
          $ref: '#/components/schemas/Texto150'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        horas:
          type: integer
          minimum: 1
          maximum: 2000
          example: 40
        anio:
          $ref: '#/components/schemas/Anio'
    ExperienciaLaboral:
      type: object
      required: [cargo, institucion, campoEspecifico, anios]
      properties:
        cargo:
          $ref: '#/components/schemas/Texto150'
        institucion:
          $ref: '#/components/schemas/Texto150'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
        anios:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 60
          example: 3
    FormacionDelDocente:
      description: Lo que Generación necesita de la ficha académica (principio IX).
      type: object
      required: [tercerNivel, cuartoNivel, experiencia, cursos]
      properties:
        tercerNivel:
          $ref: '#/components/schemas/TercerNivelDeFormacion'
        cuartoNivel:
          type: array
          items:
            $ref: '#/components/schemas/ElementoDeFormacion'
        experiencia:
          type: array
          items:
            $ref: '#/components/schemas/ElementoDeFormacion'
        cursos:
          type: array
          items:
            $ref: '#/components/schemas/ElementoDeFormacion'
    TercerNivelDeFormacion:
      type: object
      required: [nombre, campoAmplio, campoEspecifico]
      properties:
        nombre:
          $ref: '#/components/schemas/Texto150'
        campoAmplio:
          $ref: '#/components/schemas/CodigoDeCampoAmplio'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
    ElementoDeFormacion:
      description: Un título de cuarto nivel, un cargo o un curso, con su campo específico.
      type: object
      required: [nombre, campoEspecifico]
      properties:
        nombre:
          $ref: '#/components/schemas/Texto150'
        campoEspecifico:
          $ref: '#/components/schemas/CodigoDeCampoEspecifico'
    FichaAcademica:
      description: Formación y experiencia del docente, dentro de su registro (RF-17).
      type: object
      required: [tercerNivel]
      properties:
        tercerNivel:
          $ref: '#/components/schemas/TituloDeTercerNivel'
        cuartoNivel:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/TituloDeCuartoNivel'
        cursos:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Curso'
        experiencia:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/ExperienciaLaboral'
        asignaturasAfines:
          description: >-
            Códigos de asignaturas de Académico, sin repetir; una repetida responde 400 con su
            posición (el dominio la rechaza, en lugar de quitarla sin avisar).
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CodigoDeAsignatura'
    Nombre60:
      type: string
      minLength: 1
      maxLength: 60
    DatosDeDocente:
      type: object
      required: [primerApellido, primerNombre, correoInstitucional, tipoPersonal, categoriaEscalafon, dedicacion, horasContratadas, fechaIngreso, inicioContrato, carreraBase, ficha]
