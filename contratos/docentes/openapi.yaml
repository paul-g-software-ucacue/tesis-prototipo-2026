            $ref: '#/components/schemas/AsignaturaAfin'
    ResumenDeDocente:
      type: object
      required: [identificacion, nombreCompleto, carreraBase, tipoPersonal, dedicacion, horasContratadas, condicionEspecial, estado]
      properties:
        identificacion:
