      type: string
      pattern: '^[A-Z0-9_-]{1,20}$'
      example: G-INV
    CodigoDePeriodo:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,20}$'
      example: 2026-I
    CodigoDeProyecto:
      description: Mayúsculas, dígitos y guion, sin espacios (aclaración 5 de F03-H05).
      type: string
      pattern: '^[0-9A-Z-]{1,30}$'
      example: INV-2025-01
    Texto60:
      type: string
      minLength: 1
      maxLength: 60
    TipoDeCargo:
      description: >-
        Cargo de la carga 8: las autoridades, los coordinadores, un gestor por cada gestión
        autorizada G06 a G21 de POL 6 (D-73) y el miembro de comisión, sin horas (C-12).
      type: string
      enum: [RECTOR, VICERRECTOR, COORDINADOR_ACADEMICO_INSTITUCIONAL, COORDINADOR_SEDE, COORDINADOR_CARRERA, G06_GESTOR_VINCULACION, G07_GESTOR_INVESTIGACION, G08_GESTOR_IDIOMAS, G09_GESTOR_FORMACION_INTEGRAL, G10_COORDINADOR_CALIDAD, G11_SECRETARIO_GENERAL, G12_PROCURADOR, G13_GESTOR_BIENESTAR, G14_GESTOR_ADMINISTRATIVO_FINANCIERO, G15_GESTOR_PLANIFICACION, G16_GESTOR_TALENTO_HUMANO, G17_GESTOR_BIBLIOTECA, G18_GESTOR_COMUNICACION, G19_GESTOR_RELACIONES_INTERNACIONALES, G20_GESTOR_TIC, G21_GESTOR_ESTADISTICAS, MIEMBRO_COMISION]
    EstadoDeCargo:
      description: Vigente o finalizado; un cargo nunca se borra.
      type: string
      enum: [VIGENTE, FINALIZADO]
    CodigoDeAdvertencia:
      type: string
      enum: [CUARTO_NIVEL, FECHA_FIN_VENCIDA, DOCENTE_NO_HABILITADO]
    AdvertenciaDeCargo:
      description: Se calcula al consultar; no bloquea nada.
      type: object
      required: [codigo, descripcion]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeAdvertencia'
        descripcion:
          type: string
          example: Le falta un título de cuarto nivel registrado (RN-20).
    DatosDeCargo:
      description: >-
        La unidad es obligatoria salvo para el coordinador de carrera: la de un gestor es la unidad de
        su gestión autorizada y la de un miembro de comisión, una comisión. La carrera, solo para el
        coordinador de carrera. El fin de funciones es posterior a la designación y hasta dos años
        después (POL 5.4). El documento es la resolución o la acción de personal.
      type: object
      required: [documento, estado]
      properties:
        unidad:
          $ref: '#/components/schemas/CodigoDeUnidad'
        carrera:
          $ref: '#/components/schemas/CodigoDeCarrera'
        fechaFin:
          type: string
          format: date
          example: '2027-03-31'
        documento:
          $ref: '#/components/schemas/Texto60'
        estado:
          $ref: '#/components/schemas/EstadoDeCargo'
    CargoNuevo:
      description: >-
        La clave (docente, cargo y fecha de designación) y los campos de DatosDeCargo, al mismo
        nivel. Sin estado, queda VIGENTE.
      type: object
      required: [docente, tipo, fechaDesignacion, documento]
      properties:
        docente:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        tipo:
          $ref: '#/components/schemas/TipoDeCargo'
        fechaDesignacion:
          type: string
          format: date
          example: '2025-04-01'
        unidad:
          $ref: '#/components/schemas/CodigoDeUnidad'
        carrera:
          $ref: '#/components/schemas/CodigoDeCarrera'
        fechaFin:
          type: string
          format: date
          example: '2027-03-31'
        documento:
          $ref: '#/components/schemas/Texto60'
        estado:
          $ref: '#/components/schemas/EstadoDeCargo'
    Cargo:
      description: Lo de CargoNuevo, con los nombres de sus referencias y sus advertencias.
      type: object
      required: [docente, tipo, fechaDesignacion, documento, estado, advertencias]
      properties:
        docente:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombreDelDocente:
          type: string
          example: PERALTA MALDONADO JUAN ANDRES
        tipo:
          $ref: '#/components/schemas/TipoDeCargo'
        fechaDesignacion:
          type: string
          format: date
          example: '2025-04-01'
        unidad:
