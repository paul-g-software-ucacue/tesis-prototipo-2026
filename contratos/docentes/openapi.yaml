        motivos:
          description: Solo si se pidió un periodo y no es asignable.
          type: array
          items:
            $ref: '#/components/schemas/MotivoNoAsignable'
    TipoDeUnidad:
      type: string
      enum: [SEDE_MATRIZ, SEDE, EXTENSION, CAMPUS, GOBIERNO, UNIDAD_ACADEMICA, GESTION, COMISION]
    UnidadDeReferencia:
      type: object
      required: [codigo, nombre, tipo, activa]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeUnidad'
        nombre:
          type: string
          example: Gestión de Investigación
        tipo:
          $ref: '#/components/schemas/TipoDeUnidad'
        gestionAutorizada:
          description: Solo en las unidades de una gestión autorizada de POL 6.
          type: string
          pattern: '^G(0[1-9]|1[0-9]|2[01])$'
          example: G07
        activa:
          type: boolean
          example: true
    PeriodoDeReferencia:
      type: object
      required: [codigo, nombre, inicio, fin]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDePeriodo'
        nombre:
          type: string
          example: Periodo académico 2026-I
        inicio:
          type: string
          format: date
          example: '2026-04-06'
        fin:
          type: string
          format: date
          example: '2026-08-07'
