      required: [codigo, nombre, tipo, carreras, resolucionOcs, fechaResolucion, estado, vigenciaInicio, vigenciaFin, director, participantes, horasAprobadas]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeProyecto'
        nombre:
          type: string
          minLength: 1
          maxLength: 250
          example: Prototipo de monitoreo IoT para hatos lecheros
        tipo:
          $ref: '#/components/schemas/TipoDeProyecto'
        carreras:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CodigoDeCarrera'
        resolucionOcs:
          $ref: '#/components/schemas/Texto60'
        fechaResolucion:
          type: string
          format: date
          example: '2025-03-20'
        estado:
          $ref: '#/components/schemas/EstadoDeProyecto'
        vigenciaInicio:
          type: string
          format: date
          example: '2025-04-01'
        vigenciaFin:
          type: string
          format: date
          example: '2026-12-31'
        director:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        participantes:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: '#/components/schemas/Participante'
        horasAprobadas:
          $ref: '#/components/schemas/HorasSemanales'
    Proyecto:
      description: >-
        Lo de ProyectoNuevo, con los nombres de sus referencias y, si se pidió un periodo, si es
        asignable en él y por qué no.
      type: object
      required: [codigo, nombre, tipo, carreras, resolucionOcs, fechaResolucion, estado, vigenciaInicio, vigenciaFin, director, participantes, horasAprobadas, nombresDeCarreras]
      properties:
        codigo:
          $ref: '#/components/schemas/CodigoDeProyecto'
        nombre:
          type: string
          example: Prototipo de monitoreo IoT para hatos lecheros
        tipo:
          $ref: '#/components/schemas/TipoDeProyecto'
        carreras:
          type: array
          items:
            $ref: '#/components/schemas/CodigoDeCarrera'
        nombresDeCarreras:
          description: Las carreras con su nombre; falta la que ya no está en Académico.
          type: array
          items:
            $ref: '#/components/schemas/CarreraDeReferencia'
        resolucionOcs:
          $ref: '#/components/schemas/Texto60'
        fechaResolucion:
          type: string
          format: date
          example: '2025-03-20'
        estado:
          $ref: '#/components/schemas/EstadoDeProyecto'
        vigenciaInicio:
          type: string
          format: date
          example: '2025-04-01'
        vigenciaFin:
          type: string
          format: date
          example: '2026-12-31'
        director:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombreDelDirector:
          type: string
          example: PERALTA MALDONADO JUAN ANDRES
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteDeProyecto'
        horasAprobadas:
          $ref: '#/components/schemas/HorasSemanales'
        asignable:
          description: Solo si se pidió un periodo.
          type: boolean
