        inicioContrato:
          type: string
          format: date
          example: '2026-04-01'
        finContrato:
          description: Obligatorio para un ocasional; posterior al inicio.
          type: string
          format: date
          example: '2026-08-31'
        condicionEspecial:
          $ref: '#/components/schemas/CondicionEspecial'
        carreraBase:
          $ref: '#/components/schemas/CodigoDeCarrera'
        ficha:
          $ref: '#/components/schemas/FichaAcademica'
    AsignaturaAfin:
      type: object
