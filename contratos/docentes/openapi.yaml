      description: Un participante con su nombre; falta si el docente ya no está.
      type: object
      required: [docente, rol, horas]
      properties:
        docente:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        nombre:
          type: string
          example: PERALTA MALDONADO JUAN ANDRES
        rol:
          $ref: '#/components/schemas/RolDeParticipante'
        horas:
          $ref: '#/components/schemas/HorasSemanales'
    DatosDeProyecto:
      type: object
      required: [nombre, tipo, carreras, resolucionOcs, fechaResolucion, estado, vigenciaInicio, vigenciaFin, director, participantes, horasAprobadas]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 250
          example: Prototipo de monitoreo IoT para hatos lecheros
        tipo:
          $ref: '#/components/schemas/TipoDeProyecto'
        carreras:
          description: Sin repetir; una repetida da 400 con su posición.
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/CodigoDeCarrera'
        resolucionOcs:
          $ref: '#/components/schemas/Texto60'
        fechaResolucion:
          type: string
          format: date
          example: '2025-03-20'
        estado:
          $ref: '#/components/schemas/EstadoDeProyecto'
        vigenciaInicio:
          type: string
          format: date
          example: '2025-04-01'
        vigenciaFin:
          description: Posterior al inicio.
          type: string
          format: date
          example: '2026-12-31'
        director:
          $ref: '#/components/schemas/NumeroDeIdentificacion'
        participantes:
          description: Sin repetir docente; sus horas no suman más que las aprobadas.
