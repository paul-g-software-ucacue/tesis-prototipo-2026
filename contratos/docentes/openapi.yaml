        primerApellido:
          $ref: '#/components/schemas/Nombre60'
        segundoApellido:
          $ref: '#/components/schemas/Nombre60'
        primerNombre:
          $ref: '#/components/schemas/Nombre60'
        segundoNombre:
          $ref: '#/components/schemas/Nombre60'
        correoInstitucional:
          type: string
          minLength: 3
          maxLength: 100
          example: juan.peralta@instituto-prueba.edu.ec
        telefono:
          type: string
          pattern: '^[0-9]{7,10}$'
          example: '0990000001'
        tipoPersonal:
          $ref: '#/components/schemas/TipoPersonal'
        categoriaEscalafon:
          $ref: '#/components/schemas/CategoriaDeEscalafon'
        dedicacion:
          $ref: '#/components/schemas/Dedicacion'
        horasContratadas:
          description: Horas semanales contratadas; que cuadren con la dedicación lo revisa la normativa del periodo.
          type: integer
          minimum: 1
          maximum: 40
          example: 40
        fechaIngreso:
          type: string
          format: date
          example: '2019-10-01'
        inicioContrato:
          type: string
          format: date
          example: '2026-04-01'
        finContrato:
          description: Obligatorio para un ocasional; posterior al inicio.
          type: string
          format: date
