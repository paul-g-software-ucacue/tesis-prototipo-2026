# Nginx de la SPA (D-52, ADR-019; specs/007-spa-base/contracts/perfil.md). Es una plantilla: la
# imagen la copia a /etc/nginx/templates/ y reemplaza ${MDD_URI_GATEWAY} al arrancar. Las variables
# de Nginx ($uri, $host…) no son variables de entorno y quedan como están.
#
# Sirve la SPA y envía /api al API Gateway en el mismo origen, como Caddy en el VPS: así no hace
# falta CORS y el token solo viaja en la cabecera Authorization hacia /api (ADR-014, D-51).

# Los recursos con hash en el nombre se guardan un año; index.html y las rutas de la SPA, nunca,
# para que una versión nueva se vea al recargar.
map $uri $mdd_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default "no-cache";
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad en todas las respuestas, también en los errores. Emotion (MUI) inserta
    # estilos en línea: 'unsafe-inline' solo en style-src, nunca en los scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $mdd_cache_control always;

    # Para el healthcheck del contenedor.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # El nombre del API Gateway se resuelve en cada petición con el DNS del contenedor
    # (NGINX_LOCAL_RESOLVERS): Nginx arranca aunque el API Gateway todavía no exista y lo sigue si
    # cambia de dirección al reiniciarse. Sin él, /api responde 502 y la SPA muestra un error genérico.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    # La API, sin cambios, hacia el API Gateway; también la cabecera Authorization. Con una variable
    # y sin ruta, proxy_pass reenvía la URI original completa.
    location /api/ {
        set $mdd_gateway ${MDD_URI_GATEWAY};
        proxy_pass $mdd_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Las rutas de la SPA (/, /iniciar-sesion…) responden index.html; el enrutador decide.
    location / {
        try_files $uri /index.html;
    }
}
