// Servicio firma del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
    // El firmador de prueba (F14-H02), compartido con las pruebas del proceso distributivo.
    id 'java-test-fixtures'
}

def versionBouncyCastle = providers.gradleProperty('versionBouncyCastle').get()
def versionPdfbox = providers.gradleProperty('versionPdfbox').get()
def versionOpenHtmlToPdf = providers.gradleProperty('versionOpenHtmlToPdf').get()
def versionVeraPdf = providers.gradleProperty('versionVeraPdf').get()

dependencies {
    // El contenido de la versión congelada, por la interfaz publicada de Generación en el mismo
    // proceso (F13-H02): solo ec.mdd.generacion.puertos.entrada.
    implementation project(':servicios:generacion')
    // Los nombres de los firmantes, por las rutas internas de Datos e Identidad (ADR-023).
    implementation project(':plataforma:eventos')
    // Las generaciones y los documentos, en el esquema firma (F13-H02); la cadena va en jsonb.
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'tools.jackson.core:jackson-databind'
    // El permiso de cada operación y quién la pide, en el token (ADR-021).
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // F13-H02, D-101: el PDF/A del documento firmable, con el camino probado en B00-S01.
    implementation "org.apache.pdfbox:pdfbox:${versionPdfbox}"
    implementation "io.github.openhtmltopdf:openhtmltopdf-pdfbox:${versionOpenHtmlToPdf}"
    // F14-H02, D-103: la validación del PDF firmado (integridad del CMS y cadena hasta la raíz),
    // con el camino probado en B00-S01 (D-46). Solo en los adaptadores (ArquitecturaTest).
    implementation "org.bouncycastle:bcpkix-jdk18on:${versionBouncyCastle}"

    // El firmador de prueba firma como FirmaEC, con una CA en memoria (F14-H02). Bouncy Castle va
    // como api: FirmasDePrueba.firmante recibe un X500Name, así que quien la usa lo necesita.
    testFixturesImplementation "org.apache.pdfbox:pdfbox:${versionPdfbox}"
    testFixturesApi "org.bouncycastle:bcpkix-jdk18on:${versionBouncyCastle}"
}

testing {
    suites {
        test {
            dependencies {
                // Solo en pruebas: la verificación de PDF/A con veraPDF, que necesita JAXB 2.3
                // (D-46, D-101). No entra a la imagen. Bouncy Castle ya está en el código (D-103).
                implementation "org.verapdf:validation-model:${versionVeraPdf}"
            }
        }
        integrationTest {
            dependencies {
                implementation testFixtures(project())
            }
        }
    }
}

// veraPDF usa JAXB 2.3 (javax.xml.bind); el BOM de Spring Boot sube jaxb-impl y jaxb-core a la
// 4.x (jakarta) y veraPDF ya no carga sus perfiles. Solo en el classpath de las pruebas: la
// jaxb-impl 2.3.9 ya incluye el núcleo, así que jaxb-core se excluye.
configurations.named('testRuntimeClasspath') {
    exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    resolutionStrategy.eachDependency { detalle ->
        if (detalle.requested.group == 'com.sun.xml.bind' && detalle.requested.name == 'jaxb-impl') {
            detalle.useVersion '2.3.9'
            detalle.because 'veraPDF necesita JAXB 2.3 (javax.xml.bind), no la 4.x del BOM'
        }
        if (detalle.requested.group == 'javax.xml.bind' && detalle.requested.name == 'jaxb-api') {
            detalle.useVersion '2.3.1'
            detalle.because 'la versión estable de la API de JAXB 2.3'
        }
    }
}

// Modo local de D-43: -D llega a la JVM de Gradle, no a la de las pruebas; se reenvían las rutas
// de los PDF firmados y de la raíz solo si están definidas.
tasks.named('test') {
    ['mdd.firma.pdf0', 'mdd.firma.pdf1', 'mdd.firma.pdf2', 'mdd.firma.raiz'].each { nombre ->
        def valor = providers.systemProperty(nombre)
        if (valor.isPresent()) {
            systemProperty nombre, valor.get()
        }
    }
}
