// Servicio cargas del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
}

dependencies {
    // Lectura del JWT ya validado en la sesión actual (D-39).
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    // Los XLSX de las cargas (F01-H02, research §5): solo en adaptadores.salida.
    implementation "org.apache.poi:poi-ooxml:${versionApachePoi}"
    // Las referencias de las filas (F01-H03, research §6): las unidades, carreras, periodos y
    // asignaturas de Académico y las identificaciones de Docentes, por sus interfaces publicadas;
    // solo sus puertos.entrada, que ModulosTest del proceso datos comprueba (principio V).
    implementation project(':servicios:academico')
    implementation project(':servicios:docentes')
    // El lenguaje publicado de las cargas (ADR-022): el lote, la vista previa y el aplicador de cada
    // servicio dueño (F01-H04).
    implementation project(':plataforma:lenguaje-cargas')
    // El historial de cargas en el esquema cargas, con JdbcClient, como Docentes (F01-H04).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
}
