        tipo: "Entero"
        longitud: 2
        obligatorio: "Sí"
        formato: "1–10"
        ejemplo: "5"
      - campo: estado
        descripcion: "Estado"
        tipo: "Catálogo"
        longitud: 12
        obligatorio: "Sí"
        formato: "VIGENTE, NO_VIGENTE, EN_CIERRE"
        validacion: "Solo VIGENTE admite oferta"
        ejemplo: "VIGENTE"
