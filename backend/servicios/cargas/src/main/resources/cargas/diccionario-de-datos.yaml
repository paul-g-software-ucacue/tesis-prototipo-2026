cargas:
  - numero: 1
    codigo: estructura_organica
    nombre: "Estructura orgánica"
    archivo: 01_estructura_organica.csv
    dependeDe: []
    obligatoriedad: OBLIGATORIA
    columnas:
      - campo: codigo_unidad
        descripcion: "Código único de la unidad"
        tipo: "Texto"
        longitud: 20
        obligatorio: "Sí"
        formato: "Mayúsculas, dígitos, «-» o «_»"
        clave: "PK"
        validacion: "Único en el archivo"
        ejemplo: "MATRIZ"
      - campo: nombre
        descripcion: "Nombre de la unidad"
        tipo: "Texto"
        longitud: 150
        obligatorio: "Sí"
        ejemplo: "Sede matriz Cuenca"
      - campo: tipo_unidad
        descripcion: "Tipo de unidad"
        tipo: "Catálogo"
        longitud: 30
        obligatorio: "Sí"
        formato: "SEDE_MATRIZ, SEDE, EXTENSION, CAMPUS, GOBIERNO, UNIDAD_ACADEMICA, GESTION, COMISION"
        validacion: "COMISION solo como dato informativo, sin horas (ERS C-12)"
        ejemplo: "SEDE_MATRIZ"
      - campo: codigo_unidad_padre
        descripcion: "Unidad de la que depende"
        tipo: "Texto"
        longitud: 20
        obligatorio: "No"
        clave: "FK → codigo_unidad (mismo archivo)"
        validacion: "Debe existir; no puede formar ciclos"
        ejemplo: "MATRIZ"
      - campo: codigo_gestion_autorizada
        descripcion: "Gestión autorizada por SENESCYT que representa"
        tipo: "Catálogo"
        longitud: 3
        obligatorio: "Sí si tipo_unidad = GESTION"
        formato: "G01–G21 (ver los valores permitidos)"
        validacion: "Solo las 21 gestiones de POL 6"
        ejemplo: "G07"
        catalogo: GESTIONES_AUTORIZADAS
      - campo: es_comision_permanente
        descripcion: "Si la comisión es permanente"
        tipo: "S/N"
        longitud: 1
        obligatorio: "Sí si tipo_unidad = COMISION"
        formato: "S o N"
        ejemplo: "S"
      - campo: estado
        descripcion: "Estado"
        tipo: "Catálogo"
        longitud: 10
        obligatorio: "Sí"
        formato: "ACTIVO, INACTIVO"
        ejemplo: "ACTIVO"
  - numero: 2
    codigo: carreras
    nombre: "Carreras"
    archivo: 02_carreras.csv
    dependeDe: [1]
    obligatoriedad: OBLIGATORIA
    columnas:
      - campo: codigo_carrera
        descripcion: "Código SENESCYT de la carrera"
        tipo: "Texto"
        longitud: 20
        obligatorio: "Sí"
        formato: "Ej.: 550613A01-P-0301"
        clave: "PK"
        validacion: "Único"
        ejemplo: "550613A01-P-0301"
      - campo: nombre
        descripcion: "Nombre de la carrera"
        tipo: "Texto"
        longitud: 150
        obligatorio: "Sí"
        formato: "Mayúsculas"
        ejemplo: "DESARROLLO DE SOFTWARE"
      - campo: siglas
        descripcion: "Siglas"
        tipo: "Texto"
        longitud: 10
        obligatorio: "Sí"
        validacion: "Única"
        ejemplo: "DS"
      - campo: codigo_unidad_sede
        descripcion: "Sede, extensión o campus donde se oferta"
        tipo: "Texto"
        longitud: 20
        obligatorio: "Sí"
        clave: "FK → 01.codigo_unidad"
        validacion: "La unidad debe ser SEDE_MATRIZ, SEDE, EXTENSION o CAMPUS"
        ejemplo: "MATRIZ"
      - campo: nivel_formacion
        descripcion: "Nivel de formación"
        tipo: "Catálogo"
        longitud: 40
        obligatorio: "Sí"
        formato: "TECNICO_SUPERIOR, TECNOLOGICO_SUPERIOR, TECNOLOGICO_SUPERIOR_UNIVERSITARIO"
        ejemplo: "TECNOLOGICO_SUPERIOR"
      - campo: modalidad
        descripcion: "Modalidad de estudios"
        tipo: "Catálogo"
        longitud: 15
        obligatorio: "Sí"
        formato: "PRESENCIAL, SEMIPRESENCIAL, EN_LINEA, A_DISTANCIA, DUAL, HIBRIDA"
        validacion: "RRA art. 54"
        ejemplo: "PRESENCIAL"
      - campo: jornadas
        descripcion: "Jornadas en que se oferta"
        tipo: "Lista (;)"
        longitud: 60
        obligatorio: "Sí"
        formato: "MATUTINA; VESPERTINA; NOCTURNA; INTENSIVA"
        ejemplo: "MATUTINA; NOCTURNA"
      - campo: campo_amplio
