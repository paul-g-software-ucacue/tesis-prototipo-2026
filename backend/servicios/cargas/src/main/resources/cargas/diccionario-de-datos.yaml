# Diccionario de datos de las 10 cargas (RF-05, ERS §8.3; glosario «Diccionario de datos»).
# Transcrito una sola vez de las listas L, CONV y CAT de cargas/scripts/build_diccionario.py
# (ERS v2.1) con specs/018-plantillas-carga. De aquí salen la plantilla y el diccionario de cada
# carga, y con esto se validarán las cargas (F01-H02). Si la ERS cambia, se cambia este archivo;
# las pruebas comparan los encabezados con los de cargas/plantillas/ (anexo-ers-encabezados.csv).
# Cambios frente a la ERS: «hoja Catálogos» e «índice» remiten a los valores permitidos y a
# «Depende de», porque esas hojas no viajan con los CSV; las listas de los catálogos se separan en
# valores; el ejemplo de cada columna es el de la primera fila de cargas/ejemplos/ con valor, y
# los escritos a mano lo dicen en su comentario (research §4). Los datos son ficticios.
# Desde F03-H05, el catálogo CARGOS lista los 16 cargos de gestor G06 a G21 en lugar del rango de
# la ERS (D-73).
fuente: "ERS v2.1, sección 8.3 y anexo cargas/"
convenciones:
  - tema: "Formato de archivo"
    regla: "CSV (UTF-8, con encabezado en la primera fila) o XLSX (una hoja, mismos encabezados). Se recomienda XLSX para evitar problemas de separadores."
  - tema: "Separador de columnas CSV"
    regla: "Coma (,) según RFC 4180. El sistema también detecta punto y coma (;) si el encabezado lo usa."
  - tema: "Encabezados"
    regla: "Exactamente los nombres de la columna «campo», en minúsculas y en el mismo orden de la plantilla."
  - tema: "Comillas"
    regla: "Si un valor contiene el separador, comillas o saltos de línea, debe ir entre comillas dobles. Duplicar las comillas internas."
  - tema: "Listas"
    regla: "Varios valores en una celda se separan con «;». Cuando cada elemento tiene partes, se separan con «|». Ej.: «MÁSTER EN X|MAESTRIA|061|2022; DOCTORADO EN Y|DOCTORADO|061|2025»."
  - tema: "Fechas"
    regla: "aaaa-mm-dd (ISO 8601)."
  - tema: "Decimales"
    regla: "Punto como separador decimal (ej.: 2.5). Sin separador de miles."
  - tema: "Booleanos"
    regla: "S o N."
  - tema: "Catálogos"
    regla: "Se escriben con el código exacto en mayúsculas (ver los valores permitidos de cada columna). El sistema puede mapear etiquetas equivalentes si se configura (RF-08)."
  - tema: "Cédula"
    regla: "Siempre como texto de 10 dígitos, conservando el 0 inicial. En Excel, formatear la columna como Texto antes de pegar."
  - tema: "Campos opcionales vacíos"
    regla: "Dejar la celda vacía (no escribir NA ni guiones)."
  - tema: "Datos de prueba"
    regla: "Usar solo datos ficticios (RNF-SEG-06). Las cédulas de los ejemplos son ficticias con dígito verificador válido."
  - tema: "Orden de carga"
    regla: "1 → 10, respetando «Depende de» de cada carga."
