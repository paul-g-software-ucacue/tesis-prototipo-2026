// Servicio academico del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
}

dependencies {
    // Abrir el periodo con su versión de normativa, por la interfaz publicada de Normativa: solo
    // ec.mdd.normativa.puertos.entrada (F02-H01, research §4; como Usuarios con Roles).
    implementation project(':servicios:normativa')
    // Los periodos en el esquema academico, con JdbcClient, como Normativa (F02-H01).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // El detalle de cada cambio en jsonb (FR-008).
    implementation 'tools.jackson.core:jackson-databind'
    // @PreAuthorize y el usuario de la sesión que hace el cambio (ADR-021, FR-007).
    implementation 'org.springframework.security:spring-security-core'
}
