// Servicio usuarios del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
}

def versionBouncyCastle = providers.gradleProperty('versionBouncyCastle').get()

dependencies {
    // Roles y permisos de cada usuario, por la interfaz publicada de Roles (research §2).
    implementation project(':servicios:roles')
    // Usuarios en el esquema usuarios (research §7 de B00-H03).
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // Argon2id para las contraseñas; necesita BouncyCastle (research §7).
    implementation 'org.springframework.security:spring-security-crypto'
    implementation "org.bouncycastle:bcprov-jdk18on:${versionBouncyCastle}"
    // Firma de los tokens RS256 y lectura del JWT en la sesión actual (ADR-014).
    implementation 'org.springframework.security:spring-security-oauth2-jose'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
}

testing {
    suites {
        integrationTest {
            dependencies {
                // @DataJpaTest contra PostgreSQL de Testcontainers.
                implementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
            }
        }
    }
}
