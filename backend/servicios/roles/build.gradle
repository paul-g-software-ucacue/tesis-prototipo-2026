// Servicio roles del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
}

dependencies {
    // Cada cambio también como un evento hacia la bitácora de Usuarios, en la misma transacción;
    // dentro de identidad se entrega sin HTTP (F17-H01, ADR-024).
    implementation project(':plataforma:eventos')
    // Roles, permisos y asignaciones de rol en el esquema roles, con JdbcClient (research §11).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // El detalle de cada cambio en jsonb (FR-011).
    implementation 'tools.jackson.core:jackson-databind'
    // @PreAuthorize y el usuario de la sesión que hace el cambio (ADR-021, FR-011).
    implementation 'org.springframework.security:spring-security-core'
}
