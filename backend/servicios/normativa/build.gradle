// Servicio normativa del MDD, creado desde backend/plantillas/servicio (ADR-012).
// mdd.servicio aplica las reglas de las cinco capas, la cobertura del 60 % (D-32), Spotless y
// SpotBugs. Vale para todos los servicios, centrales o no.
plugins {
    id 'mdd.servicio'
    id 'mdd.contrato'
}

dependencies {
    // Las versiones de normativa en el esquema normativa, con JdbcClient (F04-H01, research §2).
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // El detalle de cada cambio en jsonb (F04-H02, FR-009).
    implementation 'tools.jackson.core:jackson-databind'
    // @PreAuthorize y el usuario de la sesión que hace el cambio (ADR-021, FR-009).
    implementation 'org.springframework.security:spring-security-core'
}
