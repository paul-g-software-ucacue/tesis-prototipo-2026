# Proceso identidad del MDD. Se conecta con el rol de su proceso (ADR-013, contracts/compose.md).
spring.application.name: identidad
spring.datasource.username: identidad
spring.datasource.password: ${DB_CLAVE_IDENTIDAD}
spring.datasource.url: ${SPRING_DATASOURCE_URL}
server.port: 8080
# Llave pública de Usuarios para validar los tokens (ADR-014).
# Identidad valida sus propios tokens con su JWKS, en el mismo contenedor (ADR-014).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: http://localhost:8080/api/usuarios/jwks
# Sin token: el inicio de sesión (D-37), el JWKS, que piden el API Gateway y los demás procesos,
# y el token de proceso, que piden los procesos que entregan eventos (D-49, ADR-018).
mdd.seguridad.rutas-publicas:
  - POST /api/usuarios/sesion
  - GET /api/usuarios/jwks
  - POST /interno/usuarios/token-proceso
# Claves de los procesos que pueden pedir un token de proceso (D-49). Vacía, el proceso no puede.
mdd.usuarios.procesos.distributivo.clave: ${MDD_CLAVE_PROCESO_DISTRIBUTIVO:}
# Llave de firma: sin archivo, efímera (research §2); en el equipo de demostración, un PEM (D-55).
mdd.usuarios.llave-privada: ${MDD_LLAVE_PRIVADA:}
# Usuario de prueba autor.prueba, solo donde se habilita (research §8).
mdd.usuarios.usuario-prueba.habilitado: ${MDD_USUARIO_PRUEBA_HABILITADO:false}
mdd.usuarios.usuario-prueba.clave: ${MDD_USUARIO_PRUEBA_CLAVE:}
# Contraseñas de los usuarios de la demo (D-59): el archivo usuario=clave del equipo de
# demostración o, sin archivo, la clave común de local y CI. Sin ninguna, no se crean.
mdd.usuarios.demo.claves: ${MDD_USUARIOS_DEMO_CLAVES:}
mdd.usuarios.demo.clave: ${MDD_USUARIOS_DEMO_CLAVE:}
# Bloqueo por intentos (D-60) y máximo de una sesión renovándose (ADR-020): los valores por
# defecto de PropiedadesUsuarios (5 intentos, 15 minutos y 8 horas).
# Flyway es el único que cambia el esquema; Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto: validate
spring.jpa.open-in-view: false
# Solo la salud, con readiness que incluye la base: el proceso no queda sano sin PostgreSQL.
management.endpoints.web.exposure.include: health
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,db
