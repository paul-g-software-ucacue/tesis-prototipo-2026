// Proceso datos del MDD, creado desde backend/plantillas/aplicacion (ADR-006, ADR-012).
plugins {
    id 'mdd.aplicacion'
}

dependencies {
    // Servidor web para la salud de Actuator y un DataSource con el rol del proceso (ADR-013).
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    // JWT RS256 validado por el propio proceso y el 401 uniforme (ADR-014).
    implementation project(':plataforma:seguridad')
    // Un solo @RestControllerAdvice por proceso y la página /error (ADR-016).
    implementation project(':plataforma:errores')
    // Registro de publicaciones, entrega y reenvío de eventos hacia otros procesos: Académico avisa a
    // Roles de cada periodo (F05-H03, ADR-018).
    implementation project(':plataforma:eventos')
    // El lenguaje publicado de las cargas (ADR-022): Cargas y sus tres dueños de este proceso se
    // entienden con él (F01-H04).
    implementation project(':plataforma:lenguaje-cargas')

    // Servicios que ensambla este proceso (ADR-006).
    implementation project(':servicios:cargas')
    implementation project(':servicios:docentes')
    implementation project(':servicios:academico')
    implementation project(':servicios:normativa')
}
