// Proceso salida del MDD, creado desde backend/plantillas/aplicacion (ADR-006, ADR-012).
plugins {
    id 'mdd.aplicacion'
}

dependencies {
    // Servidor web para la salud de Actuator y un DataSource con el rol del proceso (ADR-013).
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'org.postgresql:postgresql'
    // JWT RS256 validado por el propio proceso y el 401 uniforme (ADR-014).
    implementation project(':plataforma:seguridad')
    // Un solo @RestControllerAdvice por proceso y la página /error (ADR-016).
    implementation project(':plataforma:errores')
    // Registro de publicaciones, entrega y reenvío de eventos hacia otros procesos, y consultas por
    // las rutas internas (ADR-018, ADR-023): Reporting registra cada descarga en la bitácora y lee
    // Aprobación y Generación (F20-H01, D-115).
    implementation project(':plataforma:eventos')

    // Servicios que ensambla este proceso (ADR-006).
    implementation project(':servicios:reporting')
    implementation project(':servicios:dashboard')
}
