# Proceso distributivo del MDD. Se conecta con el rol de su proceso (ADR-013, contracts/compose.md).
spring.application.name: distributivo
spring.datasource.username: distributivo
spring.datasource.password: ${DB_CLAVE_DISTRIBUTIVO}
spring.datasource.url: ${SPRING_DATASOURCE_URL}
server.port: 8080
# Llave pública de Usuarios para validar los tokens (ADR-014).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${MDD_JWKS_URI:http://identidad:8080/api/usuarios/jwks}
# Solo la salud, con readiness que incluye la base: el proceso no queda sano sin PostgreSQL.
management.endpoints.web.exposure.include: health
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,db
# Eventos hacia otros procesos (principio V, ADR-018): el registro de publicaciones vive en
# eventos_distributivo y lo migra flywayEventos; la creación de Spring Modulith queda apagada.
spring.modulith.events.jdbc.schema: eventos_distributivo
spring.modulith.events.jdbc.schema-initialization.enabled: false
# Las completadas se conservan con su completion_date; el reenvío lo hace la tarea programada,
# también después de un reinicio.
spring.modulith.events.completion-mode: update
spring.modulith.events.republish-outstanding-events-on-restart: false
# Publicaciones atascadas por una caída a mitad de una entrega: pasan a FAILED y se reenvían.
spring.modulith.events.staleness.published: PT2M
spring.modulith.events.staleness.processing: PT2M
spring.modulith.events.staleness.resubmitted: PT2M
mdd.eventos.plazo: PT5S
mdd.eventos.reenvio.intervalo: PT30S
mdd.eventos.destinos.usuarios: ${MDD_URI_IDENTIDAD:http://identidad:8080}/interno/usuarios/eventos
mdd.eventos.token-proceso: ${MDD_URI_IDENTIDAD:http://identidad:8080}/interno/usuarios/token-proceso
mdd.eventos.proceso: distributivo
# El informe sustentado: 10 MB, que limita el dominio, más la envoltura del formulario (D-88).
spring.servlet.multipart.max-file-size: 11MB
spring.servlet.multipart.max-request-size: 11MB
# Los archivos del negocio, en el volumen archivos (D-88). La carpeta se crea al guardar.
mdd.archivos.raiz: ${MDD_ARCHIVOS_RAIZ:/var/mdd/archivos}
# Las consultas a los procesos datos e identidad, por sus rutas internas (ADR-023).
mdd.procesos.datos: ${MDD_URI_DATOS:http://datos:8080}
mdd.procesos.identidad: ${MDD_URI_IDENTIDAD:http://identidad:8080}
# Clave del proceso (D-49); vacía, el proceso arranca y las entregas fallan hasta configurarla.
mdd.eventos.clave: ${MDD_CLAVE_PROCESO_DISTRIBUTIVO:}
