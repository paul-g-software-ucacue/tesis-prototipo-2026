// Núcleo del modelo de errores (ADR-016): el modelo público, el catálogo, los códigos comunes, el
// saneo de las trazas y el idIncidente. No depende de servlet ni de WebFlux, para que lo usen los
// procesos (plataforma:errores), el API Gateway y los adaptadores de los servicios.
plugins {
    id 'java-library'
    id 'mdd.java-conventions'
}

dependencies {
    // @JsonInclude en RespuestaError: los campos sin valor no se envían.
    api 'com.fasterxml.jackson.core:jackson-annotations'
    // @NamedInterface: los servicios usan este paquete sin violar los límites de Spring Modulith.
    implementation 'org.springframework.modulith:spring-modulith-api'
}
