versionSpringBoot=4.1.1
# Línea de Spring Modulith para Spring Boot 4.1 (research §1).
versionSpringModulith=2.1.1
# La misma versión de ArchUnit que trae Spring Modulith 2.1.1 (research §4).
versionArchUnit=1.4.2
# Primera línea compatible con Spring Boot 4.1 desde 2025.1.2; trae Gateway 5.0.3 (research §5).
versionSpringCloud=2025.1.3
# Por encima del BOM de Spring Boot 4.1.1, que trae Tomcat 11.0.24 y Jackson 3.1.5 con
# vulnerabilidades críticas y altas ya corregidas (Grype, etapa 4 · sca). Quitar cuando el BOM
# de Spring Boot traiga estas versiones o posteriores.
versionTomcat=11.0.27
versionJackson=3.1.7
# Jackson 2, que trae openapi-request-validator a plataforma:pruebas: 2.21.5 del BOM tiene
# vulnerabilidades altas corregidas en 2.21.7 (Grype, B00-H03).
versionJackson2=2.21.7
# Guava, que también trae openapi-request-validator a plataforma:pruebas: la 32.1.3-android tiene
# GHSA-xxph-c9ww-hj94 (alta), corregida en la 33.7.2-android, del 2026-09-29 (Grype, F01-H05).
versionGuava=33.7.2-android
# Argon2PasswordEncoder la necesita y no está en el BOM de Spring Boot (B00-H03, research §7).
versionBouncyCastle=1.86
# Generación de interfaces desde contratos/; la 7.26.0 tenía una semana (ADR-015, research §11).
versionOpenApiGenerator=7.25.0
# openapi-request-validator-core, antes swagger-request-validator; solo en pruebas (research §11).
versionValidadorOpenApi=3.0.0
# Spike B00-S01, solo en las pruebas del servicio firma (D-44, research §2): PDFBox lee y firma
# PAdES; OpenHTMLtoPDF 1.1.87 es la última con más de dos semanas (1.1.88 a 1.1.97 salieron entre
# el 7 y el 9/10/2026); veraPDF 1.30.2, porque la 1.30.3 tiene cinco días.
versionPdfbox=3.0.8
versionOpenHtmlToPdf=1.1.87
versionVeraPdf=1.30.2
# F01-H02: lee los XLSX de las cargas, solo en el adaptador de Cargas (research §5). La 6.0.0
# salió el 19/10/2026 y no cumple las dos semanas; la 5.5.1 es del 26/11/2025.
versionApachePoi=5.5.1
org.gradle.caching=true
org.gradle.parallel=true
