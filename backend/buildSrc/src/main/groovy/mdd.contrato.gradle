// Interfaces generadas desde contratos/ (principio IV, ADR-015). Lo aplica cada servicio con
// contrato, junto con mdd.servicio: el controlador implementa la interfaz generada, así que si no
// cumple contratos/<servicio>/openapi.yaml, no compila.
plugins {
    id 'org.openapi.generator'
}

def contratos = rootProject.file('../contratos')
def generado = layout.buildDirectory.dir('generated/openapi')
def paquete = "ec.mdd.${project.name}.adaptadores.entrada.api"

openApiGenerate {
    generatorName = 'spring'
    inputSpec = new File(contratos, "${project.name}/openapi.yaml").absolutePath
    outputDir = generado.get().asFile.absolutePath
    apiPackage = paquete
    modelPackage = paquete
    validateSpec = true
    // Solo interfaces y modelos: ApiUtil y los demás archivos de soporte no hacen falta.
    globalProperties = [apis: '', models: '']
    generateApiTests = false
    generateModelTests = false
    generateApiDocumentation = false
    generateModelDocumentation = false
    configOptions = [
            interfaceOnly        : 'true',
            useSpringBoot4       : 'true',
            useJackson3          : 'true',
            skipDefaultInterface : 'true',
            useTags              : 'true',
            openApiNullable      : 'false',
            // Valida los cuerpos según el contrato; los errores responden 400 con detalles (ADR-016).
            useBeanValidation    : 'true',
            documentationProvider: 'none',
            annotationLibrary    : 'none',
            // Los campos opcionales sin valor no se envían: el contrato no los declara nullable
            // (por ejemplo, detalles e idIncidente en un 401).
            containerDefaultToNull       : 'true',
            additionalModelTypeAnnotations:
                    '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)',
    ]
}

tasks.named('openApiGenerate') {
    // Los contratos referencian contratos/comun/: un cambio ahí también regenera.
    inputs.dir(new File(contratos, 'comun'))
}

sourceSets.main.java.srcDir(generado.map { it.dir('src/main/java') })

tasks.named('compileJava') {
    dependsOn 'openApiGenerate'
}

dependencies {
    implementation 'org.springframework:spring-web'
    implementation 'com.fasterxml.jackson.core:jackson-annotations'
    implementation 'jakarta.annotation:jakarta.annotation-api'
    // Restricciones de los modelos generados (@NotNull, @Size…) y su validación en ejecución.
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // CatalogoDeErrores, para registrar los errores del servicio (ADR-016).
    implementation project(':plataforma:errores-nucleo')
}

testing {
    suites {
        test {
            dependencies {
                // Pruebas de contrato con MockMvc y el validador de plataforma:pruebas. La seguridad
                // da el 401 del contrato y plataforma:errores, los demás errores.
                implementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
                implementation 'org.springframework.security:spring-security-test'
                implementation project(':plataforma:pruebas')
                implementation project(':plataforma:seguridad')
                implementation project(':plataforma:errores')
            }
        }
    }
}

// El código generado no cuenta para la cobertura: lo garantiza el contrato, no las pruebas.
['jacocoTestReport', 'jacocoTestCoverageVerification'].each { nombre ->
    tasks.named(nombre) {
        classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
            exclude '**/adaptadores/entrada/api/**'
        })
    }
}
