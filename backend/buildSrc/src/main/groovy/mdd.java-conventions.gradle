// Convención común de los 12 servicios, las 4 aplicaciones y el gateway.
import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java'
    id 'jacoco'
    id 'jvm-test-suite'
    id 'com.diffplug.spotless'
    id 'com.github.spotbugs'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

def versionSpringBoot = providers.gradleProperty('versionSpringBoot').get()
def versionSpringModulith = providers.gradleProperty('versionSpringModulith').get()

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${versionSpringBoot}")
    // Spring Modulith 2.1 es la línea de Spring Boot 4.1; su BOM no viene en el de Boot (research §1).
    implementation platform("org.springframework.modulith:spring-modulith-bom:${versionSpringModulith}")
    // Reglas de seguridad para SpotBugs: inyección SQL, XSS, XXE, criptografía débil, deserialización.
    spotbugsPlugins 'com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0'
}

testing {
    suites {
        // Unitarias, de arquitectura y de contrato: sin Docker, en cada pull request.
        test {
            useJUnitJupiter()
            dependencies {
                implementation platform("org.springframework.boot:spring-boot-dependencies:${versionSpringBoot}")
                implementation platform("org.springframework.modulith:spring-modulith-bom:${versionSpringModulith}")
                // JUnit Jupiter 6 (D-28), AssertJ y Mockito. Mockito solo en la capa de aplicación (DS-2).
                implementation 'org.springframework.boot:spring-boot-starter-test'
            }
        }
        // Adaptadores con PostgreSQL real (Testcontainers).
        integrationTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
                implementation platform("org.springframework.boot:spring-boot-dependencies:${versionSpringBoot}")
                implementation platform("org.springframework.modulith:spring-modulith-bom:${versionSpringModulith}")
                implementation 'org.springframework.boot:spring-boot-starter-test'
                implementation 'org.springframework.boot:spring-boot-testcontainers'
                implementation 'org.testcontainers:testcontainers-postgresql'
            }
            targets {
                all {
                    testTask.configure { shouldRunAfter(test) }
                }
            }
        }
    }
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

// Cobertura de cada módulo: 60 % de líneas, el único umbral, también en el dominio central (D-32).
tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 0.60
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        // google-java-format con el estilo AOSP (sangría de 4 espacios), versión fijada (D-33).
        // Usa el analizador de javac y soporta toda la sintaxis de Java 25.
        googleJavaFormat('1.36.1').aosp()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// Análisis estático del código propio (etapa 1). Solo el código de main: las pruebas no van a producción.
spotbugs {
    // SpotBugs 4.10.4 trae ASM 9.10.1, que lee las clases de Java 25 (research §3).
    toolVersion = '4.10.4'
    ignoreFailures = false
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('HIGH')   // falla solo con hallazgos de confianza alta
    excludeFilter = rootProject.file('config/spotbugs/excluir.xml')
}

tasks.named('spotbugsTest') {
    enabled = false
}

tasks.named('spotbugsIntegrationTest') {
    enabled = false
}

tasks.named('spotbugsMain') {
    reports {
        html.required = true
        xml.required = false
    }
}
