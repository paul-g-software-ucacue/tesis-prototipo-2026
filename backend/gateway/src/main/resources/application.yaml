# API Gateway del MDD: enruta /api/** a los 4 procesos y valida el JWT antes de reenviar
# (ADR-006, ADR-014; research §10). Los destinos se pueden cambiar con variables (B00-H08).
spring.application.name: gateway
server.port: 8080
spring.cloud.gateway.server.webflux.routes:
  - id: identidad
    uri: ${MDD_URI_IDENTIDAD:http://identidad:8080}
    predicates:
      - Path=/api/usuarios/**,/api/roles/**,/api/notificaciones/**
  - id: datos
    uri: ${MDD_URI_DATOS:http://datos:8080}
    predicates:
      - Path=/api/cargas/**,/api/docentes/**,/api/academico/**,/api/normativa/**
  - id: distributivo
    uri: ${MDD_URI_DISTRIBUTIVO:http://distributivo:8080}
    predicates:
      - Path=/api/generacion/**,/api/validacionocs/**,/api/firma/**
  - id: salida
    uri: ${MDD_URI_SALIDA:http://salida:8080}
    predicates:
      - Path=/api/reporting/**,/api/dashboard/**
# Llave pública de Usuarios y emisor de los tokens (ADR-014).
spring.security.oauth2.resourceserver.jwt.jwk-set-uri: ${MDD_JWKS_URI:http://identidad:8080/api/usuarios/jwks}
mdd.seguridad.emisor: mdd-usuarios
management.endpoints.web.exposure.include: health
management.endpoint.health.probes.enabled: true
